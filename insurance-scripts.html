      btn.closest('.card').classList.toggle('open');
    });
  });

  main.querySelectorAll('.obj-group-head').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.obj-group').classList.toggle('open');
    });
  });

  main.querySelectorAll('.quick-jump-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const target = document.getElementById(chip.dataset.target);
      if(!target) return;
      target.classList.add('open');
      const group = target.closest('.obj-group');
      if(group) group.classList.add('open');
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
    });
  });

  const noObjBtn = document.getElementById('no-objection-jump');
  if(noObjBtn){
    noObjBtn.addEventListener('click', ()=>{
      const part2 = document.getElementById('part-2-block');
      if(part2) part2.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  main.querySelectorAll('[data-checklist]').forEach(block=>{
    const items = block.querySelectorAll('[data-checklist-item]');
    const progress = block.querySelector('[data-progress]');
    const total = items.length;

    function updateProgress(){
      let checkedCount = 0;
      items.forEach(item=>{
        const cb = item.querySelector('input[type="checkbox"]');
        if(cb.checked){
          item.classList.add('checked');
          checkedCount++;
        } else {
          item.classList.remove('checked');
        }
      });
      progress.textContent = `${checkedCount}/${total}`;
      progress.classList.toggle('complete', checkedCount === total);
    }

    items.forEach(item=>{
      const cb = item.querySelector('input[type="checkbox"]');
      cb.addEventListener('change', ()=>{
        checklistState[cb.id] = cb.checked;
        updateProgress();
        updateEligibilityResult();
      });
    });

    const resetBtn = block.querySelector('[data-checklist-reset]');
    if(resetBtn){
      resetBtn.addEventListener('click', ()=>{
        items.forEach(item=>{
          const cb = item.querySelector('input[type="checkbox"]');
          cb.checked = false;
          checklistState[cb.id] = false;
        });
        updateProgress();
        updateEligibilityResult();
      });
    }
  });

  function updateEligibilityResult(){
    const resultEl = main.querySelector('[data-eligibility-result]');
    if(!resultEl) return;
    resultEl.outerHTML = renderEligibilityResult();
  }

  const signalTally = main.querySelector('[data-signal-tally]');
  main.querySelectorAll('[data-signal-cb]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      checklistState[cb.id] = cb.checked;
      const chip = cb.closest('[data-signal-chip]');
      if(chip) chip.classList.toggle('checked', cb.checked);
      if(signalTally){
        ['ma','medsupp','ppo'].forEach(lean=>{
          const count = [...main.querySelectorAll(`[data-signal-cb][data-lean="${lean}"]`)].filter(c=>c.checked).length;
          const el = signalTally.querySelector(`[data-tally="${lean}"]`);
          if(el) el.textContent = count;
        });
      }
    });
  });
}

function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function computeEligibility(){
  const hasA = !!checklistState['elig-parta'];
  const hasB = !!checklistState['elig-partb'];
  const hasMedicaid = !!checklistState['elig-medicaid'];

  if(hasA && hasB){
    if(hasMedicaid){
      return {
        state: 'blocked',
        eligibleFor: ['Part D', 'Medicare Advantage / MAPD'],
        notEligibleFor: [{item:'Medicare Supplement', reason:'has Medicaid'}]
      };
    }
    return {
      state: 'full',
      eligibleFor: ['Part D', 'Medicare Advantage / MAPD', 'Medicare Supplement'],
      notEligibleFor: []
    };
  }
  if(hasA || hasB){
    return {
      state: 'partial',
      eligibleFor: ['Part D (standalone)'],
      notEligibleFor: [{item:'Medicare Advantage / MAPD', reason:`only has Part ${hasA ? 'A' : 'B'}`}, {item:'Medicare Supplement', reason:`only has Part ${hasA ? 'A' : 'B'}`}]
    };
  }
  return {
    state: 'unknown',
    eligibleFor: [],
    notEligibleFor: [],
    unknownText: 'Check Part A and Part B above to see what they qualify for.'
  };
}

function renderEligibilityResult(){
  const r = computeEligibility();
  return `
    <div class="eligibility-result state-${r.state}" data-eligibility-result>
      <span class="result-label">Auto-determined eligibility</span>
      ${r.unknownText ? `<p class="elig-line elig-unknown">❔ ${r.unknownText}</p>` : ''}
      ${r.eligibleFor.length ? `<p class="elig-line elig-good">✅ Eligible for: ${r.eligibleFor.join(', ')}</p>` : ''}
      ${r.notEligibleFor.map(n => `<p class="elig-line elig-bad">🚫 Not eligible for: ${n.item} — ${n.reason}</p>`).join('')}
    </div>
  `;
}

function renderChecklist(items, title, accent){
  if(!items || items.length === 0) return '';
  const checkedCount = items.filter(item => checklistState[item.id]).length;
  const accentClass = accent ? `accent-${accent}` : '';
  return `
    <div class="checklist-block ${accentClass}" data-checklist>
      <div class="checklist-header">
        <span class="checklist-title">${title}</span>
        <span class="checklist-progress ${checkedCount === items.length ? 'complete' : ''}" data-progress>${checkedCount}/${items.length}</span>
      </div>
      ${items.map(item=>`
        <div class="checklist-item ${checklistState[item.id] ? 'checked' : ''}" data-checklist-item>
          <input type="checkbox" id="${item.id}" ${checklistState[item.id] ? 'checked' : ''}>
          <label for="${item.id}">${item.label}</label>
        </div>
      `).join('')}
      <button class="checklist-reset" type="button" data-checklist-reset>Reset checklist</button>
    </div>
  `;
}

function renderSignalRow(signals){
  if(!signals || signals.length === 0) return '';
  return `
    <div class="signal-row">
      ${signals.map(s => `
        <label class="signal-chip lean-${s.lean} ${checklistState[s.id] ? 'checked' : ''}" data-signal-chip>
          <input type="checkbox" id="${s.id}" data-signal-cb data-lean="${s.lean}" ${checklistState[s.id] ? 'checked' : ''}>
          ${s.label}
        </label>
      `).join('')}
    </div>
  `;
}

function renderSignalTally(questions){
  const allSignals = (questions||[]).flatMap(q => q.signals || []);
  if(allSignals.length === 0) return '';
  const count = lean => allSignals.filter(s => s.lean === lean && checklistState[s.id]).length;
  return `
    <div class="signal-tally" data-signal-tally>
      <span class="signal-tally-label">Leaning</span>
      <span class="tally-chip lean-ma">MA/MAPD <span data-tally="ma">${count('ma')}</span></span>
      <span class="tally-chip lean-medsupp">Med Supp <span data-tally="medsupp">${count('medsupp')}</span></span>
      <span class="tally-chip lean-ppo">PPO <span data-tally="ppo">${count('ppo')}</span></span>
    </div>
  `;
}

          ${filtered.map(o=>`
            <div class="card branch-card ${openClass}" id="obj-${slugify(o.q)}">
              <button class="card-q">
                <span class="qtext">${o.q}</span>
                <span class="chevron">›</span>
              </button>
              <div class="card-a">
                <div class="card-a-inner">
                  <div class="say-label">You say</div>
                  <p>${o.a}</p>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderObjectionGroups(groups){
  return groups.map((g, gi)=>{
    const filtered = g.items.filter(matchesSearch);
    if(searchTerm && filtered.length === 0) return '';
    const openClass = searchTerm ? 'open' : '';
    return `
      <div class="obj-group ${openClass}" data-gidx="${gi}">
        <button class="obj-group-head">
          <span>${g.section} <span class="count">${filtered.length}</span></span>
          <span class="chevron">›</span>
        </button>
        <div class="obj-group-body">
          <div class="obj-group-body-inner">
            ${filtered.map((o,i)=>`
              <div class="card answered ${openClass}" id="obj-${slugify(o.q)}" data-idx="${gi}-${i}">
                <button class="card-q">
                  <span class="qtext">${o.q}</span>
                  <span class="chevron">›</span>
                </button>
                <div class="card-a">
                  <div class="card-a-inner">
                    <div class="say-label">You say</div>
                    <p>${o.a}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderFramework(main, cat){
  let html = `
    <div class="category-head">
      <h2>${cat.label}</h2>
      <span class="category-tagline">${cat.tagline}</span>
    </div>
    <p class="category-desc">${cat.desc}</p>
    <div class="opening"><p>${cat.opening}</p></div>
    <div class="fw-intro">${cat.fwIntro}</div>
    <p class="section-label">The three questions</p>
  `;

  html += cat.questions.map((q,i)=>`
    <div class="fw-step">
      <div class="fw-step-num">${i+1}</div>
      <div class="fw-step-rail">
        <div class="fw-card">
          <div class="fw-step-title">${q.title}</div>
          <p class="fw-ask">${q.ask}</p>
          <div class="fw-answers">
            <div class="fw-answer bad"><span class="tag">Bad answer</span><p>${q.bad}</p></div>
            <div class="fw-answer good"><span class="tag">Good answer</span><p>${q.good}</p></div>
          </div>
          <div class="fw-followup"><span class="tag">If they stall</span>${q.followUp}</div>
        </div>
      </div>
    </div>
  `).join('');

  html += `
    <div class="fw-close">
      <div class="fw-close-head">
        <h3>The close</h3>
        <span class="fw-close-sub">Stack the value, price last</span>
      </div>
      <p class="fw-close-intro">${cat.close.intro}</p>
      ${cat.close.options.map(o=>`
        <div class="fw-option">
          <div class="fw-option-name">${o.name}</div>
          <p class="fw-option-stack">${o.stack}</p>
          <div class="fw-option-price">${o.price}</div>
        </div>
      `).join('')}
    </div>
  `;

  main.innerHTML = html;
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  renderMain();
});

renderTabs();
renderMain();
</script>
</body>
</html>
