<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbook — Insurance Scripts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#16233A;
    --ink-soft:#2B3A54;
    --paper:#FAF8F3;
    --paper-dim:#F0ECE2;
    --line: rgba(22,35,58,0.12);
    --gold:#C89B3C;
    --teal:#3E6C6C;
    --red:#A33D3D;
    --shadow: 0 8px 24px rgba(22,35,58,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  .app{
    max-width:1100px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
  }

  /* HEADER */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:28px 24px 22px;
    position:relative;
    border-bottom:4px solid var(--gold);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{
    color:rgba(250,248,243,0.65);
    font-size:14px;
    max-width:520px;
    line-height:1.5;
  }

  /* SEARCH */
  .searchbar{
    margin-top:18px;
    display:flex;
    gap:8px;
  }
  .searchbar input{
    flex:1;
    background:rgba(250,248,243,0.08);
    border:1px solid rgba(250,248,243,0.22);
    color:var(--paper);
    padding:11px 14px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .searchbar input::placeholder{color:rgba(250,248,243,0.45);}
  .searchbar input:focus{outline:2px solid var(--gold); outline-offset:1px;}

  /* TABS */
  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:16px 24px;
    background:var(--paper-dim);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:8px 13px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{border-color:var(--gold);}
  .tab-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .tab-btn .count{
    opacity:.55;
    margin-left:5px;
  }

  /* MAIN */
  main{padding:26px 24px 60px;}

  .category-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:4px;
  }
  .category-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  .category-tagline{
    font-size:13px;
    color:var(--ink-soft);
    opacity:.7;
  }
  .category-desc{
    font-size:14px;
    color:var(--ink-soft);
    max-width:640px;
    line-height:1.6;
    margin:10px 0 22px;
  }

  /* OPENING SCRIPT CARD */
  .opening{
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:28px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .opening::before{
    content:"OPENING SCRIPT";
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.15em;
    color:var(--gold);
    display:block;
    margin-bottom:10px;
  }
  .opening p{
    margin:0;
    font-size:15.5px;
    line-height:1.65;
    font-family:'Fraunces',serif;
    font-weight:400;
  }
  .opening p + p{margin-top:12px;}

  /* ===== REQUIRED COMPLIANCE DISCLOSURE ===== */
  .compliance{
    background:#fff;
    border:2px solid var(--red);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:22px;
    position:relative;
  }
  .compliance-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:10px;
  }
  .compliance-label::before{
    content:"⚠";
    font-size:13px;
  }
  .compliance p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    font-weight:500;
  }
  .compliance-note{
    margin-top:10px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* ===== ELIGIBILITY CHECKLIST ===== */
  .checklist-block{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--teal);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:22px;
  }
  .checklist-block.accent-gold{border-left-color:var(--gold);}
  .checklist-block.accent-red{border-left-color:var(--red);}
  .checklist-block.accent-gold .checklist-title{color:#8A6D1A;}
  .checklist-block.accent-red .checklist-title{color:var(--red);}
  .checklist-block.accent-gold .checklist-progress.complete{background:var(--gold); color:var(--ink);}
  .checklist-block.accent-red .checklist-progress.complete{background:var(--red); color:#fff;}
  .checklist-block.accent-gold .checklist-item input[type="checkbox"]:checked{background:var(--gold); border-color:var(--gold);}
  .checklist-block.accent-red .checklist-item input[type="checkbox"]:checked{background:var(--red); border-color:var(--red);}
  .checklist-block.accent-gold .checklist-item input[type="checkbox"]:checked::after{color:var(--ink);}
  .recommend-helper-wrap{margin-bottom:6px;}

  /* ===== INLINE SIGNAL CHECKBOXES (auto-tally next to each question) ===== */
  .signal-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .signal-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    padding:6px 10px 6px 8px;
    border-radius:14px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--paper-dim);
    color:var(--ink-soft);
  }
  .signal-chip input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:14px;
    height:14px;
    border:1.5px solid var(--ink-soft);
    border-radius:4px;
    flex-shrink:0;
    cursor:pointer;
    margin:0;
    position:relative;
  }
  .signal-chip.lean-ma input:checked{background:var(--gold); border-color:var(--gold);}
  .signal-chip.lean-medsupp input:checked{background:var(--teal); border-color:var(--teal);}
  .signal-chip.lean-ppo input:checked{background:var(--red); border-color:var(--red);}
  .signal-chip input:checked::after{
    content:"✓";
    position:absolute;
    top:-3px;
    left:1px;
    color:#fff;
    font-size:10px;
    font-weight:700;
  }
  .signal-chip.checked{
    color:var(--ink);
    border-color:transparent;
  }
  .signal-chip.lean-ma.checked{background:rgba(200,155,60,0.18);}
  .signal-chip.lean-medsupp.checked{background:rgba(62,108,108,0.15);}
  .signal-chip.lean-ppo.checked{background:rgba(163,61,61,0.12);}

  .signal-tally{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    background:var(--ink);
    border-radius:8px;
    padding:12px 14px;
    margin:16px 0;
    align-items:center;
  }
  .signal-tally-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(250,248,243,0.55);
    margin-right:4px;
  }
  .tally-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:14px;
    color:#fff;
  }
  .tally-chip.lean-ma{background:var(--gold); color:var(--ink);}
  .tally-chip.lean-medsupp{background:var(--teal);}
  .tally-chip.lean-ppo{background:var(--red);}

  .checklist-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .checklist-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--teal);
  }
  .checklist-progress{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper-dim);
    border-radius:12px;
    padding:3px 10px;
    white-space:nowrap;
  }
  .checklist-progress.complete{
    background:var(--teal);
    color:#fff;
  }
  .checklist-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 4px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:19px;
    height:19px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    position:relative;
    background:var(--paper);
  }
  .checklist-item input[type="checkbox"]:checked{
    background:var(--teal);
    border-color:var(--teal);
  }
  .checklist-item input[type="checkbox"]:checked::after{
    content:"✓";
    position:absolute;
    top:-2px;
    left:3px;
    color:#fff;
    font-size:13px;
    font-weight:700;
  }
  .checklist-item label{
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    cursor:pointer;
  }
  .checklist-item.checked label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(62,108,108,0.4);
  }
  .checklist-reset{
    margin-top:12px;
    background:none;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* ===== AUTO-COMPUTED ELIGIBILITY RESULT ===== */
  .eligibility-result{
    margin-top:2px;
    margin-bottom:22px;
    padding:14px 16px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper-dim);
    display:block;
  }
  .eligibility-result .result-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:8px;
  }
  .eligibility-result .elig-line{
    margin:0;
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    font-weight:500;
  }
  .eligibility-result .elig-line + .elig-line{margin-top:6px;}
  .eligibility-result .elig-good{color:#2C5F5F;}
  .eligibility-result .elig-bad{color:var(--red);}
  .eligibility-result .elig-unknown{color:var(--ink-soft); font-weight:400;}
  .eligibility-result.state-full{background:rgba(62,108,108,0.1); border-color:var(--teal);}
  .eligibility-result.state-partial{background:rgba(200,155,60,0.12); border-color:var(--gold);}
  .eligibility-result.state-blocked{background:rgba(163,61,61,0.06); border-color:var(--red);}
  .eligibility-result.state-unknown{background:var(--paper-dim); border-color:var(--line);}

  /* ===== MINI DISCLOSURE (repeated per-call recording reminder) ===== */
  .mini-disclosure{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--red);
    border-radius:5px;
    padding:6px 10px;
    margin-bottom:10px;
  }
  .mini-disclosure .icon{font-size:11px; flex-shrink:0;}
  .mini-disclosure p{
    margin:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.01em;
    color:var(--red);
    font-weight:500;
  }

  /* ===== STAGE NOTE (don't read aloud) ===== */
  .stage-note{
    display:flex;
    align-items:flex-start;
    gap:8px;
    background:#FFF4CC;
    border:1px solid #E8C34A;
    border-radius:6px;
    padding:9px 12px;
    margin:12px 0;
  }
  .stage-note-icon{
    font-size:13px;
    line-height:1.4;
    flex-shrink:0;
  }
  .stage-note-body{flex:1;}
  .stage-note-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8A6D1A;
    display:block;
    margin-bottom:2px;
  }
  .stage-note p{
    margin:0;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    line-height:1.5;
    color:#5C4A10;
    font-style:italic;
  }

  /* OBJECTION LIST */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--red);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
    transition:box-shadow .15s ease;
  }
  .card.answered{border-left-color:var(--teal);}
  .card:hover{box-shadow:var(--shadow);}

  .card-q{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .card-q .qtext{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
  }
  .card-q .qtext::before{
    content:"“";
    color:var(--red);
    font-family:'Fraunces',serif;
    font-size:18px;
    margin-right:2px;
  }
  .branch-card{border-left-color:var(--teal);}
  .branch-card .qtext::before{content:"?"; color:var(--teal); font-family:'IBM Plex Mono',monospace; font-size:14px;}
  .branch-group .obj-group-head{background:var(--teal);}
  .branch-group .obj-group-head .chevron{color:#fff;}

  /* ===== PLAN TYPE BUTTONS (MAPD / MA / PDP & Med Supp) ===== */
  .plan-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:16px 0;
  }
  .plan-card{border-left-color:var(--gold); border-width:1px;}
  .plan-card .qtext{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-size:13px;
  }
  .plan-card .qtext::before{content:none;}
  .plan-card .card-q{padding:14px 16px;}
  .deep-dive{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--gold);
  }
  .deep-dive-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8A6D1A;
    display:block;
    margin-bottom:8px;
  }
  .deep-dive p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .already-step{margin-bottom:14px;}
  .already-step:last-child{margin-bottom:0;}
  .already-step-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:4px;
  }
  .already-step p{
    margin:0;
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
  }
  .chevron{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    transition:transform .18s ease;
    flex-shrink:0;
  }
  .card.open .chevron{transform:rotate(90deg);}

  .card-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
  }
  .card.open .card-a{max-height:1000px;}
  .card-a-inner{
    padding:0 18px 18px 18px;
    border-top:1px solid var(--line);
    margin-top:0;
  }
  .card-a-inner .say-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--teal);
    margin:14px 0 6px;
  }
  .card-a-inner p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ===== FRAMEWORK (Term / Whole / Final Expense) ===== */
  .fw-intro{
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 18px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .fw-intro b{color:var(--ink);}

  .fw-step{
    display:grid;
    grid-template-columns:52px 1fr;
    gap:16px;
    margin-bottom:22px;
  }
  .fw-step-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    color:var(--gold);
    line-height:1;
    text-align:center;
    padding-top:2px;
  }
  .fw-step-rail{
    position:relative;
  }
  .fw-step-rail::before{
    content:"";
    position:absolute;
    left:-38px;
    top:38px;
    bottom:-22px;
    width:1px;
    background:var(--line);
  }
  .fw-step:last-of-type .fw-step-rail::before{display:none;}

  .fw-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
  }
  .fw-step-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:8px;
  }
  .fw-ask{
    font-family:'Fraunces',serif;
    font-size:16px;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 14px;
  }
  .fw-ask::before{content:"“"; color:var(--gold); font-size:20px;}
  .fw-ask::after{content:"”"; color:var(--gold); font-size:20px;}

  .fw-answers{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  @media(min-width:560px){
    .fw-answers{grid-template-columns:1fr 1fr;}
  }
  .fw-answer{
    border-radius:6px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.5;
  }
  .fw-answer.bad{
    background:rgba(163,61,61,0.07);
    border:1px solid rgba(163,61,61,0.25);
  }
  .fw-answer.good{
    background:rgba(62,108,108,0.08);
    border:1px solid rgba(62,108,108,0.3);
  }
  .fw-answer .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  .fw-answer.bad .tag{color:var(--red);}
  .fw-answer.good .tag{color:var(--teal);}
  .fw-answer p{margin:0; color:var(--ink);}

  .fw-followup{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .fw-followup .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:4px;
  }

  .fw-close{
    margin-top:32px;
    padding-top:24px;
    border-top:2px solid var(--ink);
  }
  .fw-close-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .fw-close-head h3{

    justify-content:space-between;

    color:var(--paper);

    border-radius:7px;
    padding:12px 16px;
    cursor:pointer;

    font-size:12px;
    letter-spacing:.05em;
    text-align:left;
  }

    overflow:hidden;
    transition:max-height .25s ease;
  }

  .obj-group-body-inner{padding-top:10px;}

    align-items:center;
    gap:12px;
    margin-bottom:14px;

  {

      {q:"I just want the state minimum, keep it cheap.", a:"I can absolutely quote that — I just want to make sure you know what it means: state minimum liability often caps out around $25,000, and the average injury claim can run well past that. If you own a home or have savings, that gap could come out of your own pocket. Want me to show you what a mid-tier limit costs, just so you can compare?"},

    voicemailScript: "Hi [Name], this is [Name] with [Agency] — sorry I missed you! I'm a licensed Medicare agent, and I'm reaching out because you recently looked into your Medicare options. I'd love to go over a couple of things that could either save you money or make sure you're not missing out on any benefits you qualify for — no pressure at all. Give me a call back whenever works for you at [phone number]. Again, this is [Name] with [Agency], and my number is [phone number]. Thanks, and I look forward to connecting!",

    anchorQuestions: "If you freeze after the opener, don't panic — fall back on one of these to get the conversation moving again: \"How long have you been on your current plan?\" or \"Are there any doctors or prescriptions you want to make sure stay covered?\" Either one gets them talking and buys you time to find your footing.",
    discoveryBeforePitch: "Don't skip straight into a benefits pitch, even if they ask directly what's available. Insert two quick discovery questions first: \"Are you currently on Original Medicare, or do you have a supplement?\" and \"Is there anything about your current coverage that's felt like a gap or a frustration?\" This makes the pitch feel tailored instead of canned, especially for a skeptical client.",

    rapportQuestions: [

    partsAB: {
      ask: "Quick question for you — do you know the difference between Part A and Part B?",
      note: "Let them answer — a lot of people say no, or they mix them up, and that's completely fine.",
      explain: "So here's the simple way to think about it: Part A is your hospital insurance — that's what kicks in if you're admitted to the hospital, need skilled nursing care, or hospice. Part B is your medical insurance — that covers your doctor visits, outpatient care, and preventive stuff like screenings and vaccines. Together, A and B are what people call 'Original Medicare.' Make sense so far?"
    },
    notCoveredScript: "Now, there's a few things Original Medicare doesn't cover on its own — routine dental, vision, and hearing, plus prescription drugs. That's exactly why plans like the ones we'll go over next exist — to help fill those gaps.",
    partsCD: "There's also two more parts worth knowing — Part C and Part D. Part C, or Medicare Advantage, is just an alternative way to get your Part A and B — often bundled with Part D too — through a private insurer approved by Medicare. It usually adds extras like dental, vision, and hearing, but it ties you to a network, which is exactly the MAPD or MA plan we'll get into in a bit. Part D is your prescription drug coverage — you can get it as its own standalone plan alongside Original Medicare, or it comes bundled into most Medicare Advantage plans. One thing worth mentioning now: if you go without Part D when you're first eligible and don't have other creditable drug coverage, it can trigger a permanent late-enrollment penalty — so it's worth having in place even if you're not on many medications yet.",
    part2Branches: [
      {q:"Will my pre-existing conditions be a problem?", a:"That's a really common worry, and the good news is no — by law, Medicare Parts A, B, Medicare Advantage, and Part D all have to cover you and can't charge you more because of a pre-existing condition. That protection is built in across all four. The one exception is Medicare Supplement outside its guaranteed-issue window, but I'll walk you through that if we get there."},
      {q:"Can I be denied Medicare because of my health?", a:"You can't, actually — federal law says Medicare can't refuse you coverage based on your health history. Everyone who's eligible gets in, regardless of what conditions they're managing."}
    ],
    additionalKnowledge: [
      {q:"Late enrollment penalties", a:"There are three different penalties depending on what they delayed. One applies only if they don't qualify for premium-free hospital coverage — delaying adds up to 10% to the premium, but only for twice the number of years they delayed (wait 2 years, pay the penalty for 4). Another adds 10% for every full 12-month period they went without their medical coverage, and lasts for as long as they have it — essentially for life. And one for drug coverage kicks in after 63 or more consecutive days without creditable coverage, lasting as long as they have Medicare drug coverage, even if they switch plans. All of these can be waived with credible alternative coverage, like a current employer plan."},
      {q:"IRMAA (income-related premium adjustment)", a:"Higher-income clients can pay more for Part B and Part D based on their tax return from two years prior. Worth a heads-up if their income is on the higher end, so the premium isn't a surprise."}
    ],
    planTypeBridge: "Let's start with the different types of plans out there, so you know exactly what we're comparing before I ask you some questions to help narrow it down.",
    planTypeOptions: [
      {name:"MAPD", text:"Most folks I talk to end up in what's called an MAPD — that's Medicare Advantage with prescription drug coverage. By law, it has to cover everything Original Medicare covers, but your out-of-pocket costs can look different — it bundles your medical and drug coverage into one plan, usually with a low or $0 premium, plus extras like dental, vision, and hearing. The trade-off is you're working within that plan's network of doctors.", deepDive:"Since MAPD sounds like the direction for you, let's get specific. I'll pull up the plans available in your area and we'll walk through them side by side — the premium, whether your doctors are in-network, your prescriptions against each plan's formulary, and the extra benefits like dental, vision, and hearing plan by plan. I'll also point out the Maximum Out-of-Pocket limit on each one, since that's your safety net in a bad year — once you hit it, the plan covers 100% for the rest of the year."},
      {name:"MA", text:"Now, if you're already getting your prescriptions covered somewhere else — say through the VA or a retiree plan — there's also a plain MA plan. Same rule applies — it has to cover everything Original Medicare does, same network trade-off, just without the drug piece, since you wouldn't need it twice.", deepDive:"Since a standalone MA plan fits your situation, we'll go through your area's options the same way — premium, whether your doctors are in-network, and the extra benefits available. Since you're getting drugs covered elsewhere, we don't need to check formularies, but I do want to confirm your other drug coverage counts as creditable, so you're protected from a Part D late-enrollment penalty down the road if that ever changes."},
      {name:"PDP & Med Supp", text:"If instead you'd rather keep seeing any doctor who takes Medicare, with no network at all, that changes the picture — you'd stay on Original Medicare and add a standalone PDP for your drug coverage, and most people pair that with a Medicare Supplement, which fills in the deductibles and coinsurance gaps Original Medicare leaves behind. Higher monthly premium, but zero network restrictions.", deepDive:"Since we're going the Original Medicare plus Supplement route, this is actually two decisions, so let's take them one at a time. First, we'll pick a Medigap plan letter based on how much out-of-pocket protection you want — Plan G and Plan N are the most common ones people choose right now. Then, separately, we'll shop your specific prescriptions against PDP options in your area to find the best price on your formulary. I'll walk you through both."}
    ],
    planTypeWrapup: "So really it comes down to one trade-off: lower cost with a network, through an MAPD or MA plan, or no network at all with Original Medicare, a PDP, and a Supplement. Now that you've got a sense of the options, let's narrow down which one actually fits your situation best.",
    soaCheckpoint: "Everything up through here has to stay educational — general information about Medicare, not specific plans. Past this point, you can only discuss plan-specific details, premiums, or recommendations if you have a completed Scope of Appointment (SOA) on file for this client.",
    narrowingQuestions: [
      {tag:"Payment Style", text:"Now that we've got the SOA squared away, let's narrow this down. When it comes to paying for healthcare, would you rather keep your monthly premium low and expect more cost when you actually use care — or pay a bit more each month to keep your out-of-pocket costs low when something comes up? To make it concrete: how would you feel about a $10 copay every time you see your primary doctor, versus a $500 copay if you ever had an inpatient hospital stay?",
        signals: [
          {id:"sig-lowprem", label:"Wants low premium, OK with more exposure", lean:"ma"},
          {id:"sig-lowoop", label:"Wants low out-of-pocket, OK with higher premium", lean:"medsupp"}
        ]
      },
      {tag:"Provider Access", text:"Next — are you comfortable working within a smaller network of providers, or is it important to you to be able to see any doctor that accepts Medicare, network or not? And a couple related things: do you live somewhere with a lot of provider options nearby, or is it more rural with fewer choices? Do you travel often, or split time between two places, like a lot of snowbirds do?",
        signals: [
          {id:"sig-network-ok", label:"Comfortable with a provider network", lean:"ma"},
          {id:"sig-any-doctor", label:"Wants to see any doctor, no network", lean:"medsupp"},
          {id:"sig-ppo-hybrid", label:"Wants network flexibility AND a lower premium", lean:"ppo"}
        ]
      },
      {tag:"Other Coverage", text:"Do you have any other health coverage right now — through an employer, a spouse's plan, or something like TRICARE? And are you planning to keep that coverage, or drop it once we get you set up? If you're dropping something, I want to make sure there's no gap between when it ends and your new coverage starts."},
      {tag:"Extra Benefits", text:"Are there any extra benefits that matter to you — things like dental, vision, hearing, or a gym membership like SilverSneakers or Silver&Fit?",
        signals: [
          {id:"sig-perks", label:"Wants extra perks — dental, vision, gym membership", lean:"ma"}
        ]
      },
      {tag:"Previous Coverage", text:"If you've had coverage before, what did you like about it, and what didn't work for you? That tells me a lot about what to avoid this time around."},
      {tag:"What Else Matters", text:"Last one, and it's a bit open-ended — is there anything else important to you in a health plan that we haven't talked about yet? Some people care about convenience, for example — a Medicare Advantage plan usually means one card for everything, where a Medicare Supplement means carrying separate cards for Medicare, your Supplement, and your drug plan. Others actually prefer that separation since it can mean fewer surprise bills to track. Just want to make sure I'm not missing something that matters to you.",
        signals: [
          {id:"sig-onecard", label:"Wants one card / convenience", lean:"ma"},

        ]

    planMappingGuide: "Generally: if limiting out-of-pocket cost matters most, even at a higher premium, a Medicare Supplement tends to fit best. If they're comfortable with a network in exchange for a lower premium, a Medicare Advantage plan usually fits — and if they want that lower premium but still want flexibility to go outside the network sometimes, a PPO-style Medicare Advantage plan can bridge that gap. If keeping everything bundled into one plan and one card matters most, that also points toward Medicare Advantage, since it typically combines A, B, and D plus extras — versus Original Medicare or a Supplement, which usually means separate products for drug coverage and things like dental. Ancillary products — dental, vision, hearing, hospital indemnity — can also be layered on top of any of these to round out the coverage.",
    enrollmentPeriodsReview: {tag:"Enrollment Periods", text:"This is also a good time to check what enrollment periods apply. Look at their Medicare effective date — are they still in their Initial Enrollment Period, or does a Medicare Supplement Open Enrollment period apply? Remind them about the Annual Enrollment Period too, since that's their yearly chance to make a change. And ask if anything's changed recently — a move, losing coverage, anything that might qualify them for a Special Enrollment Period to join, drop, or switch coverage."},
    part4Branches: [
      {q:"Is there a cap on what I'll pay out of pocket?", a:"Good question — with a Medicare Advantage plan, yes, there's an annual Maximum Out-of-Pocket limit, or MOOP. Once you hit that number, the plan covers 100% of covered services for the rest of the year. Original Medicare on its own doesn't have that cap, which is exactly why people pair it with a Medigap or Advantage plan."},
      {q:"Can I have a Medicare Supplement and a Medicare Advantage plan at the same time?", a:"That one trips a lot of people up — those two actually don't combine. Medigap only works alongside Original Medicare, so if you're on a Medicare Advantage plan you can't also carry a Medigap policy, and to buy Medigap in the first place you have to be enrolled in Original Medicare."},
      {q:"Will my health conditions affect whether I can get a Medicare Supplement, or what I pay for it?", a:"It really comes down to timing. If you're enrolling during your 6-month Medigap Open Enrollment window around your 65th birthday, insurers can't ask you any health questions at all — you're guaranteed acceptance. Outside that window, or if you switch Medigap plans later, medical underwriting applies and acceptance can vary by plan."},
      {q:"Aren't the Medicare Advantage Open Enrollment Period and General Enrollment Period the same thing?", a:"They share the same dates, January 1 to March 31, so I get why that's confusing — but they're actually different. The General Enrollment Period is for someone signing up for Part B for the first time after missing their Initial Enrollment Period. The Medicare Advantage Open Enrollment Period is for someone already on an Advantage plan who wants to switch or go back to Original Medicare. Worth being precise about which one actually applies to you."},
      {q:"I have Medicaid — can I still get a Medicare Supplement?", a:"That's actually one combination that's not allowed — by law, a Medicare Supplement can't be sold to someone who has Medicaid. The good news is Medicaid already covers a lot of the same cost-sharing gaps a Supplement would, so you're likely already protected there. Let's look at what fits instead, like a Medicare Advantage plan designed for dual-eligible members."}

    medicareDetailsScript: [
      {tag:"MBI Number", text:"Awesome, thank you for that. Before we start looking at plans, could you grab your Medicare card for me? It's the red, white, and blue one — I just need the number on it, sometimes called your MBI."},
      {tag:"Effective Date", text:"Perfect. And while you've got that card handy, what's the effective date listed for Part A and Part B — or if it hasn't started yet, when is it set to kick in?"},

    eligibilityIntro: "Perfect, thank you. And just to make sure I'm pointing you toward the right options — you do have both Part A and Part B active right now, correct? And one more quick one: you're not currently on Medicaid, are you? No worries either way, I just want to make sure whatever we look at next is actually going to work for you.",

    part3Branches: [
      {q:"When was I actually supposed to sign up?", a:"Happy to walk through that — your Initial Enrollment Period is a 7-month window, starting 3 months before your 65th birthday month, including your birthday month, and running 3 months after. That's the window most people use to sign up for Part A, B, and D without a penalty."},
      {q:"I missed my window — what happens now?", a:"No need to panic — you'd likely be looking at the General Enrollment Period, which runs January 1 to March 31 each year, to sign up for Part B for the first time. That's different from the Medicare Advantage Open Enrollment Period, which shares those same dates but is for people switching Advantage plans, not enrolling for the first time — those two get mixed up a lot. A late enrollment penalty may also apply, but we can look at that together."}

    healthInfoScript: [
      {tag:"Doctors", text:"Now that we know a [plan type] is the direction you want to go, can you give me the names of the doctors you currently see? I want to check every one of them against the network before we lock anything in, so nobody gets left out.", resistance:"Absolutely no pressure! Let's pull up the general network for your area first — once you see plans that look promising, you can verify your own doctors on the plan's website, or I can check them with you live at that point. Sound good?"},
      {tag:"Medications", text:"And last one — what prescriptions are you currently taking? For each one, I'll want the drug name, the dosage, the quantity prescribed, and how often you fill it. Also, do you have a preferred pharmacy, and would you be open to using a mail-order pharmacy if it saved you money?"}

    agentOnlyNote: "Use a drug cost estimator tool (like Ritter's, or Medicare.gov) with this drug list to check formulary coverage and pricing before you recommend a plan. Note: agent-facing cost estimator tools are for your own prep only — don't show them to the client. Medicare.gov's plan comparison is fine to pull up together with them.",
    part5Branches: [
      {q:"I have diabetes — does Medicare actually cover much of that?", a:"It covers quite a bit, actually. Part B handles your diabetes management — things like blood sugar test strips, glucose monitors, your A1C tests, and even a foot exam every six months if you've got any nerve damage. And on the drug side, Part D covers insulin, with a $35-a-month copay cap on most insulin types these days, so that cost is a lot more predictable than it used to be."},
      {q:"What about the diabetes prevention or education programs I've heard about?", a:"Those are covered too — Part B pays for an outpatient program that walks you through diet, exercise, monitoring your blood sugar, and managing medication after a diagnosis. If you qualify based on your numbers, there's also nutrition therapy with a dietitian, and a prevention program for anyone at risk who hasn't been diagnosed yet."}

        {name:"Part C", title:"Medicare Advantage", desc:"An alternative way to get A and B (often plus D) through a private insurer approved by Medicare. Usually adds extras like dental, vision, and hearing, but ties you to a network. This is the 'MA' / 'MAPD' plan type below."},

        {name:"MAPD", title:"Medicare Advantage + Prescription Drug", desc:"The most common plan type — bundles medical (A/B), drug coverage (D), and usually extras like dental/vision/hearing into one plan with one card. Lower premiums, but limited to the plan's network of doctors."},
        {name:"PDP", title:"Prescription Drug Plan (standalone)", desc:"Just Part D — drug coverage only. Pairs with Original Medicare or a Medicare Supplement for someone who wants to keep seeing any doctor but still needs drug coverage. Not used alongside an MA/MAPD plan, since those already include or exclude drug coverage on their own."},

      networks: [
        {name:"HMO", title:"Health Maintenance Organization", desc:"Lowest premiums, tightest network. Must use in-network doctors and get a referral from a primary care physician to see a specialist. Best for someone who wants the lowest cost and doesn't mind a gatekeeper."},
        {name:"EPO", title:"Exclusive Provider Organization", desc:"Similar to an HMO on network — must stay in-network except for emergencies — but usually no referral needed to see a specialist. A middle ground for someone who wants HMO-level pricing without the referral step."},
        {name:"POS", title:"Point of Service", desc:"A hybrid of HMO and PPO — needs a primary care referral like an HMO, but can also go out-of-network at a higher cost like a PPO. Good fit for someone who wants a primary doctor coordinating care but occasional flexibility."},
        {name:"PPO", title:"Preferred Provider Organization", desc:"More flexible — no referrals needed, and can see out-of-network doctors at a higher cost. Slightly higher premium than an HMO, but much better fit for someone with multiple specialists or who splits time between areas."},
        {name:"PFFS", title:"Private Fee-for-Service", desc:"The insurer sets how much it pays and what the member owes; the provider decides visit-by-visit whether to accept those terms. Increasingly rare, so always confirm a provider will accept it before enrolling."},
        {name:"SNP", title:"Special Needs Plan", desc:"A Medicare Advantage plan tailored to a specific group — people with certain chronic conditions, those who qualify for both Medicare and Medicaid, or those in an institution. Often includes extra benefits and lower costs for people who qualify."}
      ],

    strategyNote: {
      title: "How to work any of these objections",
      steps: [
        {tag:"Acknowledge & Validate", text:"Disarm first — \"I completely understand\" — before saying anything else. Lowers tension so they'll actually listen."},
        {tag:"Pivot Quickly", text:"Move off the objection and toward checking their basic Part A & B eligibility or current setup."},
        {tag:"Focus on Value", text:"Name a tangible benefit they might be missing — lower prescription copays, dental, vision, OTC allowances."},
        {tag:"Inquire Gently", text:"If they're happy with their plan, ask how they feel about their deductible or out-of-pocket costs — don't argue, just ask."}
      ],
      source: "Action Benefits Blog — \"How health insurance agents can beat 4 objections they'll hear this fall\""
    },
    objectionGroups: [
      {
        part: 1,
        section: "Top Sales Objections",
        items: [
          {q:"I'm not interested.", a:"I completely understand — I'm not calling to sell you anything today. I just do a quick, free check to see if you're missing out on lower prescription or dental costs you might already qualify for. Can I ask two quick questions to see if that's the case for you?"},
          {q:"I already have an agent.", a:"That's great — it's good to have someone in your corner. Plans and benefits update every year though, and not every agent proactively re-checks all of them. Mind if I just confirm whether the newest dental, vision, or over-the-counter allowances are already on your plan? Takes two minutes, and if you're already covered, great."},
          {q:"I've already taken care of my Medicare.", a:"Good — that's exactly where most people should be. Since plans change every year, I just do a quick free review to catch any gaps, like a drug that moved tiers or a new allowance you might now qualify for. Would it hurt to double check?"},
          {q:"Can you just mail me the information?", a:"I can definitely do that — I just want to make sure I'm not mailing you generic information that doesn't actually apply to you. Can I ask two quick questions first, so whatever I send is specific to your situation instead of a form letter?"},
          {q:"I'm happy with my current plan (Status Quo).", a:"That's great that you've had consistency — I respect that completely, and I'm not here to talk you out of it. A few ways to open this up, depending on how they respond: <strong>What's Changed reframe</strong> — \"Plans actually reset their benefits every January, so even if you've had the same plan for years, what you're getting today may be different from what you signed up for. We just want to make sure you're still getting full value.\" <strong>Confidence scale</strong> — \"On a scale of 1 to 10, how confident are you that your current plan is the best one available to you right now?\" Most people can't say 10 — that gap opens the door without feeling confrontational. <strong>No-obligation comparison</strong> — \"I'm not here to move you off your plan — I just want to put together a side-by-side so you can see exactly where you stand. If your current plan wins, I'll tell you that. Fair enough?\""},
          {q:"I want to keep using my doctor / I travel a lot.", a:"That's completely fair, and it's actually one of the first things we check. Let's pull up your doctor and see if they're in-network — and if you travel often, I can show you options that work nationwide instead of a tight local network."},
          {q:"I have health problems, will I even qualify?", a:"Absolutely, and I hear that worry a lot — by law, Medicare can't deny you coverage or charge you more because of a pre-existing condition, across Part A, B, Advantage, or Part D. That protection is built in. So whatever you're managing, there's a Medicare option that works for you."},
          {q:"What agency are you with?", a:"I'm an independent broker, which actually works in your favor — I'm not tied to any single company, so I can shop across multiple top-rated carriers to find the plan that truly fits your needs and budget, not just what one company offers. So, what's most important to you when choosing coverage — cost, specific benefits, or network flexibility?"}
        ]
      },
      {
        part: 1,
        section: "More Objections (NCC Guide)",
        items: [
          {q:"I'm not on Medicare yet.", a:"No problem — a lot of people reach out early. I just want to make sure you know about the penalties for enrolling late once you're eligible. Are you still working right now, and do you have a retirement date in mind?"},
          {q:"Why are you calling me?", a:"Fair question — I work with people on Medicare in your area, and I have your information from [the card you returned / your online request / your Facebook inquiry]. Can I ask you a couple quick questions?"},
          {q:"I don't want to make any changes right now.", a:"Completely understand — I'm not talking about a big change here, just seeing if there's a small upgrade that puts a little more money back in your pocket. Can I walk you through what that would look like? If not, would it be alright if I called you back on [date] once I have some new information to share?"},
          {q:"I can't afford that.", a:"Totally fair — you know your budget better than anyone. Are you currently paying for any other coverage, like a hospital indemnity or supplemental plan? Sometimes we can find savings there that make this a wash instead of an added cost."},
          {q:"I need to talk to my son/daughter/POA first (Family Gatekeeper).", a:"That's actually really common, and honestly it can make things easier — families who review this together tend to make better decisions. A few ways to work this, depending on the moment: <strong>Inclusion Pivot</strong> — invite them by name into the conversation: \"Your daughter sounds like exactly the kind of person who'd want to see a side-by-side comparison before saying yes or no — let's set that up for her.\" <strong>Pre-Call Information Drop</strong> — before a three-way call, send over something low-stakes and educational, like a one-page comparison, so the call starts warmer and pre-handles the questions they'll likely raise. <strong>Credentialing Bridge</strong> — briefly establish experience with this exact situation first: \"I work with a lot of families where one person handles the research — I'm used to walking through this together, and I'll make sure every question gets answered, not just the ones you think to ask.\""},
          {q:"I need to talk to my doctor/pharmacist.", a:"Happy to help with that — want me to call your doctor's office or pharmacist together with you right now to confirm they take this coverage? If you'd rather ask them yourself, that's fine too — just keep in mind they usually can't give insurance advice, the same way I can't give medical advice. I'll follow up with you after."},
          {q:"I don't want to give you that information over the phone.", a:"I get that completely — a lot of people feel that way these days. I only need it to make sure I can actually get you the savings we've been talking about. If you'd rather not share it by phone, I'm happy to meet in person instead, even briefly."}
        ]
      },
      {
        part: 1,
        section: "Objections — Original Medicare (Part A & B)",
        items: [
          {q:"I already have Medicare, I don't need anything else.", a:"Original Medicare alone actually only covers about 80% of costs and doesn't include a cap on what you'd pay out of pocket — that's why most people pair it with either a Medicare Advantage plan or a Supplement, often at little to no added premium. Can I ask what you currently have in place alongside Part A and B?"},
          {q:"My employer/retiree plan is good enough.", a:"For a lot of people it is, and I'm not here to talk you out of good coverage. I just want to make sure you know what it costs compared to your alternatives, and what happens to that coverage if anything changes with your employer down the road. Worth a quick comparison so you're making an informed choice either way."}
        ]
      },
      {
        part: 1,
        section: "Objections — Plan Types (Advantage & Supplement)",
        items: [
          {q:"I don't want to lose my doctor.", a:"That's the most important question to answer before anything else. Let's pull up your specific doctors and pharmacy and check them against a plan's network before we talk about any other details — if they're not covered, we don't move forward with that plan, simple as that."},
          {q:"I don't understand the difference between Advantage and Supplement.", a:"Fair — most people don't, and it's the most important decision in this whole process. Advantage plans usually have low or no premium and bundle in extras like dental and vision, but you're limited to a network. Supplements cost more monthly but let you see any doctor who accepts Medicare, nationwide, with very few surprise bills. Let's figure out which trade-off fits how you actually live."},
          {q:"I'm worried about being locked into a bad plan.", a:"That's a really common concern, and it's worth knowing your options here: Medicare Advantage plans can be changed every Annual Enrollment Period, and there's also an Open Enrollment Period from January 1 to March 31 where you can switch Advantage plans or go back to Original Medicare if something isn't working. You're not stuck."}
        ]
      },
      {
        part: 1,
        section: "Objections — Enrollment Timing & Cost",
        items: [
          {q:"Isn't it too late / too early to enroll?", a:"That depends on your situation — there's the Annual Enrollment Period from October 15 to December 7, but there are also Special Enrollment Periods if you've just moved, lost employer coverage, or qualify for Medicaid. Let's check your specific dates so we know exactly what's open to you right now."},
          {q:"How much is this going to cost me?", a:"Depends entirely on the plan type and your specific situation — some Advantage plans run $0/month, while Supplements can range higher depending on the plan letter and your area. Let's look at your actual prescriptions and doctors first, then I can give you real numbers instead of a guess."}
        ]
      }
    ]

  {

    tagline: "Inbound call — client contacted you first",
    desc: "The client called you, not the other way around — so the opener changes, but the compliance requirements don't. Same disclosures, same SOA rules (though the 48-hour wait is waived for a live, beneficiary-initiated call), same education-before-plans structure. Intake here also captures every field your CRM needs up front.",
    complianceDisclosure: "This call may be recorded for quality assurance or training purposes. We do not offer every plan available in your area. Currently, we represent 0-78 organizations which offer 0-2,613 products in your area. Please contact medicare.gov, 1-800-MEDICARE, or your local State Health Insurance Program (SHIP) to get information on all of your options.",
    openingIntro: "Thank you for calling [Agency], this is [Name] — I'm a licensed Medicare agent.",
    nameAsk: {tag:"Full Name", text:"I'd be happy to help you today — let's start by getting you into our system. Can I get your full name? First, middle initial if you have one, and last?"},
    openingContinued: "Great, thank you, [Prospect Name]. Before we get into whatever brought you in today, let me just grab a few details for our records — it'll only take a minute.",
    intakeScript: [
      {tag:"Birthdate", text:"What's your date of birth?", resistance:"Totally understandable! Even just your age range helps me point you in the right direction — are you in your 50s, 60s, or beyond?"},
      {tag:"Marital Status", text:"And are you currently married, single, widowed, or divorced? Just for our records — no wrong answer here."},
      {tag:"Contact Info", text:"What's the best phone number and email address to reach you at? And which do you prefer I use going forward — phone or email?", resistance:"No problem! Is there a way you'd prefer to reach back out to me when you're ready? I can give you my direct number instead."},
      {tag:"Mailing Address", text:"And what's your full mailing address? Street, apartment or unit number if you've got one, city, state, and zip."}
    ],
    zipReluctance: [
      {q:"I don't want to give you my address / zip code.", a:"That's a completely fair concern, and a lot of people feel that way. I just need at least your zip code — carriers and plan options actually vary by location, so without it I can't show you what's actually available where you live. I won't use it for anything else, and you're under no obligation to enroll in anything today. If you'd still rather not share your full address yet, no worries — the zip code alone is enough to get started, and we can fill in the rest once you're more comfortable."}
    ],
    callInSoaNote: "Since they called you, not the other way around, the SOA's 48-hour waiting period doesn't apply as long as you're taking this call live right now — you can get the SOA and move into plan-specific discussion in this same call. If you'd missed this call and were calling them back instead, the 48-hour wait would be back in effect.",
    anchorQuestions: "If you freeze up mid-call, don't panic — fall back on one of these to get the conversation moving again: \"How long have you been on your current plan?\" or \"Are there any doctors or prescriptions you want to make sure stay covered?\" Either one gets them talking and buys you time to find your footing.",
    discoveryBeforePitch: "Don't skip straight into a benefits pitch, even if they ask directly what's available. Insert two quick discovery questions first: \"Are you currently on Original Medicare, or do you have a supplement?\" and \"Is there anything about your current coverage that's felt like a gap or a frustration?\" This makes the pitch feel tailored instead of canned, especially for a skeptical client.",
    alreadyHaveMedicareScript: [
      {tag:"Acknowledge", text:"That's great to hear — a lot of people I talk to already have something in place. I'm not calling to sell you something new necessarily, I just want to make sure what you have is still working for you."},
      {tag:"Ask What They Have", text:"Can I ask what you currently have — is it Original Medicare on its own, a Medicare Advantage plan, or do you have a Medicare Supplement alongside Original Medicare?"},
      {tag:"Transition to Review", text:"Got it, thank you. Since plans and networks can change every year even if you don't touch anything, would you mind if I ran a quick, no-obligation comparison to see how your current plan stacks up? If it's still the best fit, I'll tell you that directly — and if there's something better, that's completely your call."}
    ],
    trustPhrases: [
      {situation:"They seem guarded", phrase:"There's no rush — let's just talk through your options."},
      {situation:"They had a bad experience", phrase:"I'm sorry to hear that. I want this to be a completely different experience for you."},
      {situation:"They're unsure", phrase:"Great question — let me explain that clearly."},
      {situation:"They feel pressured", phrase:"My only goal today is to give you information. The decision is 100% yours."},
      {situation:"They're skeptical", phrase:"I completely understand the skepticism — let me earn your trust by being straightforward with you."}
    ],
    rapportQuestions: [
      {tag:"Comfort Check", text:"What would make this process feel comfortable and easy for you?"},
      {tag:"Concerns Upfront", text:"Is there anything you're concerned about that I can address upfront, before we get into any details?"}
    ],
    partsAB: {
      ask: "Quick question for you — do you know the difference between Part A and Part B?",
      note: "Let them answer — a lot of people say no, or they mix them up, and that's completely fine.",
      explain: "So here's the simple way to think about it: Part A is your hospital insurance — that's what kicks in if you're admitted to the hospital, need skilled nursing care, or hospice. Part B is your medical insurance — that covers your doctor visits, outpatient care, and preventive stuff like screenings and vaccines. Together, A and B are what people call 'Original Medicare.' Make sense so far?"
    },
    notCoveredScript: "Now, there's a few things Original Medicare doesn't cover on its own — routine dental, vision, and hearing, plus prescription drugs. That's exactly why plans like the ones we'll go over next exist — to help fill those gaps.",
    partsCD: "There's also two more parts worth knowing — Part C and Part D. Part C, or Medicare Advantage, is just an alternative way to get your Part A and B — often bundled with Part D too — through a private insurer approved by Medicare. It usually adds extras like dental, vision, and hearing, but it ties you to a network, which is exactly the MAPD or MA plan we'll get into in a bit. Part D is your prescription drug coverage — you can get it as its own standalone plan alongside Original Medicare, or it comes bundled into most Medicare Advantage plans. One thing worth mentioning now: if you go without Part D when you're first eligible and don't have other creditable drug coverage, it can trigger a permanent late-enrollment penalty — so it's worth having in place even if you're not on many medications yet.",
    part2Branches: [
      {q:"Will my pre-existing conditions be a problem?", a:"That's a really common worry, and the good news is no — by law, Medicare Parts A, B, Medicare Advantage, and Part D all have to cover you and can't charge you more because of a pre-existing condition. That protection is built in across all four. The one exception is Medicare Supplement outside its guaranteed-issue window, but I'll walk you through that if we get there."},
      {q:"Can I be denied Medicare because of my health?", a:"You can't, actually — federal law says Medicare can't refuse you coverage based on your health history. Everyone who's eligible gets in, regardless of what conditions they're managing."}
    ],
    additionalKnowledge: [
      {q:"Late enrollment penalties", a:"There are three different penalties depending on what they delayed. One applies only if they don't qualify for premium-free hospital coverage — delaying adds up to 10% to the premium, but only for twice the number of years they delayed (wait 2 years, pay the penalty for 4). Another adds 10% for every full 12-month period they went without their medical coverage, and lasts for as long as they have it — essentially for life. And one for drug coverage kicks in after 63 or more consecutive days without creditable coverage, lasting as long as they have Medicare drug coverage, even if they switch plans. All of these can be waived with credible alternative coverage, like a current employer plan."},
      {q:"IRMAA (income-related premium adjustment)", a:"Higher-income clients can pay more for Part B and Part D based on their tax return from two years prior. Worth a heads-up if their income is on the higher end, so the premium isn't a surprise."}
    ],
    planTypeBridge: "Let's start with the different types of plans out there, so you know exactly what we're comparing before I ask you some questions to help narrow it down.",
    planTypeOptions: [
      {name:"MAPD", text:"Most folks I talk to end up in what's called an MAPD — that's Medicare Advantage with prescription drug coverage. By law, it has to cover everything Original Medicare covers, but your out-of-pocket costs can look different — it bundles your medical and drug coverage into one plan, usually with a low or $0 premium, plus extras like dental, vision, and hearing. The trade-off is you're working within that plan's network of doctors.", deepDive:"Since MAPD sounds like the direction for you, let's get specific. I'll pull up the plans available in your area and we'll walk through them side by side — the premium, whether your doctors are in-network, your prescriptions against each plan's formulary, and the extra benefits like dental, vision, and hearing plan by plan. I'll also point out the Maximum Out-of-Pocket limit on each one, since that's your safety net in a bad year — once you hit it, the plan covers 100% for the rest of the year."},
      {name:"MA", text:"Now, if you're already getting your prescriptions covered somewhere else — say through the VA or a retiree plan — there's also a plain MA plan. Same rule applies — it has to cover everything Original Medicare does, same network trade-off, just without the drug piece, since you wouldn't need it twice.", deepDive:"Since a standalone MA plan fits your situation, we'll go through your area's options the same way — premium, whether your doctors are in-network, and the extra benefits available. Since you're getting drugs covered elsewhere, we don't need to check formularies, but I do want to confirm your other drug coverage counts as creditable, so you're protected from a Part D late-enrollment penalty down the road if that ever changes."},
      {name:"PDP & Med Supp", text:"If instead you'd rather keep seeing any doctor who takes Medicare, with no network at all, that changes the picture — you'd stay on Original Medicare and add a standalone PDP for your drug coverage, and most people pair that with a Medicare Supplement, which fills in the deductibles and coinsurance gaps Original Medicare leaves behind. Higher monthly premium, but zero network restrictions.", deepDive:"Since we're going the Original Medicare plus Supplement route, this is actually two decisions, so let's take them one at a time. First, we'll pick a Medigap plan letter based on how much out-of-pocket protection you want — Plan G and Plan N are the most common ones people choose right now. Then, separately, we'll shop your specific prescriptions against PDP options in your area to find the best price on your formulary. I'll walk you through both."}
    ],
    planTypeWrapup: "So really it comes down to one trade-off: lower cost with a network, through an MAPD or MA plan, or no network at all with Original Medicare, a PDP, and a Supplement. Now that you've got a sense of the options, let's narrow down which one actually fits your situation best.",
    soaCheckpoint: "Everything up through here has to stay educational — general information about Medicare, not specific plans. Past this point, you can only discuss plan-specific details, premiums, or recommendations if you have a completed Scope of Appointment (SOA) on file for this client.",
    narrowingQuestions: [
      {tag:"Payment Style", text:"Now that we've got the SOA squared away, let's narrow this down. When it comes to paying for healthcare, would you rather keep your monthly premium low and expect more cost when you actually use care — or pay a bit more each month to keep your out-of-pocket costs low when something comes up? To make it concrete: how would you feel about a $10 copay every time you see your primary doctor, versus a $500 copay if you ever had an inpatient hospital stay?",
        signals: [
          {id:"sig-lowprem", label:"Wants low premium, OK with more exposure", lean:"ma"},
          {id:"sig-lowoop", label:"Wants low out-of-pocket, OK with higher premium", lean:"medsupp"}
        ]
      },
      {tag:"Provider Access", text:"Next — are you comfortable working within a smaller network of providers, or is it important to you to be able to see any doctor that accepts Medicare, network or not? And a couple related things: do you live somewhere with a lot of provider options nearby, or is it more rural with fewer choices? Do you travel often, or split time between two places, like a lot of snowbirds do?",
        signals: [
          {id:"sig-network-ok", label:"Comfortable with a provider network", lean:"ma"},
          {id:"sig-any-doctor", label:"Wants to see any doctor, no network", lean:"medsupp"},
          {id:"sig-ppo-hybrid", label:"Wants network flexibility AND a lower premium", lean:"ppo"}
        ]
      },
      {tag:"Other Coverage", text:"Do you have any other health coverage right now — through an employer, a spouse's plan, or something like TRICARE? And are you planning to keep that coverage, or drop it once we get you set up? If you're dropping something, I want to make sure there's no gap between when it ends and your new coverage starts."},
      {tag:"Extra Benefits", text:"Are there any extra benefits that matter to you — things like dental, vision, hearing, or a gym membership like SilverSneakers or Silver&Fit?",
        signals: [
          {id:"sig-perks", label:"Wants extra perks — dental, vision, gym membership", lean:"ma"}
        ]
      },
      {tag:"Previous Coverage", text:"If you've had coverage before, what did you like about it, and what didn't work for you? That tells me a lot about what to avoid this time around."},
      {tag:"What Else Matters", text:"Last one, and it's a bit open-ended — is there anything else important to you in a health plan that we haven't talked about yet? Some people care about convenience, for example — a Medicare Advantage plan usually means one card for everything, where a Medicare Supplement means carrying separate cards for Medicare, your Supplement, and your drug plan. Others actually prefer that separation since it can mean fewer surprise bills to track. Just want to make sure I'm not missing something that matters to you.",
        signals: [
          {id:"sig-onecard", label:"Wants one card / convenience", lean:"ma"},
          {id:"sig-multicard", label:"OK with multiple cards / fewer surprise bills", lean:"medsupp"}
        ]
      }
    ],
    planMappingGuide: "Generally: if limiting out-of-pocket cost matters most, even at a higher premium, a Medicare Supplement tends to fit best. If they're comfortable with a network in exchange for a lower premium, a Medicare Advantage plan usually fits — and if they want that lower premium but still want flexibility to go outside the network sometimes, a PPO-style Medicare Advantage plan can bridge that gap. If keeping everything bundled into one plan and one card matters most, that also points toward Medicare Advantage, since it typically combines A, B, and D plus extras — versus Original Medicare or a Supplement, which usually means separate products for drug coverage and things like dental. Ancillary products — dental, vision, hearing, hospital indemnity — can also be layered on top of any of these to round out the coverage.",
    enrollmentPeriodsReview: {tag:"Enrollment Periods", text:"This is also a good time to check what enrollment periods apply. Look at their Medicare effective date — are they still in their Initial Enrollment Period, or does a Medicare Supplement Open Enrollment period apply? Remind them about the Annual Enrollment Period too, since that's their yearly chance to make a change. And ask if anything's changed recently — a move, losing coverage, anything that might qualify them for a Special Enrollment Period to join, drop, or switch coverage."},
    part4Branches: [
      {q:"Is there a cap on what I'll pay out of pocket?", a:"Good question — with a Medicare Advantage plan, yes, there's an annual Maximum Out-of-Pocket limit, or MOOP. Once you hit that number, the plan covers 100% of covered services for the rest of the year. Original Medicare on its own doesn't have that cap, which is exactly why people pair it with a Medigap or Advantage plan."},
      {q:"Can I have a Medicare Supplement and a Medicare Advantage plan at the same time?", a:"That one trips a lot of people up — those two actually don't combine. Medigap only works alongside Original Medicare, so if you're on a Medicare Advantage plan you can't also carry a Medigap policy, and to buy Medigap in the first place you have to be enrolled in Original Medicare."},
      {q:"Will my health conditions affect whether I can get a Medicare Supplement, or what I pay for it?", a:"It really comes down to timing. If you're enrolling during your 6-month Medigap Open Enrollment window around your 65th birthday, insurers can't ask you any health questions at all — you're guaranteed acceptance. Outside that window, or if you switch Medigap plans later, medical underwriting applies and acceptance can vary by plan."},
      {q:"Aren't the Medicare Advantage Open Enrollment Period and General Enrollment Period the same thing?", a:"They share the same dates, January 1 to March 31, so I get why that's confusing — but they're actually different. The General Enrollment Period is for someone signing up for Part B for the first time after missing their Initial Enrollment Period. The Medicare Advantage Open Enrollment Period is for someone already on an Advantage plan who wants to switch or go back to Original Medicare. Worth being precise about which one actually applies to you."},
      {q:"I have Medicaid — can I still get a Medicare Supplement?", a:"That's actually one combination that's not allowed — by law, a Medicare Supplement can't be sold to someone who has Medicaid. The good news is Medicaid already covers a lot of the same cost-sharing gaps a Supplement would, so you're likely already protected there. Let's look at what fits instead, like a Medicare Advantage plan designed for dual-eligible members."}
    ],
    medicareDetailsScript: [
      {tag:"MBI Number", text:"Now, do you have your Medicare card handy? It's the red, white, and blue one — I just need the number on it, sometimes called your MBI."},
      {tag:"Part A Effective Date", text:"Great. And what's the effective date listed for Part A on that card?"},
      {tag:"Part B Effective Date", text:"And the effective date for Part B — is that the same date, or a different one?"},
      {tag:"Medicaid", text:"Are you currently enrolled in Medicaid?"},
      {tag:"Extra Help (LIS)", text:"And last one — do you currently receive Extra Help, sometimes called LIS or a Low Income Subsidy, toward your prescription costs?"}
    ],
    eligibilityIntro: "Perfect, thank you for all of that. Let me just double-check a couple of things on my end before we go any further, based on what you've told me.",
    eligibilityCheck: {
      title: "Required check — eligibility before you narrow anything down",

let activeCategory = DATA[0].id;
let searchTerm = "";
let checklistState = {};

function countBadge(cat){
  if(cat.type === 'framework') return '3-Q';
  if(cat.type === 'followup') return '4-day';
  if(cat.objectionGroups) return cat.objectionGroups.reduce((sum,g)=>sum+g.items.length,0);
  return cat.objections.length;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DATA.map(cat => `
    <button class="tab-btn ${cat.id===activeCategory?'active':''}" data-id="${cat.id}">
      ${cat.label} <span class="count">${countBadge(cat)}</span>
    </button>
  `).join('');
  tabs.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.id;
      renderTabs();
      renderMain();
    });
  });
}

function matchesSearch(obj){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return obj.q.toLowerCase().includes(t) || obj.a.toLowerCase().includes(t);
}

function renderResistanceNote(text){
  if(!text) return '';
  return `
    <div class="resistance-note">
      <span class="resistance-icon">↪</span>
      <div>
        <span class="resistance-label">If they resist</span>
        <p>${text}</p>
      </div>
    </div>
  `;
}

function renderTrustPhrases(items){
  if(!items || items.length === 0) return '';
  return `
    <p class="section-label">Universal trust-building phrases</p>
    <div class="trust-phrases">
      ${items.map(t => `
        <div class="trust-phrases-row">
          <span class="situation">${t.situation}</span>
          <span class="phrase">"${t.phrase}"</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderQuickJump(cat, skip){
  const allItems = cat.objectionGroups.flatMap(g => g.items);
  if(allItems.length === 0) return '';
  return `
    <div class="quick-jump">
      <div class="quick-jump-label">Jump straight to an objection (${allItems.length})</div>
      <div class="quick-jump-list">
        ${allItems.map(o => `<button class="quick-jump-chip" data-target="obj-${slugify(o.q)}">${o.q}</button>`).join('')}
      </div>
      ${skip ? `<button class="jump-link" id="${skip.id}">${skip.label}</button>` : ''}
    </div>
  `;
}

function renderBranchQuickJump(items){
  if(!items || items.length === 0) return '';
  return `
    <div class="quick-jump branch-jump">
      <div class="quick-jump-label">🌱 Jump to a question they might ask (${items.length})</div>
      <div class="quick-jump-list">
        ${items.map(o => `<button class="quick-jump-chip branch-chip" data-target="obj-${slugify(o.q)}">${o.q}</button>`).join('')}
      </div>
    </div>
  `;
}

function renderMain(){
  const main = document.getElementById('main');
  const cat = DATA.find(c=>c.id===activeCategory);

  let html = `
    <div class="category-head">
      <h2>${cat.label}</h2>
      <span class="category-tagline">${cat.tagline}</span>
    </div>
    <p class="category-desc">${cat.desc}</p>
  `;

  if(cat.objectionGroups){
    const groupsFor = (n) => cat.objectionGroups.filter(g => g.part === n);

    // Part 1 — Start of script, quick-jump index, then its own objections
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">1</div><div class="part-title">Start of Script</div></div>

        ${cat.complianceDisclosure ? `

          <div class="compliance-label">Required disclosure — read word-for-word next</div>
          <p>${cat.complianceDisclosure}</p>
          <div class="compliance-note">Flows directly out of the intro line above, before continuing the pitch — per CMS marketing guidelines.</div>
        </div>
        ` : ''}
        ${cat.nameAsk ? `
        <div class="script-flow">
          <div class="script-chunk">
            <div class="script-chunk-tag">${cat.nameAsk.tag}</div>
            <div><p class="script-chunk-text">${cat.nameAsk.text}</p></div>

        ${renderAlreadyHaveButton(cat.alreadyHaveMedicareScript)}
        ${cat.rapportQuestions ? `
        <p class="section-label">Build rapport before diving in</p>
        <div class="script-flow">
          ${cat.rapportQuestions.map(c=>`
            <div class="script-chunk">
              <div class="script-chunk-tag">${c.tag}</div>
              <div><p class="script-chunk-text">${c.text}</p></div>
            </div>
          `).join('')}
        </div>
        ` : ''}
        ${cat.intakeScript ? `
        <p class="section-label">Get the rest of their info</p>
        <div class="script-flow">
          ${cat.intakeScript.map(c=>`

        ${renderBranches(cat.zipReluctance, "If they hesitate to share it", "🔒")}
        ${cat.callInSoaNote ? `
        <div class="stage-note">

          </div>

        ` : ''}
        ${cat.anchorQuestions ? `
        <div class="stage-note">
          <span class="stage-note-icon">🛟</span>
          <div class="stage-note-body">
            <span class="stage-note-label">Coaching note — safety net if you freeze</span>

        ${cat.discoveryBeforePitch ? `

          <span class="stage-note-icon">🎯</span>

            <p>${cat.discoveryBeforePitch}</p>
          </div>
        </div>
        ` : ''}
        ${renderTrustPhrases(cat.trustPhrases)}
        ${renderQuickJump(cat, {id:"no-objection-jump", label:"No objection? Skip to Part 2 — Explain A &amp; B ↓"})}
        ${renderObjectionGroups(groupsFor(1))}
      </div>
    `;

    // Part 2 — Explain Original Medicare (A & B), plus Part C/D reference, with its own objections
    html += `
      <div class="part-block" id="part-2-block">
        <div class="part-head"><div class="part-num">2</div><div class="part-title">Explain Original Medicare (Part A &amp; B)</div></div>
        ${cat.partsAB ? `
        <div class="opening">
          <p>${cat.partsAB.ask}</p>
          <div class="stage-note">
            <span class="stage-note-icon">👁</span>
            <div class="stage-note-body">
              <span class="stage-note-label">Don't read aloud</span>
              <p>${cat.partsAB.note}</p>
            </div>
          </div>
          <p>${cat.partsAB.explain}</p>
        </div>
        ` : ''}
        ${cat.notCoveredScript ? `<div class="opening"><p>${cat.notCoveredScript}</p></div>` : ''}
        ${cat.partsCD ? `<div class="opening"><p>${cat.partsCD}</p></div>` : ''}
        ${renderBranches(cat.additionalKnowledge, "Good to know — penalties &amp; IRMAA", "📋")}
        ${renderBranchQuickJump(cat.part2Branches)}
        ${renderBranches(cat.part2Branches, "If they ask")}
