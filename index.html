<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbook — Insurance Scripts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#16233A;
    --ink-soft:#2B3A54;
    --paper:#FAF8F3;
    --paper-dim:#F0ECE2;
    --line: rgba(22,35,58,0.12);
    --gold:#C89B3C;
    --teal:#3E6C6C;
    --red:#A33D3D;
    --shadow: 0 8px 24px rgba(22,35,58,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  .app{
    max-width:1100px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
  }

  /* HEADER */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:28px 24px 22px;
    position:relative;
    border-bottom:4px solid var(--gold);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{
    color:rgba(250,248,243,0.65);
    font-size:14px;
    max-width:520px;
    line-height:1.5;
  }

  /* SEARCH */
  .searchbar{
    margin-top:18px;
    display:flex;
    gap:8px;
  }
  .searchbar input{
    flex:1;
    background:rgba(250,248,243,0.08);
    border:1px solid rgba(250,248,243,0.22);
    color:var(--paper);
    padding:11px 14px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .searchbar input::placeholder{color:rgba(250,248,243,0.45);}
  .searchbar input:focus{outline:2px solid var(--gold); outline-offset:1px;}

  /* TABS */
  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:16px 24px;
    background:var(--paper-dim);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:8px 13px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{border-color:var(--gold);}
  .tab-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .tab-btn .count{
    opacity:.55;
    margin-left:5px;
  }

  /* MAIN */
  main{padding:26px 24px 60px;}

  .category-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:4px;
  }
  .category-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  .category-tagline{
    font-size:13px;
    color:var(--ink-soft);
    opacity:.7;
  }
  .category-desc{
    font-size:14px;
    color:var(--ink-soft);
    max-width:640px;
    line-height:1.6;
    margin:10px 0 22px;
  }

  /* OPENING SCRIPT CARD */
  .opening{
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:28px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .opening::before{
    content:"OPENING SCRIPT";
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.15em;
    color:var(--gold);
    display:block;
    margin-bottom:10px;
  }
  .opening p{
    margin:0;
    font-size:15.5px;
    line-height:1.65;
    font-family:'Fraunces',serif;
    font-weight:400;
  }
  .opening p + p{margin-top:12px;}

  /* ===== REQUIRED COMPLIANCE DISCLOSURE ===== */
  .compliance{
    background:#fff;
    border:2px solid var(--red);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:22px;
    position:relative;
  }
  .compliance-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:10px;
  }
  .compliance-label::before{
    content:"⚠";
    font-size:13px;
  }
  .compliance p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    font-weight:500;
  }
  .compliance-note{
    margin-top:10px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* ===== ELIGIBILITY CHECKLIST ===== */
  .checklist-block{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--teal);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:22px;
  }
  .checklist-block.accent-gold{border-left-color:var(--gold);}
  .checklist-block.accent-red{border-left-color:var(--red);}
  .checklist-block.accent-gold .checklist-title{color:#8A6D1A;}
  .checklist-block.accent-red .checklist-title{color:var(--red);}
  .checklist-block.accent-gold .checklist-progress.complete{background:var(--gold); color:var(--ink);}
  .checklist-block.accent-red .checklist-progress.complete{background:var(--red); color:#fff;}
  .checklist-block.accent-gold .checklist-item input[type="checkbox"]:checked{background:var(--gold); border-color:var(--gold);}
  .checklist-block.accent-red .checklist-item input[type="checkbox"]:checked{background:var(--red); border-color:var(--red);}
  .checklist-block.accent-gold .checklist-item input[type="checkbox"]:checked::after{color:var(--ink);}
  .recommend-helper-wrap{margin-bottom:6px;}

  /* ===== INLINE SIGNAL CHECKBOXES (auto-tally next to each question) ===== */
  .signal-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .signal-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    padding:6px 10px 6px 8px;
    border-radius:14px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--paper-dim);
    color:var(--ink-soft);
  }
  .signal-chip input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:14px;
    height:14px;
    border:1.5px solid var(--ink-soft);
    border-radius:4px;
    flex-shrink:0;
    cursor:pointer;
    margin:0;
    position:relative;
  }
  .signal-chip.lean-ma input:checked{background:var(--gold); border-color:var(--gold);}
  .signal-chip.lean-medsupp input:checked{background:var(--teal); border-color:var(--teal);}
  .signal-chip input:checked::after{
    content:"✓";
    position:absolute;
    top:-3px;
    left:1px;
    color:#fff;
    font-size:10px;
    font-weight:700;
  }
  .signal-chip.checked{
    color:var(--ink);
    border-color:transparent;
  }
  .signal-chip.lean-ma.checked{background:rgba(200,155,60,0.18);}
  .signal-chip.lean-medsupp.checked{background:rgba(62,108,108,0.15);}

  .signal-tally{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    background:var(--ink);
    border-radius:8px;
    padding:12px 14px;
    margin:16px 0;
    align-items:center;
  }
  .signal-tally-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(250,248,243,0.55);
    margin-right:4px;
  }
  .tally-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:14px;
    color:#fff;
  }
  .tally-chip.lean-ma{background:var(--gold); color:var(--ink);}
  .tally-chip.lean-medsupp{background:var(--teal);}

  .checklist-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .checklist-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--teal);
  }
  .checklist-progress{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper-dim);
    border-radius:12px;
    padding:3px 10px;
    white-space:nowrap;
  }
  .checklist-progress.complete{
    background:var(--teal);
    color:#fff;
  }
  .checklist-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 4px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:19px;
    height:19px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    flex-shrink:0;
    margin-top:1px;
    cursor:pointer;
    position:relative;
    background:var(--paper);
  }
  .checklist-item input[type="checkbox"]:checked{
    background:var(--teal);
    border-color:var(--teal);
  }
  .checklist-item input[type="checkbox"]:checked::after{
    content:"✓";
    position:absolute;
    top:-2px;
    left:3px;
    color:#fff;
    font-size:13px;
    font-weight:700;
  }
  .checklist-item label{
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    cursor:pointer;
  }
  .checklist-item.checked label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(62,108,108,0.4);
  }
  .checklist-reset{
    margin-top:12px;
    background:none;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* ===== AUTO-COMPUTED ELIGIBILITY RESULT ===== */
  .eligibility-result{
    margin-top:2px;
    margin-bottom:22px;
    padding:14px 16px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--paper-dim);
    display:block;
  }
  .eligibility-result .result-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin-bottom:8px;
  }
  .eligibility-result .elig-line{
    margin:0;
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    font-weight:500;
  }
  .eligibility-result .elig-line + .elig-line{margin-top:6px;}
  .eligibility-result .elig-good{color:#2C5F5F;}
  .eligibility-result .elig-bad{color:var(--red);}
  .eligibility-result .elig-unknown{color:var(--ink-soft); font-weight:400;}
  .eligibility-result.state-full{background:rgba(62,108,108,0.1); border-color:var(--teal);}
  .eligibility-result.state-partial{background:rgba(200,155,60,0.12); border-color:var(--gold);}
  .eligibility-result.state-blocked{background:rgba(163,61,61,0.06); border-color:var(--red);}
  .eligibility-result.state-unknown{background:var(--paper-dim); border-color:var(--line);}

  /* ===== MINI DISCLOSURE (repeated per-call recording reminder) ===== */
  .mini-disclosure{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--red);
    border-radius:5px;
    padding:6px 10px;
    margin-bottom:10px;
  }
  .mini-disclosure .icon{font-size:11px; flex-shrink:0;}
  .mini-disclosure p{
    margin:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.01em;
    color:var(--red);
    font-weight:500;
  }

  /* ===== STAGE NOTE (don't read aloud) ===== */
  .stage-note{
    display:flex;
    align-items:flex-start;
    gap:8px;
    background:#FFF4CC;
    border:1px solid #E8C34A;
    border-radius:6px;
    padding:9px 12px;
    margin:12px 0;
  }
  .stage-note-icon{
    font-size:13px;
    line-height:1.4;
    flex-shrink:0;
  }
  .stage-note-body{flex:1;}
  .stage-note-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8A6D1A;
    display:block;
    margin-bottom:2px;
  }
  .stage-note p{
    margin:0;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    line-height:1.5;
    color:#5C4A10;
    font-style:italic;
  }

  /* OBJECTION LIST */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--red);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
    transition:box-shadow .15s ease;
  }
  .card.answered{border-left-color:var(--teal);}
  .card:hover{box-shadow:var(--shadow);}

  .card-q{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .card-q .qtext{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
  }
  .card-q .qtext::before{
    content:"“";
    color:var(--red);
    font-family:'Fraunces',serif;
    font-size:18px;
    margin-right:2px;
  }
  .branch-card{border-left-color:var(--teal);}
  .branch-card .qtext::before{content:"?"; color:var(--teal); font-family:'IBM Plex Mono',monospace; font-size:14px;}
  .branch-group .obj-group-head{background:var(--teal);}
  .branch-group .obj-group-head .chevron{color:#fff;}

  /* ===== PLAN TYPE BUTTONS (MAPD / MA / PDP & Med Supp) ===== */
  .plan-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:16px 0;
  }
  .plan-card{border-left-color:var(--gold); border-width:1px;}
  .plan-card .qtext{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-size:13px;
  }
  .plan-card .qtext::before{content:none;}
  .plan-card .card-q{padding:14px 16px;}
  .plan-card.recommended{
    border-left-width:4px;
    border-left-color:var(--teal);
    box-shadow:0 0 0 1px var(--teal);
  }
  .plan-card.recommended .qtext::after{
    content:"MATCHES THEIR ANSWERS";
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:.08em;
    color:var(--teal);
    background:rgba(62,108,108,0.12);
    padding:3px 8px;
    border-radius:10px;
    margin-left:8px;
    white-space:nowrap;
  }
  .deep-dive{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--gold);
  }
  .deep-dive-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8A6D1A;
    display:block;
    margin-bottom:8px;
  }
  .deep-dive p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .already-step{margin-bottom:14px;}
  .already-step:last-child{margin-bottom:0;}
  .already-step-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:4px;
  }
  .already-step p{
    margin:0;
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
  }
  .chevron{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    transition:transform .18s ease;
    flex-shrink:0;
  }
  .card.open .chevron{transform:rotate(90deg);}

  .card-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
  }
  .card.open .card-a{max-height:1000px;}
  .card-a-inner{
    padding:0 18px 18px 18px;
    border-top:1px solid var(--line);
    margin-top:0;
  }
  .card-a-inner .say-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--teal);
    margin:14px 0 6px;
  }
  .card-a-inner p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ===== FRAMEWORK (Term / Whole / Final Expense) ===== */
  .fw-intro{
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 18px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .fw-intro b{color:var(--ink);}

  .fw-step{
    display:grid;
    grid-template-columns:52px 1fr;
    gap:16px;
    margin-bottom:22px;
  }
  .fw-step-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    color:var(--gold);
    line-height:1;
    text-align:center;
    padding-top:2px;
  }
  .fw-step-rail{
    position:relative;
  }
  .fw-step-rail::before{
    content:"";
    position:absolute;
    left:-38px;
    top:38px;
    bottom:-22px;
    width:1px;
    background:var(--line);
  }
  .fw-step:last-of-type .fw-step-rail::before{display:none;}

  .fw-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
  }
  .fw-step-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:8px;
  }
  .fw-ask{
    font-family:'Fraunces',serif;
    font-size:16px;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 14px;
  }
  .fw-ask::before{content:"“"; color:var(--gold); font-size:20px;}
  .fw-ask::after{content:"”"; color:var(--gold); font-size:20px;}

  .fw-answers{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  @media(min-width:560px){
    .fw-answers{grid-template-columns:1fr 1fr;}
  }
  .fw-answer{
    border-radius:6px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.5;
  }
  .fw-answer.bad{
    background:rgba(163,61,61,0.07);
    border:1px solid rgba(163,61,61,0.25);
  }
  .fw-answer.good{
    background:rgba(62,108,108,0.08);
    border:1px solid rgba(62,108,108,0.3);
  }
  .fw-answer .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  .fw-answer.bad .tag{color:var(--red);}
  .fw-answer.good .tag{color:var(--teal);}
  .fw-answer p{margin:0; color:var(--ink);}

  .fw-followup{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .fw-followup .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:4px;
  }

  .fw-close{
    margin-top:32px;
    padding-top:24px;
    border-top:2px solid var(--ink);
  }
  .fw-close-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .fw-close-head h3{
    font-family:'Fraunces',serif;
    font-size:20px;
    margin:0;
    color:var(--ink);
  }
  .fw-close-sub{
    font-size:13px;
    color:var(--ink-soft);
    opacity:.75;
  }
  .fw-close-intro{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:8px 0 18px;
  }

  .fw-option{
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .fw-option-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .fw-option-stack{
    font-size:14px;
    line-height:1.6;
    color:rgba(250,248,243,0.9);
    margin:0 0 10px;
  }
  .fw-option-price{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--paper);
    border-top:1px solid rgba(250,248,243,0.18);
    padding-top:10px;
  }
  .fw-option-price b{color:var(--gold);}

  /* ===== REFERENCE (Medicare parts & plan types) ===== */
  .ref-block{margin-bottom:28px;}
  .ref-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media(min-width:640px){
    .ref-grid{grid-template-columns:1fr 1fr;}
  }
  .ref-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--teal);
    border-radius:8px;
    padding:14px 16px;
  }
  .ref-card .ref-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--teal);
    margin-bottom:4px;
  }
  .ref-card .ref-title{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 6px;
  }
  .ref-card p{
    font-size:13px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0;
  }
  .ref-card.plan-type{border-left-color:var(--gold);}
  .ref-card.plan-type .ref-name{color:var(--gold);}

  /* ===== OBJECTION GROUPS (accordion sections) ===== */
  .obj-group{margin-bottom:14px;}
  .obj-group-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:7px;
    padding:12px 16px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-align:left;
  }
  .obj-group-head .count{
    opacity:.6;
    font-size:11px;
  }
  .obj-group-head .chevron{
    font-size:14px;
    color:var(--gold);
    transition:transform .18s ease;
    flex-shrink:0;
  }
  .obj-group.open .obj-group-head .chevron{transform:rotate(90deg);}
  .obj-group-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .obj-group.open .obj-group-body{max-height:12000px;}
  .obj-group-body-inner{padding-top:10px;}

  /* ===== SCRIPT PARTS (numbered sections, e.g. Medicare) ===== */
  .part-block{margin-bottom:30px;}
  .part-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .part-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    color:var(--gold);
    background:var(--ink);
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .part-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .jump-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    background:none;
    border:1px dashed var(--gold);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .jump-link:hover{background:rgba(200,155,60,0.1);}
  .quick-jump .jump-link{
    color:var(--paper);
    border-color:var(--gold);
    background:rgba(250,248,243,0.06);
    display:flex;
    width:100%;
    justify-content:center;
  }
  .quick-jump .jump-link:hover{background:rgba(200,155,60,0.2);}

  /* ===== STRATEGY NOTE ===== */
  .strategy-block{
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .strategy-block h4{
    font-family:'Fraunces',serif;
    font-size:15px;
    margin:0 0 12px;
    color:var(--ink);
  }
  .strategy-step{
    display:flex;
    gap:10px;
    margin-bottom:9px;
    font-size:13px;
    line-height:1.5;
  }
  .strategy-step:last-of-type{margin-bottom:0;}
  .strategy-step .s-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    color:var(--teal);
    flex-shrink:0;
    white-space:nowrap;
    padding-top:1px;
  }
  .strategy-step p{margin:0; color:var(--ink-soft);}
  .strategy-source{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.7;
  }

  /* ===== FLOWING SCRIPT CHUNKS (e.g. Plan Types script) ===== */
  .script-flow{margin-bottom:6px;}
  .script-chunk{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .script-chunk:last-of-type{border-bottom:none;}
  .script-chunk-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal);
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:5px;
    padding:4px 9px;
    height:fit-content;
    white-space:nowrap;
  }
  .script-chunk-text{
    font-family:'Fraunces',serif;
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink);
    margin:0;
  }
  .script-chunk-text + .mini-disclosure{margin-top:10px;}
  .mini-disclosure + .script-chunk-text{margin-top:0;}
  .script-chunk-note{
    margin:10px 0 0;
  }
  @media(max-width:520px){
    .script-chunk{grid-template-columns:1fr; gap:6px;}
    .script-chunk-tag{width:fit-content;}
  }

  /* ===== RESISTANCE NOTE (fallback if they push back) ===== */
  .resistance-note{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-top:10px;
    padding:9px 12px;
    border-radius:6px;
    background:rgba(200,155,60,0.08);
    border:1px dashed var(--gold);
  }
  .resistance-icon{font-size:12px; color:#8A6D1A; flex-shrink:0; margin-top:1px;}
  .resistance-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8A6D1A;
    display:block;
    margin-bottom:3px;
  }
  .resistance-note p{
    margin:0;
    font-size:12.5px;
    line-height:1.5;
    color:var(--ink);
  }

  /* ===== TRUST PHRASES QUICK-REFERENCE ===== */
  .trust-phrases{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .trust-phrases-row{
    display:grid;
    grid-template-columns:1fr 1.6fr;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
  }
  .trust-phrases-row:last-child{border-bottom:none;}
  .trust-phrases-row .situation{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--teal);
    font-weight:500;
  }
  .trust-phrases-row .phrase{
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    font-style:italic;
  }
  @media(max-width:520px){
    .trust-phrases-row{grid-template-columns:1fr;}
  }

  /* ===== QUICK JUMP INDEX ===== */
  .quick-jump{
    background:var(--ink);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:20px;
  }
  .quick-jump-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .quick-jump-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .quick-jump-chip{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--paper);
    background:rgba(250,248,243,0.08);
    border:1px solid rgba(250,248,243,0.2);
    border-radius:16px;
    padding:6px 12px;
    cursor:pointer;
    text-align:left;
    line-height:1.3;
  }
  .quick-jump-chip:hover{
    background:rgba(200,155,60,0.25);
    border-color:var(--gold);
  }
  @keyframes flashHighlight{
    0%{background:rgba(200,155,60,0.35);}
    100%{background:transparent;}
  }
  .card.flash{animation:flashHighlight 1.4s ease-out;}

  .branch-jump{background:var(--teal);}
  .branch-jump .quick-jump-label{color:#fff;}
  .branch-chip{
    background:rgba(255,255,255,0.12);
    border-color:rgba(255,255,255,0.28);
  }
  .branch-chip:hover{background:rgba(255,255,255,0.24); border-color:#fff;}
  @keyframes flashHighlightTeal{
    0%{background:rgba(62,108,108,0.28);}
    100%{background:transparent;}
  }
  .branch-card.flash{animation:flashHighlightTeal 1.4s ease-out;}

  footer{
    text-align:center;
    padding:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(250,248,243,0.4);
  }

  @media (max-width:640px){
    header{padding:22px 16px 18px;}
    nav.tabs{padding:12px 16px;}
    main{padding:20px 16px 50px;}
    .card-q .qtext{font-size:13.5px;}
  }

/* ===== DYNAMIC MEDICARE CALL ASSISTANT ===== */
.assistant-shell{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.75fr);gap:22px;align-items:start}
.assistant-hero{background:linear-gradient(135deg,var(--ink),#233653);color:var(--paper);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.assistant-hero .eyebrow{margin-bottom:8px}.assistant-hero h2{font-family:'Fraunces',serif;font-size:30px;margin:0 0 8px}
.assistant-hero p{margin:0;color:rgba(250,248,243,.75);line-height:1.55}
.flow-card,.summary-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 4px 16px rgba(22,35,58,.06);margin-bottom:16px}
.flow-title{font-family:'Fraunces',serif;font-size:21px;margin:0 0 5px}.flow-sub{font-size:13px;color:var(--ink-soft);opacity:.75;margin:0 0 14px;line-height:1.45}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice-btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:14px;text-align:left;cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;transition:.15s}
.choice-btn:hover{border-color:var(--gold);transform:translateY(-1px)}.choice-btn.selected{border:2px solid var(--teal);background:#f2f7f5}
.choice-btn strong{display:block;font-size:14px;margin-bottom:4px}.choice-btn span{font-size:12px;color:var(--ink-soft);line-height:1.4}
.script-now{border-left:4px solid var(--gold);background:#fffaf0;border-radius:8px;padding:15px 16px;margin:14px 0}
.script-now .mini{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:#8a651e;text-transform:uppercase;margin-bottom:7px}
.script-now p{font-family:'Fraunces',serif;font-size:16px;line-height:1.55;margin:0}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:var(--paper);font:13px 'Inter',sans-serif;color:var(--ink)}
.field textarea{min-height:70px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:1px}
.pill-row{display:flex;flex-wrap:wrap;gap:7px}.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 11px;font-size:12px;cursor:pointer}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stagebar{display:flex;gap:5px;margin-bottom:16px;overflow:auto}.stage{flex:1;min-width:85px;padding:8px 6px;border-bottom:3px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);opacity:.6}.stage.active{border-color:var(--gold);opacity:1;font-weight:700}
.call-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.action-btn{border:0;border-radius:7px;padding:10px 13px;font:600 12px 'Inter',sans-serif;cursor:pointer;background:var(--ink);color:#fff}.action-btn.secondary{background:var(--paper-dim);color:var(--ink);border:1px solid var(--line)}.action-btn.gold{background:var(--gold);color:var(--ink)}
.summary-card{position:sticky;top:76px}.summary-card h3{font-family:'Fraunces',serif;margin:0 0 12px}.summary-line{border-bottom:1px solid var(--line);padding:8px 0}.summary-line:last-child{border-bottom:0}.summary-line b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);opacity:.65;margin-bottom:3px}.summary-line span{font-size:13px;line-height:1.4;white-space:pre-wrap}
.safety-note{font-size:11px;line-height:1.45;color:var(--ink-soft);background:var(--paper-dim);border-radius:7px;padding:10px;margin-top:12px}
@media(max-width:800px){.assistant-shell{grid-template-columns:1fr}.summary-card{position:static}.choice-grid,.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}


.phone-start{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px rgba(22,35,58,.06)}

.walkthrough-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}

.assistant-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}

.mca-quick-overlay{position:fixed;inset:0;z-index:9999;background:rgba(20,27,26,.48);align-items:center;justify-content:center;padding:20px}
.quick-objection-modal{width:min(1100px,96vw);height:min(760px,92vh);background:var(--paper,#fff);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.quick-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.quick-modal-head h3{font-family:'Fraunces',serif;font-size:25px;margin:2px 0}
.quick-close{border:0;background:transparent;font-size:32px;line-height:1;cursor:pointer;padding:4px 9px}
.quick-search-wrap{display:flex;align-items:center;gap:8px;padding:0 20px 12px}
.quick-search-wrap span{font-size:22px}.quick-search-wrap input{margin:0;flex:1;font-size:15px;padding:11px 13px}
.quick-common{padding:0 20px 10px}.quick-common-buttons,.quick-category-row{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.quick-common-buttons button,.quick-category-row button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:700}
.quick-category-row{padding:9px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quick-category-row button.selected{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.quick-objection-body{display:grid;grid-template-columns:minmax(270px,38%) 1fr;min-height:0;flex:1}
.quick-objection-list{overflow:auto;border-right:1px solid var(--line);padding:8px}
.quick-objection-list>button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.quick-objection-list>button:hover{background:rgba(0,0,0,.035)}
.quick-objection-list span{font-weight:700;font-size:13px}.quick-objection-list small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.quick-objection-answer{overflow:auto;padding:22px}.quick-objection-answer h4{font-family:'Fraunces',serif;font-size:22px;margin:7px 0 14px}
.quick-script{font-size:16px;line-height:1.65;padding:16px;border-left:4px solid var(--teal);background:rgba(0,0,0,.025);white-space:pre-line}
.copy-quick{margin-top:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}
.quick-empty{padding:22px;color:var(--muted)}
@media(max-width:720px){.mca-quick-overlay{padding:6px}.quick-objection-modal{width:100%;height:96vh}.quick-objection-body{grid-template-columns:1fr}.quick-objection-list{max-height:36vh;border-right:0;border-bottom:1px solid var(--line)}.quick-common{display:none}}


.mca-call-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;align-items:stretch}
.mca-call-main{min-width:0;background:var(--paper,#fff)}

.completed-checkpoint{padding:10px 14px}
.completed-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.plan-summary-card{
  margin-bottom:12px;
  border:2px solid var(--line);
  border-radius:14px;
  background:var(--paper,#fff);
  padding:14px;
  box-shadow:0 5px 16px rgba(0,0,0,.04);
}
.summary-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.summary-row{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.summary-row:last-child{border-bottom:0;padding-bottom:0}
.summary-row span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.summary-row strong{font-size:13px;line-height:1.35}

.mca-sticky-summary{min-width:0;align-self:stretch}
.mca-sticky-stack{
  position:sticky;
  top:16px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.mca-sticky-summary .plan-summary-card{position:static}
.call-notes-card{padding:14px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.04)}
.call-notes-card .mca-notes{width:100%;min-height:120px;box-sizing:border-box;margin-top:10px}
.call-notes-card .note-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.call-notes-card .note-actions .action-btn{flex:1 1 160px}












@media(max-width:980px){
  .mca-call-layout{display:block}
  .mca-sticky-summary{display:none}
  .mca-sticky-stack{position:static}
  .mca-sticky-summary .plan-summary-card{position:static}
}


.context-objections{margin:12px 0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.018)}
.context-objection-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}
.context-objection-head span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.context-objection-head small{font-size:10px;color:var(--muted)}
.context-objection-chips{display:flex;gap:6px;flex-wrap:wrap}
.context-objection-chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;cursor:pointer;font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.context-objection-chips button:hover,.context-objection-chips button.selected{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.context-objection-answer{margin-top:9px;padding:11px 12px;border-left:3px solid var(--teal);background:#fff;border-radius:6px}
.context-objection-answer p{margin:8px 0 0;line-height:1.55;font-size:14px}
.context-answer-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.context-answer-top strong{font-size:13px}
.context-answer-top button{border:0;background:transparent;cursor:pointer;font-size:20px;line-height:1}
@media(max-width:720px){.context-objection-head small{display:none}.context-objection-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}.context-objection-chips button{flex:0 0 auto;max-width:240px}}

.education-checkin{margin:14px 0;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.education-checkin p{margin:5px 0 10px;line-height:1.5}.mbi-card .mini-note{margin-top:10px;padding:9px 11px;border-radius:8px;background:rgba(0,0,0,.035);font-size:12px;line-height:1.45}

.education-script-card{margin-bottom:12px}
.education-say-this{border-left:4px solid currentColor;padding-left:14px}

.education-plan-script-label{margin:10px 0 4px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.035)}

.tab-btn[data-id="medicare"],

.quote-script{display:grid;gap:9px;margin-top:12px}

    partsAB: {
      ask: "Quick question for you — do you know the difference between Part A and Part B?",
      note: "Let them answer — a lot of people say no, or they mix them up, and that's completely fine.",
      explain: "So here's the simple way to think about it: Part A is your hospital insurance — that's what kicks in if you're admitted to the hospital, need skilled nursing care, or hospice. Part B is your medical insurance — that covers your doctor visits, outpatient care, and preventive stuff like screenings and vaccines. Together, A and B are what people call 'Original Medicare.' Make sense so far?"
    },
    notCoveredScript: "Now, there's a few things Original Medicare doesn't cover on its own — routine dental, vision, and hearing, plus prescription drugs. That's exactly why plans like the ones we'll go over next exist — to help fill those gaps.",
    partsCD: "There's also two more parts worth knowing — Part C and Part D. Part C, or Medicare Advantage, is just an alternative way to get your Part A and B — often bundled with Part D too — through a private insurer approved by Medicare. It usually adds extras like dental, vision, and hearing, but it ties you to a network, which is exactly the MAPD or MA plan we'll get into in a bit. Part D is your prescription drug coverage — you can get it as its own standalone plan alongside Original Medicare, or it comes bundled into most Medicare Advantage plans. One thing worth mentioning now: if you go without Part D when you're first eligible and don't have other creditable drug coverage, it can trigger a permanent late-enrollment penalty — so it's worth having in place even if you're not on many medications yet.",
    part2Branches: [
      {q:"Will my pre-existing conditions be a problem?", a:"That's a really common worry, and the good news is no — by law, Medicare Parts A, B, Medicare Advantage, and Part D all have to cover you and can't charge you more because of a pre-existing condition. That protection is built in across all four. The one exception is Medicare Supplement outside its guaranteed-issue window, but I'll walk you through that if we get there."},
      {q:"Can I be denied Medicare because of my health?", a:"You can't, actually — federal law says Medicare can't refuse you coverage based on your health history. Everyone who's eligible gets in, regardless of what conditions they're managing."}
    ],
    additionalKnowledge: [
      {q:"Late enrollment penalties", a:"There are three different penalties depending on what they delayed. One applies only if they don't qualify for premium-free hospital coverage — delaying adds up to 10% to the premium, but only for twice the number of years they delayed (wait 2 years, pay the penalty for 4). Another adds 10% for every full 12-month period they went without their medical coverage, and lasts for as long as they have it — essentially for life. And one for drug coverage kicks in after 63 or more consecutive days without creditable coverage, lasting as long as they have Medicare drug coverage, even if they switch plans. All of these can be waived with credible alternative coverage, like a current employer plan."},
      {q:"IRMAA (income-related premium adjustment)", a:"Higher-income clients can pay more for Part B and Part D based on their tax return from two years prior. Worth a heads-up if their income is on the higher end, so the premium isn't a surprise."}
    ],
    planTypeBridge: "Let's start with the different types of plans out there, so you know exactly what we're comparing before I ask you some questions to help narrow it down.",
    planTypeOptions: [
      {name:"MAPD", text:"Most folks I talk to end up in what's called an MAPD — that's Medicare Advantage with prescription drug coverage. By law, it has to cover everything Original Medicare covers, but your out-of-pocket costs can look different — it bundles your medical and drug coverage into one plan, usually with a low or $0 premium, plus extras like dental, vision, and hearing. The trade-off is you're working within that plan's network of doctors.", deepDive:"Since MAPD sounds like the direction for you, let's get specific. I'll pull up the plans available in your area and we'll walk through them side by side — the premium, whether your doctors are in-network, your prescriptions against each plan's formulary, and the extra benefits like dental, vision, and hearing plan by plan. I'll also point out the Maximum Out-of-Pocket limit on each one, since that's your safety net in a bad year — once you hit it, the plan covers 100% for the rest of the year."},
      {name:"MA", text:"Now, if you're already getting your prescriptions covered somewhere else — say through the VA or a retiree plan — there's also a plain MA plan. Same rule applies — it has to cover everything Original Medicare does, same network trade-off, just without the drug piece, since you wouldn't need it twice.", deepDive:"Since a standalone MA plan fits your situation, we'll go through your area's options the same way — premium, whether your doctors are in-network, and the extra benefits available. Since you're getting drugs covered elsewhere, we don't need to check formularies, but I do want to confirm your other drug coverage counts as creditable, so you're protected from a Part D late-enrollment penalty down the road if that ever changes."},
      {name:"PDP & Med Supp", text:"If having more flexibility in which doctors and specialists you see is important to you, another option is staying with Original Medicare and considering a Medicare Supplement to help with some of the out-of-pocket costs Original Medicare leaves behind. Prescription coverage would generally be handled separately through a Part D plan if you need one. Medicare Supplement plans typically have a higher monthly premium than many Medicare Advantage plans, but they generally allow you to see providers nationwide who accept Medicare without having to use a Medicare Advantage plan’s provider network.", deepDive:"Since we're going the Original Medicare plus Supplement route, this is actually two decisions, so let's take them one at a time. First, we'll pick a Medigap plan letter based on how much out-of-pocket protection you want — Plan G and Plan N are the most common ones people choose right now. Then, separately, we'll shop your specific prescriptions against PDP options in your area to find the best price on your formulary. I'll walk you through both."}

    planTypeWrapup: "So really it comes down to one trade-off: lower cost with a network, through an MAPD or MA plan, or no network at all with Original Medicare, a PDP, and a Supplement. Now that you've got a sense of the options, let's narrow down which one actually fits your situation best.",
    soaCheckpoint: "Everything up through here has to stay educational — general information about Medicare, not specific plans. Past this point, you can only discuss plan-specific details, premiums, or recommendations if you have a completed Scope of Appointment (SOA) on file for this client.",
    narrowingQuestions: [
      {tag:"Payment Style", text:"Now that we've got the SOA squared away, let's narrow this down. When it comes to paying for healthcare, would you rather keep your monthly premium low and expect more cost when you actually use care — or pay a bit more each month to keep your out-of-pocket costs low when something comes up? To make it concrete: how would you feel about a $10 copay every time you see your primary doctor, versus a $500 copay if you ever had an inpatient hospital stay?",

      {tag:"What Else Matters", text:"Last one, and it's a bit open-ended — is there anything else important to you in a health plan that we haven't talked about yet? Some people care about convenience, for example — a Medicare Advantage plan usually means one card for everything, where a Medicare Supplement means carrying separate cards for Medicare, your Supplement, and your drug plan. Others actually prefer that separation since it can mean fewer surprise bills to track. Just want to make sure I'm not missing something that matters to you.",

    planMappingGuide: "Generally: if limiting out-of-pocket cost matters most, even at a higher premium, a Medicare Supplement tends to fit best. If they're comfortable with a network in exchange for a lower premium, a Medicare Advantage plan usually fits — and if they want that lower premium but still want flexibility to go outside the network sometimes, a PPO-style Medicare Advantage plan can bridge that gap. If keeping everything bundled into one plan and one card matters most, that also points toward Medicare Advantage, since it typically combines A, B, and D plus extras — versus Original Medicare or a Supplement, which usually means separate products for drug coverage and things like dental. Ancillary products — dental, vision, hearing, hospital indemnity — can also be layered on top of any of these to round out the coverage.",
    enrollmentPeriodsReview: {tag:"Enrollment Periods", text:"This is also a good time to check what enrollment periods apply. Look at their Medicare effective date — are they still in their Initial Enrollment Period, or does a Medicare Supplement Open Enrollment period apply? Remind them about the Annual Enrollment Period too, since that's their yearly chance to make a change. And ask if anything's changed recently — a move, losing coverage, anything that might qualify them for a Special Enrollment Period to join, drop, or switch coverage."},
    part4Branches: [
      {q:"Is there a cap on what I'll pay out of pocket?", a:"Good question — with a Medicare Advantage plan, yes, there's an annual Maximum Out-of-Pocket limit, or MOOP. Once you hit that number, the plan covers 100% of covered services for the rest of the year. Original Medicare on its own doesn't have that cap, which is exactly why people pair it with a Medigap or Advantage plan."},
      {q:"Can I have a Medicare Supplement and a Medicare Advantage plan at the same time?", a:"That one trips a lot of people up — those two actually don't combine. Medigap only works alongside Original Medicare, so if you're on a Medicare Advantage plan you can't also carry a Medigap policy, and to buy Medigap in the first place you have to be enrolled in Original Medicare."},
      {q:"Will my health conditions affect whether I can get a Medicare Supplement, or what I pay for it?", a:"It really comes down to timing. If you're enrolling during your 6-month Medigap Open Enrollment window around your 65th birthday, insurers can't ask you any health questions at all — you're guaranteed acceptance. Outside that window, or if you switch Medigap plans later, medical underwriting applies and acceptance can vary by plan."},
      {q:"Aren't the Medicare Advantage Open Enrollment Period and General Enrollment Period the same thing?", a:"They share the same dates, January 1 to March 31, so I get why that's confusing — but they're actually different. The General Enrollment Period is for someone signing up for Part B for the first time after missing their Initial Enrollment Period. The Medicare Advantage Open Enrollment Period is for someone already on an Advantage plan who wants to switch or go back to Original Medicare. Worth being precise about which one actually applies to you."},
      {q:"I have Medicaid — can I still get a Medicare Supplement?", a:"That's actually one combination that's not allowed — by law, a Medicare Supplement can't be sold to someone who has Medicaid. The good news is Medicaid already covers a lot of the same cost-sharing gaps a Supplement would, so you're likely already protected there. Let's look at what fits instead, like a Medicare Advantage plan designed for dual-eligible members."}

    partsAB: {
      ask: "Quick question for you — do you know the difference between Part A and Part B?",
      note: "Let them answer — a lot of people say no, or they mix them up, and that's completely fine.",
      explain: "So here's the simple way to think about it: Part A is your hospital insurance — that's what kicks in if you're admitted to the hospital, need skilled nursing care, or hospice. Part B is your medical insurance — that covers your doctor visits, outpatient care, and preventive stuff like screenings and vaccines. Together, A and B are what people call 'Original Medicare.' Make sense so far?"
    },
    notCoveredScript: "Now, there's a few things Original Medicare doesn't cover on its own — routine dental, vision, and hearing, plus prescription drugs. That's exactly why plans like the ones we'll go over next exist — to help fill those gaps.",
    partsCD: "There's also two more parts worth knowing — Part C and Part D. Part C, or Medicare Advantage, is just an alternative way to get your Part A and B — often bundled with Part D too — through a private insurer approved by Medicare. It usually adds extras like dental, vision, and hearing, but it ties you to a network, which is exactly the MAPD or MA plan we'll get into in a bit. Part D is your prescription drug coverage — you can get it as its own standalone plan alongside Original Medicare, or it comes bundled into most Medicare Advantage plans. One thing worth mentioning now: if you go without Part D when you're first eligible and don't have other creditable drug coverage, it can trigger a permanent late-enrollment penalty — so it's worth having in place even if you're not on many medications yet.",
    part2Branches: [
      {q:"Will my pre-existing conditions be a problem?", a:"That's a really common worry, and the good news is no — by law, Medicare Parts A, B, Medicare Advantage, and Part D all have to cover you and can't charge you more because of a pre-existing condition. That protection is built in across all four. The one exception is Medicare Supplement outside its guaranteed-issue window, but I'll walk you through that if we get there."},
      {q:"Can I be denied Medicare because of my health?", a:"You can't, actually — federal law says Medicare can't refuse you coverage based on your health history. Everyone who's eligible gets in, regardless of what conditions they're managing."}
    ],
    additionalKnowledge: [
      {q:"Late enrollment penalties", a:"There are three different penalties depending on what they delayed. One applies only if they don't qualify for premium-free hospital coverage — delaying adds up to 10% to the premium, but only for twice the number of years they delayed (wait 2 years, pay the penalty for 4). Another adds 10% for every full 12-month period they went without their medical coverage, and lasts for as long as they have it — essentially for life. And one for drug coverage kicks in after 63 or more consecutive days without creditable coverage, lasting as long as they have Medicare drug coverage, even if they switch plans. All of these can be waived with credible alternative coverage, like a current employer plan."},
      {q:"IRMAA (income-related premium adjustment)", a:"Higher-income clients can pay more for Part B and Part D based on their tax return from two years prior. Worth a heads-up if their income is on the higher end, so the premium isn't a surprise."}
    ],
    planTypeBridge: "Let's start with the different types of plans out there, so you know exactly what we're comparing before I ask you some questions to help narrow it down.",
    planTypeOptions: [
      {name:"MAPD", text:"Most folks I talk to end up in what's called an MAPD — that's Medicare Advantage with prescription drug coverage. By law, it has to cover everything Original Medicare covers, but your out-of-pocket costs can look different — it bundles your medical and drug coverage into one plan, usually with a low or $0 premium, plus extras like dental, vision, and hearing. The trade-off is you're working within that plan's network of doctors.", deepDive:"Since MAPD sounds like the direction for you, let's get specific. I'll pull up the plans available in your area and we'll walk through them side by side — the premium, whether your doctors are in-network, your prescriptions against each plan's formulary, and the extra benefits like dental, vision, and hearing plan by plan. I'll also point out the Maximum Out-of-Pocket limit on each one, since that's your safety net in a bad year — once you hit it, the plan covers 100% for the rest of the year."},
      {name:"MA", text:"Now, if you're already getting your prescriptions covered somewhere else — say through the VA or a retiree plan — there's also a plain MA plan. Same rule applies — it has to cover everything Original Medicare does, same network trade-off, just without the drug piece, since you wouldn't need it twice.", deepDive:"Since a standalone MA plan fits your situation, we'll go through your area's options the same way — premium, whether your doctors are in-network, and the extra benefits available. Since you're getting drugs covered elsewhere, we don't need to check formularies, but I do want to confirm your other drug coverage counts as creditable, so you're protected from a Part D late-enrollment penalty down the road if that ever changes."},
      {name:"PDP & Med Supp", text:"If having more flexibility in which doctors and specialists you see is important to you, another option is staying with Original Medicare and considering a Medicare Supplement to help with some of the out-of-pocket costs Original Medicare leaves behind. Prescription coverage would generally be handled separately through a Part D plan if you need one. Medicare Supplement plans typically have a higher monthly premium than many Medicare Advantage plans, but they generally allow you to see providers nationwide who accept Medicare without having to use a Medicare Advantage plan’s provider network.", deepDive:"Since we're going the Original Medicare plus Supplement route, this is actually two decisions, so let's take them one at a time. First, we'll pick a Medigap plan letter based on how much out-of-pocket protection you want — Plan G and Plan N are the most common ones people choose right now. Then, separately, we'll shop your specific prescriptions against PDP options in your area to find the best price on your formulary. I'll walk you through both."}

    planMappingGuide: "Generally: if limiting out-of-pocket cost matters most, even at a higher premium, a Medicare Supplement tends to fit best. If they're comfortable with a network in exchange for a lower premium, a Medicare Advantage plan usually fits — and if they want that lower premium but still want flexibility to go outside the network sometimes, a PPO-style Medicare Advantage plan can bridge that gap. If keeping everything bundled into one plan and one card matters most, that also points toward Medicare Advantage, since it typically combines A, B, and D plus extras — versus Original Medicare or a Supplement, which usually means separate products for drug coverage and things like dental. Ancillary products — dental, vision, hearing, hospital indemnity — can also be layered on top of any of these to round out the coverage.",
    enrollmentPeriodsReview: {tag:"Enrollment Periods", text:"This is also a good time to check what enrollment periods apply. Look at their Medicare effective date — are they still in their Initial Enrollment Period, or does a Medicare Supplement Open Enrollment period apply? Remind them about the Annual Enrollment Period too, since that's their yearly chance to make a change. And ask if anything's changed recently — a move, losing coverage, anything that might qualify them for a Special Enrollment Period to join, drop, or switch coverage."},
    part4Branches: [
      {q:"Is there a cap on what I'll pay out of pocket?", a:"Good question — with a Medicare Advantage plan, yes, there's an annual Maximum Out-of-Pocket limit, or MOOP. Once you hit that number, the plan covers 100% of covered services for the rest of the year. Original Medicare on its own doesn't have that cap, which is exactly why people pair it with a Medigap or Advantage plan."},
      {q:"Can I have a Medicare Supplement and a Medicare Advantage plan at the same time?", a:"That one trips a lot of people up — those two actually don't combine. Medigap only works alongside Original Medicare, so if you're on a Medicare Advantage plan you can't also carry a Medigap policy, and to buy Medigap in the first place you have to be enrolled in Original Medicare."},
      {q:"Will my health conditions affect whether I can get a Medicare Supplement, or what I pay for it?", a:"It really comes down to timing. If you're enrolling during your 6-month Medigap Open Enrollment window around your 65th birthday, insurers can't ask you any health questions at all — you're guaranteed acceptance. Outside that window, or if you switch Medigap plans later, medical underwriting applies and acceptance can vary by plan."},
      {q:"Aren't the Medicare Advantage Open Enrollment Period and General Enrollment Period the same thing?", a:"They share the same dates, January 1 to March 31, so I get why that's confusing — but they're actually different. The General Enrollment Period is for someone signing up for Part B for the first time after missing their Initial Enrollment Period. The Medicare Advantage Open Enrollment Period is for someone already on an Advantage plan who wants to switch or go back to Original Medicare. Worth being precise about which one actually applies to you."},
      {q:"I have Medicaid — can I still get a Medicare Supplement?", a:"That's actually one combination that's not allowed — by law, a Medicare Supplement can't be sold to someone who has Medicaid. The good news is Medicaid already covers a lot of the same cost-sharing gaps a Supplement would, so you're likely already protected there. Let's look at what fits instead, like a Medicare Advantage plan designed for dual-eligible members."}

let activeCategory = "assistant";

function countBadge(cat){
  if(cat.type === 'framework') return '3-Q';
  if(cat.type === 'followup') return '4-day';
  if(cat.objectionGroups) return cat.objectionGroups.reduce((sum,g)=>sum+g.items.length,0);
  return cat.objections.length;
}


function visiblePlaybookCategory(cat){
  const hiddenIds=["medicare","medicare-follow-up","term","whole","final"];
  const label=String(cat&&cat.label||"").toLowerCase();
  if(hiddenIds.includes(cat.id)) return false;
  if(label.includes("medicare call in")) return false;
  if(label.includes("medicare follow-up")) return false;
  return true;
}
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = `
    <button class="tab-btn ${activeCategory==='assistant'?'active':''}" data-id="assistant">☎ Medicare Call Assistant</button>
    <button class="tab-btn ${activeCategory==='life-assistant'?'active':''}" data-id="life-assistant">♥ Life Call Assistant</button>
    <button class="tab-btn ${activeCategory==='appointment-setter'?'active':''}" data-id="appointment-setter">📅 Appointment Setter</button>
  ` + DATA.filter(visiblePlaybookCategory).map(cat => `
    <button class="tab-btn ${cat.id===activeCategory?'active':''}" data-id="${cat.id}">
      ${cat.label} <span class="count">${countBadge(cat)}</span>
    </button>
  `).join('');
  tabs.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.id;
      renderTabs();
      renderMain();
    });
  });
}

function matchesSearch(obj){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return obj.q.toLowerCase().includes(t) || obj.a.toLowerCase().includes(t);
}

function renderResistanceNote(text){
  if(!text) return '';
  return `
    <div class="resistance-note">
      <span class="resistance-icon">↪</span>
      <div>
        <span class="resistance-label">If they resist</span>
        <p>${text}</p>
      </div>
    </div>
  `;
}

  return `

      ${items.map(t => `
        <div class="trust-phrases-row">
          <span class="situation">${t.situation}</span>

function renderQuickJump(cat, skip){
  const allItems = cat.objectionGroups.flatMap(g => g.items);
  if(allItems.length === 0) return '';
  return `
    <div class="quick-jump">
      <div class="quick-jump-label">Jump straight to an objection (${allItems.length})</div>
      <div class="quick-jump-list">
        ${allItems.map(o => `<button class="quick-jump-chip" data-target="obj-${slugify(o.q)}">${o.q}</button>`).join('')}
      </div>
      ${skip ? `<button class="jump-link" id="${skip.id}">${skip.label}</button>` : ''}
    </div>
  `;
}
