      doctors:[/doctor|provider|network|hmo|ppo|specialist/i],
      rx:[/prescri|drug|medication|pharmacy|formulary|part d/i],
      costs:[/cost|premium|copay|zero|\$0|expensive|afford/i],
      benefits:[/dental|vision|hearing|otc|allowance|transport|fitness|benefit/i],
      close:[/think|spouse|wife|husband|family|send|information|change today|not ready|later|not interested/i],
      followup:[/doctor|network|prescri|drug|benefit|change plan|switch|enroll|period|hmo/i]
    };
    let picks=[];
    if(stage==="opening"){
      picks=openingPriority.map(q=>objections.find(o=>(o.q||"").trim()===q)).filter(Boolean);
    }else{
      const pats=rules[stage]||[];
      picks=objections.filter(o=>pats.some(r=>r.test((o.q||"")+" "+(o.section||"")))).slice(0,5);
      if(!picks.length) picks=objections.slice(0,4);
    }
    if(!picks.length)return "";
    const id="ctx-"+stage+"-"+Math.random().toString(36).slice(2,7);
    return `<div class="context-objections">
      <div class="context-objection-head"><span>Likely Objections</span><small>Tap for a quick response</small></div>
      <div class="context-objection-chips">${picks.map((o,i)=>{
        const label=o.q.includes("Family Gatekeeper")?"Gatekeeper":o.q;
        return `<button type="button" onclick="showContextObjection('${id}',${objections.indexOf(o)},this)">${label}</button>`;
      }).join("")}</div>
      <div id="${id}" class="context-objection-answer" style="display:none"></div>
    </div>`;
  };

  const mbiCheckpoint=()=>{
    if(A.mbiStatus==="unavailable" && !A.mbiUnavailableAction){
      return `<div class="flow-card mbi-card"><h3 class="flow-title">Medicare Card / MBI — Not Available</h3>
        <div class="script-now"><div class="mini">Say this</div><p>No problem. If you don't have the card available right now, we can either look up the Medicare information using an approved lookup method available to us, or we can reschedule and continue when you have the card.</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn" onclick="window.MCA.mbiUnavailableAction='lookup';renderMain();"><strong>Look It Up</strong><span>Use the approved Medicare/carrier lookup process available to you</span></button>
          <button type="button" class="choice-btn" onclick="window.MCA.mbiUnavailableAction='reschedule';renderMain();"><strong>Reschedule / Follow Up</strong><span>Continue when they have their Medicare card</span></button>
          <button type="button" class="choice-btn" onclick="window.MCA.mbiStatus='';window.MCA.mbiUnavailableAction='';renderMain();"><strong>← Back</strong><span>Choose a different MBI response</span></button>
        </div>
      </div>`;
    }
    if(A.mbiStatus==="unavailable" && A.mbiUnavailableAction==="reschedule"){
      return `<div class="flow-card"><h3 class="flow-title">Reschedule / Follow Up</h3>
        <div class="script-now"><div class="mini">Say this</div><p>That's fine. Let's reconnect when you have your Medicare card available so we can continue from here.</p></div>
        <div class="mini-note">Schedule the follow-up in your normal calendar or CRM.</div>
        <div class="narrow-actions"><button type="button" class="mini-choice" onclick="window.MCA.mbiUnavailableAction='';renderMain();">← Back</button></div>
      </div>`;
    }
    if(A.mbiStatus==="unavailable" && A.mbiUnavailableAction==="lookup"){
      return `<div class="flow-card"><h3 class="flow-title">Look Up Medicare Information</h3>
        <div class="script-now"><div class="mini">Say this</div><p>No problem. I can check whether I'm able to locate the Medicare information through the approved lookup process available to me.</p></div>
        <div class="mini-note">Use your approved Medicare, carrier, enrollment, or agency lookup workflow. Keep the actual MBI in the authorized system.</div>
        <div class="narrow-actions"><button type="button" class="action-btn" onclick="window.MCA.mbiStatus='have';window.MCA.mbiUnavailableAction='';renderMain();">MBI Located — Continue →</button><button type="button" class="mini-choice" onclick="window.MCA.mbiStatus='have';window.MCA.mbiUnavailableAction='';window.MCA.enrollmentTiming='manual-skip';renderMain();">MBI Located — Skip Enrollment Timing →</button><button type="button" class="mini-choice" onclick="window.MCA.mbiUnavailableAction='reschedule';renderMain();">Couldn't Locate It — Reschedule</button></div>
      </div>`;
    }
    return A.mbiStatus ? `
      <div class="flow-card completed-checkpoint">
        <div class="completed-row"><strong>✓ Medicare Card / MBI Checked${A.enrollmentTiming==="manual-skip"?" — Enrollment Timing Skipped":""}</strong><div class="completed-actions">${A.enrollmentTiming!=="manual-skip"?`<button type="button" class="mini-choice" onclick="window.MCA.enrollmentTiming='manual-skip';renderMain();">Skip Enrollment Timing →</button>`:""}<button type="button" class="mini-choice" onclick="window.MCA.mbiStatus='';window.MCA.mbiUnavailableAction='';window.MCA.enrollmentTiming='';renderMain();">View / Change</button></div></div>
      </div>` : `
      <div class="flow-card mbi-card"><h3 class="flow-title">Medicare Card / MBI Check</h3>
        <div class="script-now"><div class="mini">Ask this</div><p>Before we start looking at your Medicare options, do you have your red, white, and blue Medicare card available? I’ll need the Medicare number, also called your MBI, from that card.</p></div>
        <div class="choice-grid">${[["have","✓ I Have It"],["find","They Need to Find Their Card"],["unavailable","Card Isn't Available Right Now"],["notreceived","They Haven't Received It Yet"]].map(([k,l])=>`<button type="button" class="choice-btn" onclick="setMbiStatus('${k}')"><strong>${l}</strong></button>`).join("")}</div>
        <div class="narrow-actions" style="margin-top:12px"><button type="button" class="mini-choice" onclick="window.MCA.mbiStatus='have';window.MCA.enrollmentTiming='manual-skip';renderMain();"><strong>✓ I Have It — Skip Enrollment Timing →</strong></button></div>
      </div>`;
  };
  const educationScript=(title,text)=>`
    <div class="flow-card education-script-card">
      <h3 class="flow-title">${title}</h3>
      <div class="script-now education-say-this">
        <div class="mini">Say this</div>
        <div class="education-script-text">${text||""}</div>
      </div>
    </div>`;
  const educationCheck=(prompt,buttons)=>`<div class="education-checkin"><div class="mini">Check in</div><p>${prompt}</p><div class="context-objection-chips">${buttons}</div></div>`;
  const educationWalkthrough=()=>{
    const e=A.eduStep||0;
    const partsCDFormatted=String(m.partsCD||"").replace(/Part C/g,"<strong>Part C</strong>").replace(/Part D/g,"<strong>Part D</strong>");
    if(e===0)return `<div class="script-now"><div class="mini">Transition</div><p>Before we get into the different plan options, let me give you a quick overview of how Medicare works so everything else makes sense.</p></div>
      ${educationScript("Original Medicare — Parts A & B",(m.partsAB&&m.partsAB.explain)+"<br><br>"+(m.notCoveredScript||""))}
      ${educationCheck("Does that make sense so far, or is there anything about Original Medicare you'd like me to go back over?",`<button type="button" onclick="setEducationStep(2)">Makes Sense — Continue</button><button type="button" onclick="showEducationClarify('a')">Clarify Part A</button><button type="button" onclick="showEducationClarify('b')">Clarify Part B</button><button type="button" onclick="showEducationClarify('question')">I Have a Question</button>`)}<div id="edu-clarify" class="context-objection-answer" style="display:none"></div>`;
    if(e===1){A.eduStep=2;return educationWalkthrough();}
    if(e===2)return `${educationScript("Parts C & D",partsCDFormatted)}
      ${educationCheck("How are we doing so far? Does the difference between the different parts make sense, or is there anything you want me to explain?",`<button type="button" onclick="setEducationStep(3)">Makes Sense — Continue</button><button type="button" onclick="showEducationClarify('c')">Explain Part C Again</button><button type="button" onclick="showEducationClarify('d')">Explain Part D Again</button><button type="button" onclick="showEducationClarify('penalty')">How Much Is the Part D Penalty?</button><button type="button" onclick="showEducationClarify('creditable')">What Counts as Creditable Coverage?</button><button type="button" onclick="showEducationClarify('question')">I Have a Question</button>`)}<div id="edu-clarify" class="context-objection-answer" style="display:none"></div>`;
    if(e===3){
      if(!A.eduFamiliar)return `<div class="script-now"><div class="mini">Ask this</div><p>Before I explain the two main ways people usually set up their coverage, have you heard of Medicare Advantage or Medicare Supplement plans before?</p></div><div class="choice-grid">${[["both","Yes — Both"],["ma","Medicare Advantage"],["supp","Medicare Supplement"],["no","No / Not Really"]].map(([k,l])=>`<button type="button" class="choice-btn" onclick="setEducationFamiliar('${k}')"><strong>${l}</strong></button>`).join("")}</div>`;
      const q=A.eduFamiliar==="both"?"Would you like me to quickly go over both options, or are you comfortable with how they work?":A.eduFamiliar==="ma"?"Would you like me to quickly go over Medicare Advantage, or are you comfortable with how it works?":"Would you like me to quickly go over Medicare Supplement, or are you comfortable with how it works?";
      const explain=A.eduFamiliar==="both"?"Go Over Both":A.eduFamiliar==="ma"?"Explain Medicare Advantage":"Explain Medicare Supplement";
      return `<div class="script-now"><div class="mini">Ask this</div><p>${q}</p></div><div class="choice-grid"><button type="button" class="choice-btn" onclick="setEducationReview('${A.eduFamiliar}')"><strong>${explain}</strong></button><button type="button" class="choice-btn" onclick="setEducationReview('skip')"><strong>I’m Familiar — Continue</strong></button></div>`;
    }
    if(e===4){
      if(A.eduReview==="skip")return `<div class="script-now"><div class="mini">Transition</div><p>Great. Since you're comfortable with how those options work, let's use what you've told me to narrow down the coverage direction that fits your needs.</p></div><div class="narrow-actions"><button type="button" class="action-btn" onclick="setEducationStep(5)">Continue to Narrow It Down →</button></div>`;
      return `${educationScript("Coverage Options",m.planTypeBridge)}
        <div class="education-plan-script-label"><div class="mini">Say this — explain the options that apply</div></div>
        ${plans}${educationScript("Bring It Together",m.planTypeWrapup)}
        <div class="script-now"><div class="mini">Ask this</div><p>Between those approaches, is there one that sounds closer to what you had in mind, or would you like me to explain the differences a little more?</p></div><div class="choice-grid">${[["ma","Medicare Advantage"],["supp","Medicare Supplement"],["again","Explain the Difference Again"],["unsure","Not Sure Yet"]].map(([k,l])=>`<button type="button" class="choice-btn" onclick="setEducationDirection('${k}')"><strong>${l}</strong></button>`).join("")}</div>`;
    }
    return `<div class="script-now"><div class="mini">Transition</div><p>Great. Now let’s use what you’ve told me to narrow down the coverage direction that fits your needs.</p></div>`;
  };

  const eligibility=(context)=>{
    const now=new Date();
    const month=now.getMonth()+1, day=now.getDate();
    const inAEP=(month===10&&day>=15)||month===11||(month===12&&day<=7);
    const inMAOEP=(month>=1&&month<=3);
    if(inAEP && A.path==="current"){
      A.enrollmentTiming="aep-auto";
      return "";
    }
    if(inMAOEP && A.path==="current" && A.current==="mapd"){
      A.enrollmentTiming="maop-auto";
      return "";
    }
    // Auto-detected AEP/OEP timing and an intentional MBI-stage skip stay silent;
    // do not open an Enrollment Timing card.
    if(A.enrollmentTiming==="aep-auto" || A.enrollmentTiming==="maop-auto" || A.enrollmentTiming==="manual-skip") return "";
    if(A.enrollmentTiming){
      const labels={
        initial:"New to Medicare / Initial Enrollment",
        aep:"Annual Enrollment Period",
        maop:"Medicare Advantage Open Enrollment",
        loss:"Losing Employer / Other Coverage",
        move:"Moving / Change of Residence",
        plan:"Plan or Coverage Change",
        other:"Another Enrollment Opportunity",
        verify:"Not Sure — Verify Before Enrollment",
        "aep-auto":"Annual Enrollment Period",
        "maop-auto":"Medicare Advantage Open Enrollment"
      };
      return `<div class="flow-card completed-checkpoint"><div class="completed-row"><div><strong>✓ Enrollment Timing Considered</strong><div class="mini-note">${labels[A.enrollmentTiming]||"Verify applicable enrollment opportunity before enrollment."}</div></div><button type="button" class="mini-choice" onclick="window.MCA.enrollmentTiming='';renderMain();">View / Change</button></div></div>`;
    }

    // If the selected path already tells us the likely enrollment situation, keep this short.
    let intro="Just so I know what options may be available to you right now, which of these best describes your situation?";
    let opts=[
      ["initial","New to Medicare / Initial Enrollment"],
      ["aep","Annual Enrollment Period"],
      ["maop","Medicare Advantage Open Enrollment"],
      ["loss","Losing Employer / Other Coverage"],
      ["move","Moving / Change of Residence"],
      ["plan","Plan or Coverage Change"],
      ["other","Another Enrollment Opportunity"],
      ["verify","Not Sure — Verify Before Enrollment"]
    ];

    return `<div class="flow-card enrollment-timing-card">
      <h3 class="flow-title">Enrollment Timing</h3>
      <div class="script-now"><div class="mini">Ask / Confirm</div><p>${intro}</p></div>
      <div class="choice-grid">${opts.map(([k,l])=>`<button type="button" class="choice-btn" onclick="window.MCA.enrollmentTiming='${k}';renderMain();"><strong>${l}</strong></button>`).join("")}</div>
      <div class="mini-note">This identifies the likely enrollment situation. Verify the applicable election period before submitting an enrollment.</div>
    </div>`;
  };

  const narrowDown=()=>{
    const N=A.narrow||(A.narrow={});

    // Existing-client coverage direction is selected during Current Plan Review.
    // Carry it forward rather than asking the same question again in Narrow It Down.
    if(A.path==="current" && N.keepType===undefined && A.currentReviewDirection!==undefined){
      N.keepType=A.currentReviewDirection;
    }

    // Existing Medigap clients who want to stay with Medigap need a rights /
    // underwriting checkpoint before assuming they can simply switch policies.
    if(A.path==="current" && A.current==="supp" && (N.keepType==="same" || N.keepType==="both") && N.medigapSwitchStatus===undefined && !(A.currentReviewDirection==="same" || A.currentReviewDirection==="both")){
      return `<div class="flow-card narrow-card">
        <div class="narrow-head"><div><h3 class="flow-title">Medicare Supplement Switch Check</h3><p class="flow-sub">Do this before treating another Medigap policy as an available replacement.</p></div></div>
        <div class="script-now"><div class="mini">Say this</div><p>Absolutely. We can look at other Medicare Supplement options. I do want to let you know up front that changing from one Medicare Supplement policy to another may require medical underwriting. Before we shop plans, I'll check whether you have a guaranteed-issue or other protected right that would let you change without underwriting.</p></div>
        <div class="script-now"><div class="mini">Ask this</div><p>Do you know if you're currently in your Medigap Open Enrollment Period or have a guaranteed-issue or other protected right to change your Medicare Supplement?</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn" onclick="window.MCA.narrow.medigapSwitchStatus='protected';renderMain();"><strong>Check Guaranteed-Issue / Protected Right</strong><span>Verify the applicable Open Enrollment, guaranteed-issue, or state protection</span></button>
          <button type="button" class="choice-btn" onclick="window.MCA.narrow.medigapSwitchStatus='underwriting';renderMain();"><strong>Underwriting Likely Applies</strong><span>Screen the new carrier's medical underwriting requirements</span></button>
          <button type="button" class="choice-btn" onclick="window.MCA.narrow.medigapSwitchStatus='verify';renderMain();"><strong>Not Sure — Verify First</strong><span>Check federal/state rights and carrier requirements before proceeding</span></button>
        </div>
        <div class="mini-note">Do not cancel the existing Medicare Supplement while eligibility for the replacement is still being determined.</div>
      </div>`;
    }

    if(A.path==="current" && A.current==="supp" && N.medigapSwitchStatus==="verify" && !N.medigapSwitchVerified){
      return `<div class="flow-card narrow-card">
        <h3 class="flow-title">Verify Medigap Switching Rights</h3>
        <div class="script-now"><div class="mini">Say this</div><p>Before we go further with a replacement, let me verify whether you have a guaranteed-issue or other protected right to change your Medicare Supplement. If you don't, we'll need to check the new carrier's underwriting requirements.</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn" onclick="window.MCA.narrow.medigapSwitchStatus='protected';window.MCA.narrow.medigapSwitchVerified=true;renderMain();"><strong>Protected Right Verified</strong></button>
          <button type="button" class="choice-btn" onclick="window.MCA.narrow.medigapSwitchStatus='underwriting';window.MCA.narrow.medigapSwitchVerified=true;renderMain();"><strong>Underwriting Applies / Needs Screening</strong></button>
        </div>
      </div>`;
    }

    // SNP screening happens first. A positive answer flags a potential track for verification;
    // it never declares eligibility or promises plan-specific benefits.
    const snpQuestions=[
      {
        key:"medicaid",
        ask:"Besides Medicare, do you currently receive Medicaid or state medical assistance?",
        opts:[["yes","Yes"],["no","No"],["unsure","Not Sure"]]
      },
      {
        key:"medicaidType",
        show:()=>N.medicaid==="yes",
        ask:"Do you know if you have full Medicaid benefits, or does Medicaid mainly help you pay some of your Medicare costs?",
        opts:[["full","Full Medicaid"],["help","Helps With Medicare Costs"],["unsure","Not Sure"]]
      },
      {
        key:"extraHelp",
        ask:"Do you receive Extra Help with your Medicare prescription drug costs?",
        opts:[["yes","Yes"],["no","No"],["unsure","Not Sure"]]
      },
      {
        key:"institutional",
        ask:"Do you currently live in a nursing facility, skilled nursing facility, intermediate care facility, or another long-term care setting where you receive nursing-level care?",
        opts:[["yes","Yes"],["no","No"],["unsure","Not Sure"]]
      },
      {
        key:"institutional90",
        show:()=>N.institutional==="yes",
        ask:"Have you been there for at least 90 days, or are you expected to need that level of care for 90 days or longer?",
        opts:[["yes","Yes"],["no","No"],["unsure","Not Sure"]]
      },
      {
        key:"institutionalHome",
        show:()=>N.institutional==="no",
        ask:"Do you receive regular nursing care or help with your daily needs at home?",
        opts:[["yes","Yes"],["no","No"],["unsure","Not Sure"]]
      },
      {
        key:"chronic",
        ask:"Have you been diagnosed with a chronic condition such as diabetes, chronic heart failure, certain cardiovascular conditions, a qualifying chronic lung condition, or end-stage renal disease requiring dialysis?",
        opts:[["yes","Yes"],["no","No"],["unsure","Not Sure"]]
      },
      {
        key:"chronicType",
        show:()=>N.chronic==="yes",
        ask:"Which of these best describes the condition you have?",
        opts:[["diabetes","Diabetes"],["chf","Chronic Heart Failure"],["cardio","Cardiovascular Disorder"],["lung","Chronic Lung Disorder"],["esrd","ESRD Requiring Dialysis"],["other","Another Chronic Condition"],["unsure","Not Sure"]]
      }
    ];

    const standardQuestions=[
      {
        key:"rxSource",
        ask:"How are you getting your prescription coverage right now?",
        opts:[["mapd","Through my Medicare plan"],["pdp","Separate Part D plan"],["va","VA"],["tricare","TRICARE"],["champva","CHAMPVA"],["employer","Employer / Retiree coverage"],["other","Other"],["none","No prescription coverage"],["unsure","Not Sure"]]
      },
      {
        key:"rxFuture",
        show:()=>N.rxSource!==undefined && N.rxSource!=="none",
        ask:"Are you looking to keep that prescription coverage, or would you like us to include prescription coverage when we look at your Medicare plan options?",
        opts:[["keep","Keep current drug coverage"],["include","Include drug coverage"],["compare","Compare both"],["unsure","Not Sure"]]
      },
      {
        key:"providerFlex",
        ask:"How important is it to you to be able to see doctors or specialists who accept Medicare without having to stay within a plan's network?",
        opts:[["very","Very Important"],["some","Somewhat Important"],["not","Not Important"],["unsure","Not Sure"]]
      },
      {
        key:"costStyle",
        ask:"When it comes to your healthcare costs, would you rather pay less each month and then pay copays as you use your healthcare, or would you rather pay more each month to help keep your costs lower when you actually need care?",
        opts:[["premium","Lower Monthly Premium — Pay copays as I use healthcare"],["predictable","Higher Monthly Premium — Help keep costs lower when I use healthcare"],["unsure","Not Sure"]]
      },
      {
        key:"extras",
        ask:"Depending on the plan, there may be additional benefits available beyond your medical and prescription coverage. If any are available, are there certain benefits you’d like me to pay attention to when we compare your options?",
        opts:[["very","Very Important"],["nice","Nice to Have"],["not","Not Important"]]
      },
      {
        key:"bundle",
        show:()=> {
          if(N.rxSource===undefined) return false;
          const existingOther=["va","tricare","champva","employer","pdp","other"];
          if(existingOther.includes(N.rxSource) && N.rxFuture!=="include" && N.rxFuture!=="compare") return false;
          return N.rxFuture==="include" || N.rxFuture==="compare" || N.rxSource==="none" || N.rxSource==="unsure" || N.rxSource==="mapd";
        },
        ask:"If you need prescription coverage, would you prefer having it included with your medical plan, or are you comfortable having a separate prescription plan?",
        opts:[["together","Included With Medical"],["separate","Separate Is Fine"],["either","No Preference"],["unsure","Not Sure"]]
      }
    ];

    const visibleSnp=snpQuestions.filter(q=>!q.show||q.show());
    const snpIdx=visibleSnp.findIndex(q=>N[q.key]===undefined);
    const snpComplete=snpIdx<0;

    const potentialDSNP=N.medicaid==="yes";
    const potentialISNP=(N.institutional==="yes" && N.institutional90!=="no") || N.institutionalHome==="yes";
    const potentialCSNP=N.chronic==="yes";
    const snpFlag=potentialDSNP||potentialISNP||potentialCSNP;

    // Existing clients who want to keep the same plan type do not need the
    // standard coverage-direction questions. Once SNP + Extra Help screening
    // is complete, keep their current coverage structure and move forward.
    if(A.path==="current" && N.keepType==="same" && snpComplete && !snpFlag){
      const sameTypeLabel=({mapd:"Medicare Advantage / MAPD",supp:"Medicare Supplement + Part D",original:"Original Medicare",employer:"Employer / Retiree + Medicare",unsure:"Current coverage type"})[A.current]||"Current coverage type";
      return `<div class="flow-card narrow-card">
        <div class="narrow-head"><div><h3 class="flow-title">Narrow It Down</h3><p class="flow-sub">Same plan type selected — SNP and Extra Help screening is complete.</p></div><div class="question-count">Complete</div></div>
        <div class="direction-result">
          <div class="mini">Coverage direction</div>
          <strong>Stay with ${sameTypeLabel}</strong>
          <p>• Medicaid / D-SNP screen: ${N.medicaid==="yes"?"Potential D-SNP — verify eligibility":N.medicaid==="no"?"No Medicaid reported":"Not sure — verify if needed"}</p>
          <p>• Extra Help: ${N.extraHelp==="yes"?"Yes":N.extraHelp==="no"?"No":"Not sure"}</p>
          <p>• Institutional SNP screen: ${potentialISNP?"Potential I-SNP — verify eligibility":"No potential I-SNP identified from screening"}</p>
          <p>• Chronic Condition SNP screen: ${potentialCSNP?"Potential C-SNP — verify eligibility":"No potential C-SNP identified from screening"}</p>
        </div>
        <div class="narrow-actions">
          <button type="button" class="mini-choice" onclick="restartNarrow()">↺ Ask Again</button>
          <button type="button" class="action-btn" onclick="continueAfterNarrow()">Continue With Same Plan Type →</button>
        </div>
      </div>`;
    }

    // If any SNP screen is positive, stop at an SNP evaluation checkpoint first.
    // If none is positive, standard narrowing appears automatically.
    if(snpComplete && snpFlag && !N.snpReviewed){
      const tracks=[];
      if(potentialDSNP) tracks.push(["D-SNP","Medicaid or state medical assistance was reported. Verify the client’s current Medicaid eligibility, service area, and whether they qualify for an available D-SNP before discussing a specific D-SNP."]);
      if(potentialISNP) tracks.push(["I-SNP","Institutional or institutional-equivalent care was reported. Verify the qualifying setting or level-of-care determination and the 90-day requirement/expectation with the plan."]);
      if(potentialCSNP) tracks.push(["C-SNP","A chronic condition was reported. Verify that the diagnosis qualifies for the specific C-SNP and complete the plan's required condition verification."]);
      return `<div class="flow-card narrow-card">
        <div class="narrow-head"><div><h3 class="flow-title">Narrow It Down</h3><p class="flow-sub">A possible Special Needs Plan path was identified. Verify it before moving into the standard plan evaluation.</p></div><div class="question-count">Screen Complete</div></div>
        <div class="direction-result">
          <div class="mini">Potential SNP track${tracks.length>1?"s":""} — verify eligibility & plan availability</div>
          ${tracks.map(t=>`<strong>Potential ${t[0]}</strong><p>• ${t[1]}</p>`).join("")}
          ${N.extraHelp==="yes"?`<p>• Extra Help was reported. This can affect prescription costs, but Extra Help by itself does not establish D-SNP eligibility.</p>`:""}
          <p class="direction-warning">Do not promise $0 premiums, OTC, utility, transportation, care-coordination, formulary, or other supplemental benefits. Benefits and eligibility vary by the specific plan and service area.</p>
        </div>
        <div class="narrow-actions">
          <button type="button" class="mini-choice" onclick="restartNarrow()">↺ Recheck SNP Screen</button>
          <button type="button" class="action-btn" onclick="window.MCA.narrow.snpReviewed=true;renderMain();">Continue to Plan Evaluation →</button>
        </div>
      </div>`;
    }

    if(A.path==="current" && N.keepType==="same" && snpComplete && snpFlag && N.snpReviewed){
      const sameTypeLabel=({mapd:"Medicare Advantage / MAPD",supp:"Medicare Supplement + Part D",original:"Original Medicare",employer:"Employer / Retiree + Medicare",unsure:"Current coverage type"})[A.current]||"Current coverage type";
      const tracks=[];
      if(potentialDSNP) tracks.push("Potential D-SNP — verify eligibility and plan availability");
      if(potentialISNP) tracks.push("Potential I-SNP — verify eligibility and plan availability");
      if(potentialCSNP) tracks.push("Potential C-SNP — verify eligibility and plan availability");
      return `<div class="flow-card narrow-card">
        <div class="narrow-head"><div><h3 class="flow-title">Narrow It Down</h3><p class="flow-sub">Same plan type selected — no additional coverage-direction questions are needed.</p></div><div class="question-count">Complete</div></div>
        <div class="direction-result">
          <div class="mini">Coverage direction</div>
          <strong>Stay with ${sameTypeLabel}</strong>
          ${tracks.map(x=>`<p>• ${x}</p>`).join("")}
          <p>• Extra Help: ${N.extraHelp==="yes"?"Yes":N.extraHelp==="no"?"No":"Not sure"}</p>
          <p class="direction-warning">Verify any identified SNP eligibility and specific plan availability before proceeding.</p>
        </div>
        <div class="narrow-actions">
          <button type="button" class="mini-choice" onclick="restartNarrow()">↺ Ask Again</button>
          <button type="button" class="action-btn" onclick="continueAfterNarrow()">Continue With Same Plan Type →</button>
        </div>
      </div>`;
    }

    const questions = snpComplete ? standardQuestions : visibleSnp;
    const visible=questions.filter(q=>!q.show||q.show());
    let idx=visible.findIndex(q=>N[q.key]===undefined);
    if(idx<0) idx=visible.length;
    const complete=snpComplete && idx>=visible.length;
    const q=(idx>=visible.length)?null:visible[idx];

    let ma=0,mapd=0,supp=0;
    const why=[];
    if(N.providerFlex==="very"){supp+=3;why.push("Broad provider flexibility is very important.");}
    if(N.providerFlex==="not"){ma+=1;mapd+=1;}
    if(N.costStyle==="premium"){ma+=2;mapd+=2;why.push("Lower monthly premium is a priority.");}
    if(N.costStyle==="predictable"){supp+=3;why.push("Lower costs when healthcare is used are a priority.");}
    if(N.extras==="very"){ma+=2;mapd+=2;why.push("They would like additional benefits considered if available.");}
    if(N.bundle==="together"){mapd+=3;why.push("An all-in-one medical and prescription approach is preferred.");}
    if(N.bundle==="separate"){supp+=2;ma+=1;}
    if(N.rxFuture==="include"){mapd+=4;why.push("They want prescription coverage included when comparing Medicare plan options.");}
    if(N.rxFuture==="keep"){ma+=2;why.push("They indicated they want to keep their current prescription coverage.");}
    if(N.rxFuture==="compare"){mapd+=2;ma+=1;supp+=1;}

    const dirs=[];
    if(potentialDSNP) dirs.push("Potential D-SNP — Verify Eligibility & Plan Availability");
    if(potentialISNP) dirs.push("Potential I-SNP — Verify Eligibility & Plan Availability");
    if(potentialCSNP) dirs.push("Potential C-SNP — Verify Eligibility & Plan Availability");

    if(complete){
      const max=Math.max(ma,mapd,supp);
      if(!snpFlag){
        // No SNP screen matched: continue directly to ordinary plan evaluation.
        if(mapd===max && max>0) dirs.push("Standard MAPD");
        if(ma===max && max>0) dirs.push("Standard MA");
        if(supp===max && max>0) dirs.push("Medicare Supplement + PDP");
        if(!dirs.length) dirs.push("Standard MAPD / MA / Medicare Supplement Evaluation");
      } else {
        if(mapd===max && max>0) dirs.push("Also compare MAPD if appropriate");
        if(ma===max && max>0) dirs.push("Also compare MA if appropriate");
        if(supp===max && max>0) dirs.push("Also compare Medicare Supplement + PDP if appropriate");
      }
    }

    const coverageFlag=["va","tricare","champva","employer"].includes(N.rxSource)
      ? `<div class="coverage-flag"><strong>Existing coverage identified: ${N.rxSource==="va"?"VA":N.rxSource==="tricare"?"TRICARE":N.rxSource==="champva"?"CHAMPVA":"Employer / Retiree coverage"}</strong><span>Review how this existing coverage coordinates with Medicare before finalizing a plan direction.</span></div>`:"";

    const answered=visible.filter(x=>N[x.key]!==undefined).length;
    const pct=Math.round((answered/Math.max(visible.length,1))*100);

    return `<div class="flow-card narrow-card">
      <div class="narrow-head">
        <div><h3 class="flow-title">Narrow It Down</h3><p class="flow-sub">${snpComplete?"The SNP screen is complete. Continue with the normal coverage questions.":"First check whether a Special Needs Plan may need to be evaluated. If not, the assistant will move directly into the standard plan questions."}</p></div>
        <div class="question-count">${complete?"Complete":`Question ${idx+1} of ${visible.length}`}</div>
      </div>
      ${contextualObjections("narrow")}
      <div class="question-progress"><i style="width:${pct}%"></i></div>
      ${!complete?`
        <div class="guided-question">
          <div class="mini">Ask this</div><p>${q.ask}</p>
          <div class="guided-options">${q.opts.map(([v,l])=>`<button type="button" onclick="answerNarrow('${q.key}','${v}')">${l}</button>`).join("")}</div>
        </div>
      `:`<div class="direction-result">
          <div class="mini">Coverage direction${dirs.length>1?"s":""} to investigate</div>
          ${dirs.map(d=>`<strong>${d}</strong>`).join("")}
          ${N.extraHelp==="yes"?`<p>• Extra Help was reported. Keep it separate from Medicaid status and account for it when reviewing prescription costs.</p>`:""}
          ${why.slice(0,5).map(x=>`<p>• ${x}</p>`).join("")}
          <p class="direction-warning">This is a screening and conversation aid, not a final eligibility or plan determination. Verify SNP eligibility, enrollment opportunity, service area, existing coverage coordination, and the specific plan's benefits before proceeding.</p>
        </div>
        ${coverageFlag}
        <div class="narrow-actions">
          <button type="button" class="mini-choice" onclick="restartNarrow()">↺ Ask Again</button>
          <button type="button" class="action-btn" onclick="continueAfterNarrow()">Finish Narrow It Down →</button>
        </div>`}
      ${!complete && answered>0?`<div class="narrow-back"><button type="button" class="mini-choice" onclick="backNarrow()">← Previous Question</button></div>`:""}
    </div>`;
  };


  const planSummary=()=>{
    const N=A.narrow||{};
    if(!A.narrowContinue && !(A.path==="current" && A.currentReviewDone)) return "";
    const rxMap={mapd:"Through Medicare plan",pdp:"Separate Part D plan",va:"VA",tricare:"TRICARE",champva:"CHAMPVA",employer:"Employer / Retiree coverage",other:"Other coverage",none:"No current drug coverage",unsure:"Not sure"};
    const flexMap={very:"Very important",some:"Somewhat important",not:"Not important",unsure:"Not sure"};
    const costMap={premium:"Lower monthly premium; comfortable with copays when using care",predictable:"Higher monthly premium to help keep costs lower when care is used",unsure:"Not sure"};
    const extrasMap={very:"Very important — consider available supplemental benefits",nice:"Nice to have if available",not:"Not important"};
    const bundleMap={together:"Prefers prescription coverage included with medical coverage",separate:"Comfortable with separate prescription coverage",either:"No preference",unsure:"Not sure"};
    const yn={yes:"Yes",no:"No",unsure:"Not sure"};
    const dirs=[];
    if(N.medicaid==="yes") dirs.push("Potential D-SNP — verify eligibility");
    if((N.institutional==="yes" && N.institutional90!=="no") || N.institutionalHome==="yes") dirs.push("Potential I-SNP — verify eligibility");
    if(N.chronic==="yes") dirs.push("Potential C-SNP — verify eligibility");
    if(!dirs.length && A.path==="current" && N.keepType==="same"){
      dirs.push(({mapd:"Stay with Medicare Advantage / MAPD",supp:"Stay with Medicare Supplement + Part D",original:"Stay with Original Medicare",employer:"Stay with Employer / Retiree + Medicare",unsure:"Stay with current coverage type"})[A.current]||"Stay with current coverage type");
    }
    if(!dirs.length){
      let ma=0,mapd=0,supp=0;
      if(N.providerFlex==="very") supp+=3;
      if(N.providerFlex==="not"){ma++;mapd++;}
      if(N.costStyle==="premium"){ma+=2;mapd+=2;}
      if(N.costStyle==="predictable") supp+=3;
      if(N.extras==="very"){ma+=2;mapd+=2;}
      if(N.bundle==="together") mapd+=3;
      if(N.bundle==="separate"){supp+=2;ma++;}
      if(N.rxFuture==="include") mapd+=4;
      if(N.rxFuture==="keep") ma+=2;
      if(N.rxFuture==="compare"){mapd+=2;ma++;supp++;}
      const max=Math.max(ma,mapd,supp);
      if(max>0){
        if(mapd===max) dirs.push("MAPD");
        if(ma===max) dirs.push("MA");
        if(supp===max) dirs.push("Medicare Supplement + PDP");
      } else dirs.push("Compare standard Medicare coverage options");
    }
    const reasonMap={cost:"Cost / Premium",doctor:"Doctor / Network",rx:"Prescriptions",benefits:"Benefits",changed:"Plan Changed",moving:"Moving",compare:"Just Comparing",other:"Something Else"};
    const rows=[];
    if(A.path==="current"){
      rows.push(["Current coverage",({mapd:"Medicare Advantage / MAPD",supp:"Medicare Supplement + Part D",original:"Original Medicare Only",employer:"Employer / Retiree + Medicare",unsure:"Not Sure"})[A.current]||"Not answered"]);
      if(A.currentReviewDirection!==undefined) rows.push(["Coverage direction",({same:"Stay with same plan type",different:"Compare a different plan type",both:"Compare current type and alternatives",unsure:"Not sure yet"})[A.currentReviewDirection]||"Not answered"]);
      if(A.current==="supp" && A.medSupReviewUW!==undefined) rows.push(["Medigap underwriting / rights check",({protected:"Protected right indicated — verify",underwriting:"Underwriting likely applies — screen carrier",verify:"Verify protected rights / underwriting"})[A.medSupReviewUW]||"Verify"]);
      if(A.enrollmentTiming==="manual-skip") rows.push(["Enrollment timing","Skipped intentionally at MBI checkpoint"]);
      if(N.keepType!==undefined) rows.push(["Coverage preference",({same:"Stay with same plan type",different:"Compare a different plan type",both:"Compare current type and alternatives",unsure:"Not sure yet"})[N.keepType]||"Not answered"]);
      if(A.current==="supp" && N.medigapSwitchStatus!==undefined) rows.push(["Medigap switch check",({protected:"Protected right indicated — verify documentation/rules",underwriting:"Medical underwriting may apply — screen carrier requirements",verify:"Verify guaranteed-issue/state rights before replacement"})[N.medigapSwitchStatus]||"Verify"]);
      rows.push(["Reason for review",reasonMap[A.reason]||"Not answered"]);
      if(A.answers && A.answers["Current Plan"]) rows.push(["Current plan",A.answers["Current Plan"]]);
      if(A.answers && A.answers["Main Concern"]) rows.push(["Main concern",A.answers["Main Concern"]]);
    }
    rows.push(
      ["Potential direction",dirs.join(" / ")],
      ["Medicaid",N.medicaid==="yes"?"Yes — verify current eligibility":(yn[N.medicaid]||"Not answered")],
      ["Extra Help",yn[N.extraHelp]||"Not answered"],
      ["Current Rx coverage",rxMap[N.rxSource]||"Not answered"],
      ["Doctor flexibility",flexMap[N.providerFlex]||"Not answered"],
      ["Cost preference",costMap[N.costStyle]||"Not answered"]
    );
    if(N.extras!==undefined && N.extras!=="skip" && N.extras!=="ask") rows.push(["Additional benefits",extrasMap[N.extras]||"Not important"]);

    if(N.bundle!==undefined) rows.push(["Coverage setup",bundleMap[N.bundle]||"Not sure"]);
    return `<div class="plan-summary-card"><div class="sticky-notes-head"><div><div class="eyebrow">Plan Shopping Guide</div><h3>What They Told Me</h3></div><span>Auto summary</span></div>
      <div class="summary-list">${rows.map(([k,v])=>`<div class="summary-row"><span>${k}</span><strong>${v}</strong></div>`).join("")}</div>
      <div class="sticky-note-hint">Use this while entering the client into your quoter and comparing plans. Verify eligibility and plan details before making a recommendation.</div>
    </div>`;
  };

  const discovery=()=>{
    return `${A.narrowContinue?`<div class="flow-card completed-checkpoint"><div class="completed-row"><strong>✓ Narrow It Down Completed</strong><button type="button" class="mini-choice" onclick="window.MCA.narrowContinue=false;renderMain();">View / Edit</button></div></div>`:narrowDown()}
    ${A.narrowContinue?`
    <div class="flow-card">
      <h3 class="flow-title">Doctors</h3>
      ${contextualObjections("doctors")}
      <div class="script-now"><div class="mini">Transition</div><p>Let's make sure we're looking at plans that work with the doctors you actually use.</p></div>
      ${step("Doctor Review",(m.healthInfoScript||[]).find(x=>x.tag==="Doctors")?.text || "Which doctors and specialists do you want to make sure we account for?")}
    </div>
    <div class="flow-card">
      <h3 class="flow-title">Prescriptions</h3>
      ${contextualObjections("rx")}
      <div class="script-now"><div class="mini">Transition</div><p>Now let's look at your prescriptions so we can account for drug coverage and costs.</p></div>
      ${step("Prescriptions",(m.healthInfoScript||[]).find(x=>x.tag==="Medications")?.text || "What prescriptions are you currently taking? For each one, I'll want the drug name, the dosage, the quantity prescribed, and how often you get it filled — every 30 or 90 days?")}
    </div>
    <div class="compare-box">
      <button type="button" class="action-btn" onclick="setReadyToCompare()">✓ Ready to Compare Plans</button>
      <span>Use this once eligibility, plan direction, doctors, prescriptions, costs, and priorities are clear.</span>
    </div>
    ${A.compare?planReviewSection():""}`:""}`;
  };


  function planReviewSection(){
    const R=A.planReview||{};
    const reactionLabels={
      standout:"Yes — One Stands Out",
      two:"Compare Two Options",
      questions:"I Have Questions",
      stay:"Keep Current Coverage",
      notready:"Not Ready to Decide"
    };
    return `<div class="flow-card plan-review-card">
      <h3 class="flow-title">Review Plan Options</h3>
      <p class="flow-sub">Use the plans in your quoter. You do not need to re-enter plan details here.</p>
      <div class="script-now"><div class="mini">Say this</div><p>Based on what you told me was most important, these are the options I think are worth looking at. Let's go through the differences so you can see how each one would work for you.</p></div>

      <div class="review-checklist">
        <div class="summary-row"><span>1. Coverage & premium</span><strong>Review the plan type and monthly premium shown in the quoter.</strong></div>
        <div class="summary-row"><span>2. Doctors & network</span><strong>Confirm the doctors, specialists, facilities, and network considerations that mattered to the client.</strong></div>
        <div class="summary-row"><span>3. Prescriptions & pharmacy</span><strong>Review drug coverage and pharmacy costs when prescription coverage applies.</strong></div>
        <div class="summary-row"><span>4. Healthcare costs</span><strong>Compare the important copays, coinsurance, deductibles, and applicable out-of-pocket limits shown for the options.</strong></div>
        ${A.narrow && A.narrow.extras!==undefined && !["skip","not","ask"].includes(A.narrow.extras)?`<div class="summary-row"><span>5. Additional benefits</span><strong>Review the additional benefits the client said mattered to them, if available on the plans being considered.</strong></div>`:""}
      </div>

      <div class="script-now"><div class="mini">Ask this</div><p>Of the options we went over, is there one that feels like the best fit for what you're looking for?</p></div>
      <div class="choice-grid">
        ${Object.entries(reactionLabels).map(([k,l])=>`<button type="button" class="choice-btn ${R.reaction===k?'selected':''}" onclick="setPlanReviewReaction('${k}')"><strong>${l}</strong></button>`).join("")}
      </div>
      ${R.reaction?planReviewReaction(R.reaction):""}
    </div>`;
  }

  function planReviewReaction(k){
    const R=A.planReview||{};
    const blocks={
      standout:`<div class="script-now"><div class="mini">Say this</div><p>Great. Before we move forward, let's make sure you're comfortable with the plan's costs, provider access, prescription coverage if applicable, and the benefits we've reviewed.</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn" onclick="setMedicareOutcome('enrolled')"><strong>Ready to Enroll / Apply</strong></button>
          <button type="button" class="choice-btn" onclick="setPlanReviewReaction('questions')"><strong>I Have More Questions</strong></button>
        </div>
        ${A.outcome==="enrolled"?`<div class="script-now"><div class="mini">Next step</div><p>Continue the enrollment or application in your approved enrollment system and confirm the required next steps with the client.</p></div>`:""}`,
      two:`<div class="script-now"><div class="mini">Say this</div><p>Absolutely. Let's put those two side by side and focus on the differences that matter most to you.</p></div>
        <div class="review-checklist">
          <div class="summary-row"><span>Compare</span><strong>Monthly premium and expected healthcare costs</strong></div>
          <div class="summary-row"><span>Compare</span><strong>Doctors, specialists, hospitals, and network</strong></div>
          <div class="summary-row"><span>Compare</span><strong>Prescriptions and pharmacy costs when applicable</strong></div>
          <div class="summary-row"><span>Compare</span><strong>Any other benefit the client identified as important</strong></div>
        </div>
        <button type="button" class="action-btn" onclick="setPlanReviewReaction('reset')">Done Comparing — Ask Again →</button>`,
      questions:`<div class="script-now"><div class="mini">Ask this</div><p>Absolutely. What would you like to go over again or compare more closely?</p></div>
        ${contextualObjections("close")}
        <button type="button" class="action-btn" onclick="setPlanReviewReaction('reset')">Questions Answered — Ask Again →</button>`,
      stay:`<div class="script-now"><div class="mini">Say this</div><p>That's completely fine. If your current coverage is still the option you prefer after comparing the differences, we can leave it as it is.</p></div>
        <button type="button" class="mini-choice" onclick="setMedicareOutcome('stay')">Confirm Keep Current Coverage</button>`,
      notready:`<div class="script-now"><div class="mini">Say this</div><p>No problem. What would help you feel comfortable deciding — more time, another comparison, talking with someone, or additional information?</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn ${R.followupReason==="think"?'selected':''}" onclick="setMedicareFollowupReason('think')"><strong>Needs Time to Think</strong></button>
          <button type="button" class="choice-btn ${R.followupReason==="callback"?'selected':''}" onclick="setMedicareFollowupReason('callback')"><strong>Schedule Follow-Up</strong></button>
          <button type="button" class="choice-btn ${R.followupReason==="family"?'selected':''}" onclick="setMedicareFollowupReason('family')"><strong>Talk With Spouse / Family</strong></button>
          <button type="button" class="choice-btn ${R.followupReason==="info"?'selected':''}" onclick="setMedicareFollowupReason('info')"><strong>Needs More Information</strong></button>
        </div>
        ${medicareFollowupSection(R)}`

    };
    return blocks[k]||"";
  }

  function medicareFollowupSection(R){
    if(!R.followupReason) return "";
    if(R.followupReason==="info"){
      return `<div class="script-now"><div class="mini">Ask this</div><p>Absolutely. What information would you like me to go over again or look into for you?</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn" onclick="setPlanReviewReaction('questions')"><strong>Answer Questions Now</strong></button>
          <button type="button" class="choice-btn" onclick="setMedicareFollowupReason('callback')"><strong>Get Information & Schedule Follow-Up</strong></button>
        </div>`;
    }
    const scripts={
      think:"Absolutely, I understand. I want you to feel comfortable with whichever option you choose. Why don't I give you some time to think everything over, and I can follow up with you in a day or two to answer any questions that come up?",
      family:"Absolutely. I think it's a good idea to talk it over with them. I'll give you some time to go over everything together, and then I can follow up in a day or two so we can answer any questions you or your family may have.",
      callback:"Absolutely. Let's set up a quick follow-up so we can pick up where we left off."
    };
    return `<div class="script-now"><div class="mini">Say this</div><p>${scripts[R.followupReason]||scripts.callback}</p></div>
      <div class="script-now"><div class="mini">Ask this</div><p>Would tomorrow or the following day work better for me to give you a call back?</p></div>
      <div class="choice-grid">
        <button type="button" class="choice-btn ${R.callbackDay==="tomorrow"?'selected':''}" onclick="setMedicareCallbackDay('tomorrow')"><strong>Tomorrow</strong></button>
        <button type="button" class="choice-btn ${R.callbackDay==="two"?'selected':''}" onclick="setMedicareCallbackDay('two')"><strong>In 2 Days</strong></button>
      </div>
      ${R.callbackDay?`<div class="script-now"><div class="mini">Ask this</div><p>What time works best for you?</p></div>
        <div class="choice-grid">
          <button type="button" class="choice-btn ${R.callbackTime==="morning"?'selected':''}" onclick="setMedicareCallbackTime('morning')"><strong>Morning</strong></button>
          <button type="button" class="choice-btn ${R.callbackTime==="afternoon"?'selected':''}" onclick="setMedicareCallbackTime('afternoon')"><strong>Afternoon</strong></button>
          <button type="button" class="choice-btn ${R.callbackTime==="evening"?'selected':''}" onclick="setMedicareCallbackTime('evening')"><strong>Evening</strong></button>
          <button type="button" class="choice-btn ${R.callbackTime==="specific"?'selected':''}" onclick="setMedicareCallbackTime('specific')"><strong>Choose a Specific Time</strong></button>
        </div>
        ${R.callbackTime?`<div class="script-now"><div class="mini">Next step</div><p>${R.callbackTime==="specific"?"Agree on the exact callback time with the client and schedule it in your calendar or CRM.":"Confirm the callback window with the client and schedule it in your calendar or CRM."}</p></div>`:""}`:""}`;
  }

  function outcomeText(k){
    const map={
      enrolled:"Continue the application or enrollment in your approved system and confirm any required follow-up.",
      think:"Make sure they have what they need to review, then agree on a follow-up time if appropriate.",
      callback:"Agree on a specific time to reconnect and what you will review when you speak again.",
      family:"Make sure they have the information they want to review with their spouse or family and arrange the next conversation.",
      info:"Identify the outstanding question or information they need before making a decision.",
      stay:"Confirm that they want to keep their current coverage and close the conversation appropriately."
    }; return map[k]||"";
  }

  let body="";
  if(!A.path){
    body=`<div class="flow-card"><h3 class="flow-title">Where are they with Medicare?</h3>
      <p class="flow-sub">Choose the situation and the assistant will follow that conversation.</p>
      <div class="choice-grid">
        ${btn("new","New to Medicare","Turning 65, retiring, losing coverage, or starting Medicare","path")}
        ${btn("current","Already on Medicare","Review, compare, or change existing coverage","path")}
        ${btn("client","Existing Client Review","Review what changed since the last conversation","path")}
        ${btn("followup","Resume / Follow-Up","Continue a Medicare conversation already in progress","path")}
      </div></div>`;
  } else if(A.path==="new"){
    if(!A.newType){
      body=`<div class="flow-card"><h3 class="flow-title">New to Medicare</h3>
        <div class="choice-grid">
          ${btn("turn65","Turning 65","Approaching Medicare eligibility","newType")}
          ${btn("retiring","Retiring / Leaving Employer Coverage","Transitioning from employer or retiree coverage","newType")}
          ${btn("starting","Starting Medicare Now","Eligible and needs coverage set up","newType")}
          ${btn("unsure","Not Sure","Figure out timing and what they need","newType")}
        </div></div>`;
    } else if(A.newType==="turn65" && !A.turn65Need){
      body=`<div class="script-now"><div class="mini">Ask this</div><p>Got it. Are you mainly looking for help finding a Medicare plan, would you like me to walk you through how Medicare works first, or do you already know a little about Medicare and just have some questions?</p></div>
        <div class="flow-card"><h3 class="flow-title">Turning 65 — What do they need?</h3>
        <div class="choice-grid">
          <button type="button" class="choice-btn ${A.turn65Need==="plan"?"selected":""}" onclick="window.MCA.turn65Need='plan';window.MCA.compare=false;window.MCA.outcome='';window.MCA.elig={};window.MCA.narrow={};window.MCA.narrowContinue=false;window.MCA.priorities={};renderMain();"><strong>I Just Need a Plan</strong><span>Skip the Medicare lesson and focus on coverage options</span></button>
          <button type="button" class="choice-btn ${A.turn65Need==="education"?"selected":""}" onclick="window.MCA.turn65Need='education';window.MCA.compare=false;window.MCA.outcome='';window.MCA.elig={};window.MCA.narrow={};window.MCA.narrowContinue=false;window.MCA.priorities={};renderMain();"><strong>Walk Me Through Medicare</strong><span>Explain Medicare first, then move into coverage options</span></button>
          <button type="button" class="choice-btn ${A.turn65Need==="questions"?"selected":""}" onclick="window.MCA.turn65Need='questions';window.MCA.compare=false;window.MCA.outcome='';window.MCA.elig={};window.MCA.narrow={};window.MCA.narrowContinue=false;window.MCA.priorities={};renderMain();"><strong>I Know a Little — I Have Questions</strong><span>Give only the information they need</span></button>
          <button type="button" class="choice-btn ${A.turn65Need==="unsure"?"selected":""}" onclick="window.MCA.turn65Need='unsure';window.MCA.compare=false;window.MCA.outcome='';window.MCA.elig={};window.MCA.narrow={};window.MCA.narrowContinue=false;window.MCA.priorities={};renderMain();"><strong>Not Sure What I Need</strong><span>Ask a few questions and determine the next step</span></button>
        </div></div>`;

function medicareCallSummaryLines(){
  const A=window.MCA||{}, N=A.narrow||{}, R=A.planReview||{}, E=A.elig||{};
  const lines=[];
  const add=(label,value)=>{if(value!==undefined&&value!==null&&String(value).trim()!=="")lines.push(label+": "+value);};
  const pathMap={new:"New to Medicare",current:"Already on Medicare",client:"Existing Client Review",followup:"Resume / Follow-Up"};
  const newMap={turn65:"Turning 65",retiring:"Retiring / Leaving Employer Coverage",starting:"Starting Medicare Now",unsure:"Not Sure"};
  const needMap={plan:"Just Need a Plan",education:"Walk Me Through Medicare",questions:"Knows a Little / Has Questions",unsure:"Not Sure What They Need"};
  const currentMap={mapd:"Medicare Advantage / MAPD",supp:"Medicare Supplement + Part D",original:"Original Medicare Only",employer:"Employer / Retiree + Medicare",unsure:"Not Sure"};
  const reasonMap={cost:"Cost / Premium",doctor:"Doctor / Network",rx:"Prescriptions",benefits:"Benefits",change:"Plan Changed",moving:"Moving",compare:"Just Comparing",other:"Something Else"};
  const dirMap={same:"Stay With Same Type",different:"Compare Different Type",both:"Compare Both",unsure:"Not Sure"};
  const yn={yes:"Yes",no:"No",unsure:"Not Sure"};
  const costMap={premium:"Lower monthly premium; comfortable with copays when using care",predictable:"Higher monthly premium to help keep costs lower when care is used",unsure:"Not sure"};
  const extrasMap={very:"Very important",nice:"Nice to have",not:"Not important"};
  const flexMap={very:"Very important",some:"Somewhat important",not:"Not important",unsure:"Not sure"};
  const reactionMap={standout:"One option stands out",compare:"Comparing two options",questions:"Has questions",stay:"Keeping current coverage",notready:"Not ready to decide"};
  const followMap={think:"Needs time to think",callback:"Scheduled follow-up",family:"Talk with spouse / family",info:"Needs more information"};
  const dayMap={tomorrow:"Tomorrow",two:"In 2 days"};
  const timeMap={morning:"Morning",afternoon:"Afternoon",evening:"Evening",specific:"Specific time agreed with client"};
  add("Medicare status",pathMap[A.path]);
  if(A.path==="new"){add("Situation",newMap[A.newType]);add("What they need",needMap[A.turn65Need]);}
  if(A.path==="current"){
    add("Current coverage type",currentMap[A.current]);
    add("Reason for review",reasonMap[A.reason]);
    add("Coverage direction",dirMap[A.currentReviewDirection]||dirMap[N.keepType]);
  }
  if(A.path==="followup"&&A.followAction) add("Follow-up topic",A.followAction);
  if(A.enrollmentTiming) add("Enrollment timing",A.enrollmentTiming==="manual-skip"?"Skipped — handled in approved system":A.enrollmentTiming);
  if(N.medicaid!==undefined) add("Medicaid",yn[N.medicaid]||N.medicaid);
  if(N.extraHelp!==undefined) add("Extra Help",yn[N.extraHelp]||N.extraHelp);
  if(N.providerFlex!==undefined) add("Doctor / network priority",flexMap[N.providerFlex]||N.providerFlex);
  if(N.costStyle!==undefined) add("Cost preference",costMap[N.costStyle]||N.costStyle);
  if(N.extras!==undefined&&N.extras!=="skip"&&N.extras!=="ask") add("Additional benefits",extrasMap[N.extras]||N.extras);
  if(A.compare) add("Plan comparison","Reached plan review");
  add("Plan review outcome",reactionMap[R.reaction]);
  add("Follow-up decision",followMap[R.followupReason]);
  if(R.callbackDay) add("Callback day",dayMap[R.callbackDay]||R.callbackDay);
  if(R.callbackTime) add("Callback time",timeMap[R.callbackTime]||R.callbackTime);
  return lines;
}
function buildMedicareCallRecord(){
  const A=window.MCA||{};

  const date=Number.isNaN(d.getTime())?"":d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  const time=Number.isNaN(d.getTime())?"":d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  const summary=medicareCallSummaryLines();
  const notes=(A.notes||"").trim();
  return [
    "MEDICARE CALL NOTES",
    "Call Date: "+date,
    "Call Start Time: "+time,
    "",
    "CALL SUMMARY / WHAT WE DISCUSSED",
    summary.length?summary.map(x=>"• "+x).join("\n"):"• No workflow selections recorded yet.",
    "",
    "MY NOTES",
    notes||"No additional manual notes."
  ].join("\n");
}

      reason="you said the protection is mainly needed until the mortgage is paid";
    else if((L.obstacle||"").toLowerCase().includes("retirement"))
      reason="you said the protection is mainly needed until retirement";
    else
      reason="you described a financial need that lasts for a defined period of time";
  } else if(L.direction==="Permanent indicators"){
    type="Whole / Permanent Life";
    reason="you said you want coverage designed to remain with you for life";
  } else if(L.direction==="Compare both" || L.direction==="Undetermined"){
    type="Compare Both";
    reason="your answers do not point clearly to only one structure, so comparing both can help you see the differences";
  }
  L.suggestion=type;
  return {type,reason};
}

window.APPT = window.APPT || {line:"",stage:0,appointmentResponse:"",dayChoice:"",timeChoice:"",outcome:"",objection:""};

function apptLineLabel(k){
  return ({medicare:"Medicare",life:"Life",health:"Health",pc:"P&C"})[k]||"";
}
function apptSetLine(k){
  window.APPT={line:k,stage:1,appointmentResponse:"",dayChoice:"",timeChoice:"",outcome:"",objection:""};
  renderMain();
}
function apptReset(){
  window.APPT={line:"",stage:0,appointmentResponse:"",dayChoice:"",timeChoice:"",outcome:"",objection:""};
  renderMain();
}
function apptNext(stage){
  window.APPT.stage=stage;
  window.APPT.objection="";
  renderMain();
}
function apptBack(){
  const A=window.APPT;
  A.objection="";
  if(A.stage>=5) A.stage=4;
  else if(A.stage===4) A.stage=3;
  else if(A.stage===3) A.stage=2;
  else if(A.stage===2) A.stage=1;
  else return apptReset();
  renderMain();
}
function apptAnswer(k){
  const A=window.APPT;
  A.appointmentResponse=k;
  A.objection="";
  if(k==="yes") A.stage=3;
  else if(k==="later") A.stage=3;
  else A.stage=2;
  renderMain();
}
function apptChooseDay(k){
  window.APPT.dayChoice=k;
  window.APPT.stage=4;
  window.APPT.objection="";
  renderMain();
}
function apptChooseTime(k){
  window.APPT.timeChoice=k;
  window.APPT.stage=5;
  window.APPT.objection="";
  renderMain();
}
function apptSetOutcome(k){
  window.APPT.outcome=k;
  renderMain();
}
function apptShowObjection(k){
  window.APPT.objection=(window.APPT.objection===k?"":k);
  renderMain();
}
function apptObjectionText(k,line){

  const map={

    busy:["I’m busy right now.",`No problem — I don't need to go through the coverage with you now. I only need a moment to reserve a time when the licensed agent can call. Would tomorrow or the following day be easier?`],
    whyCalling:["What is this about?",`I'm calling to schedule a conversation with a licensed ${product} agent who can answer your questions and go over the coverage options that may be available. I'm only setting the appointment today.`],
    sendInfo:["Just send me information.",`I understand. Because the options can depend on your individual situation, the licensed agent can explain what is relevant and answer your questions. We can keep the appointment brief. Is earlier or later in the day usually better?`],
    spouse:["I need to talk to my spouse / family.",`Absolutely. You're welcome to have them on the call with you. We can schedule a time when you're both available so everyone can hear the same information and ask questions. What day usually works best?`],
    dontRemember:["I don’t remember requesting anything.",`I understand. I'm not asking you to make a decision or enroll in anything on this call. I'm calling only to see whether you'd like to schedule a conversation with a licensed agent. If you'd rather not, that's completely fine.`],
    number:["How did you get my number?",`I understand why you'd ask. I don't want to guess about the source of your information. Please refer to the lead or contact source shown in your approved system before answering that question.`],
    later:["Call me later.",`Absolutely. Instead of catching you at a bad time again, let's choose a day and time that works better for you. Would tomorrow or the following day be better?`],

    change:["Are you trying to change my coverage?",`No decision is being made on this call. I'm only scheduling a conversation with a licensed agent. They can answer questions and explain options, and you can decide whether you want to do anything after that.`]
  };
  return map[k]||["",""];
}
function apptObjections(line){

}

    const items = block.querySelectorAll('[data-checklist-item]');
    const progress = block.querySelector('[data-progress]');
    const total = items.length;

    function updateProgress(){
      let checkedCount = 0;
      items.forEach(item=>{
        const cb = item.querySelector('input[type="checkbox"]');
        if(cb.checked){
          item.classList.add('checked');
          checkedCount++;
        } else {
          item.classList.remove('checked');
        }
      });
      progress.textContent = `${checkedCount}/${total}`;
      progress.classList.toggle('complete', checkedCount === total);
    }

    items.forEach(item=>{
      const cb = item.querySelector('input[type="checkbox"]');
      cb.addEventListener('change', ()=>{
        checklistState[cb.id] = cb.checked;
        updateProgress();
        updateEligibilityResult();
      });
    });

    const resetBtn = block.querySelector('[data-checklist-reset]');
    if(resetBtn){

          const el = signalTally.querySelector(`[data-tally="${lean}"]`);
          if(el) el.textContent = count;
        });
      }
      updatePlanRecommendation(main);
    });
  });

}

function updatePlanRecommendation(main){
  const maCount = [...main.querySelectorAll('[data-signal-cb][data-lean="ma"]')].filter(c=>c.checked).length;
  const medsuppCount = [...main.querySelectorAll('[data-signal-cb][data-lean="medsupp"]')].filter(c=>c.checked).length;

  main.querySelectorAll('.plan-card').forEach(card=>{
    card.classList.remove('recommended');
  });

  if(maCount === 0 && medsuppCount === 0) return;

  let targetIds = [];
  if(maCount > medsuppCount){
    targetIds = ['plan-mapd', 'plan-ma'];
  } else if(medsuppCount > maCount){
    targetIds = ['plan-pdp-med-supp'];
  } else {
    return; // tie — don't guess
  }

  targetIds.forEach((id, i)=>{
    const card = main.querySelector(`#${id}`);
    if(!card) return;
    card.classList.add('recommended');
    if(i === 0 && !card.classList.contains('open')){
      card.classList.add('open');
    }
  });
}

  let html = `<div class="opening"><p>${cat.opening}</p></div>`;

      <div class="card answered ${searchTerm ? 'open' : ''}" data-idx="${i}">

  return html;
}

function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function computeEligibility(){
  const hasA = !!checklistState['elig-parta'];
  const hasB = !!checklistState['elig-partb'];
  const hasMedicaid = !!checklistState['elig-medicaid'];

  if(hasA && hasB){
    if(hasMedicaid){
      return {
        state: 'blocked',
        eligibleFor: ['Part D', 'Medicare Advantage / MAPD'],
        notEligibleFor: [{item:'Medicare Supplement', reason:'has Medicaid'}]
      };
    }
    return {
      state: 'full',
      eligibleFor: ['Part D', 'Medicare Advantage / MAPD', 'Medicare Supplement'],
      notEligibleFor: []
    };
  }
  if(hasA || hasB){
    return {
      state: 'partial',
      eligibleFor: ['Part D (standalone)'],
      notEligibleFor: [{item:'Medicare Advantage / MAPD', reason:`only has Part ${hasA ? 'A' : 'B'}`}, {item:'Medicare Supplement', reason:`only has Part ${hasA ? 'A' : 'B'}`}]
    };
  }
  return {
    state: 'unknown',
    eligibleFor: [],
    notEligibleFor: [],
    unknownText: 'Check Part A and Part B above to see what they qualify for.'
  };
}

function renderEligibilityResult(){
  const r = computeEligibility();
  return `
    <div class="eligibility-result state-${r.state}" data-eligibility-result>
      <span class="result-label">Auto-determined eligibility</span>
      ${r.unknownText ? `<p class="elig-line elig-unknown">❔ ${r.unknownText}</p>` : ''}
      ${r.eligibleFor.length ? `<p class="elig-line elig-good">✅ Eligible for: ${r.eligibleFor.join(', ')}</p>` : ''}
      ${r.notEligibleFor.map(n => `<p class="elig-line elig-bad">🚫 Not eligible for: ${n.item} — ${n.reason}</p>`).join('')}
    </div>
  `;
}

function renderChecklist(items, title, accent){

    <div class="checklist-block ${accentClass}" data-checklist>
      <div class="checklist-header">
        <span class="checklist-title">${title}</span>
        <span class="checklist-progress ${checkedCount === items.length ? 'complete' : ''}" data-progress>${checkedCount}/${items.length}</span>

        <div class="checklist-item ${checklistState[item.id] ? 'checked' : ''}" data-checklist-item>

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  renderMain();
});

document.addEventListener("click",function(e){
  const button=e.target.closest("[data-mca-action]");
  if(!button) return;
  e.preventDefault();
  e.stopPropagation();

  const action=button.dataset.mcaAction;
  const value=button.dataset.mcaValue;
  if(!window.MCA) window.MCA={path:"",newType:"",turn65Need:"",current:"",reason:"",notes:"",elig:{},enrollmentTiming:"",narrow:{},narrowContinue:false,priorities:{},followAction:"",eduStep:0,eduFamiliar:"",eduDirection:"",mbiStatus:"",compare:false,outcome:""};

  if(action==="branch"){
    const field=button.dataset.mcaField;
    if(!field) return;
    window.MCA[field]=value;
    window.MCA.compare=false; window.MCA.outcome="";
    if(field==="path"){
      window.MCA.newType=""; window.MCA.turn65Need=""; window.MCA.current=""; window.MCA.reason=""; window.MCA.followAction="";
      window.MCA.elig={}; window.MCA.narrow={}; window.MCA.narrowContinue=false; window.MCA.priorities={};
    } else if(field==="newType"){
      window.MCA.turn65Need="";
      window.MCA.elig={}; window.MCA.narrow={}; window.MCA.narrowContinue=false; window.MCA.priorities={};
    } else if(field==="current"){
      window.MCA.reason=""; window.MCA.followAction="";
      window.MCA.elig={}; window.MCA.narrow={}; window.MCA.narrowContinue=false; window.MCA.priorities={};
    }
  } else if(action==="turn65Need"){
    window.MCA.turn65Need=value;
    window.MCA.compare=false; window.MCA.outcome="";
    window.MCA.elig={}; window.MCA.narrow={}; window.MCA.narrowContinue=false; window.MCA.priorities={};
  } else if(action==="currentReason"){
    window.MCA.reason=value;
    window.MCA.compare=false; window.MCA.outcome="";
    window.MCA.elig={}; window.MCA.narrow={}; window.MCA.narrowContinue=false; window.MCA.priorities={};
  } else if(action==="followAction"){
    window.MCA.followAction=value;
  } else {
    return;
  }
  renderMain();
});
renderTabs();
renderMain();

// v21: collapse the completed opening while keeping it available on demand.
function mcaV21ApplyOpeningVisibility(){
 try{
  var st=window.MCA||{}; var progressed=!!(st.path||st.situation||st.followAction||st.followCadence);
  var root=document.getElementById('mca-main')||document.querySelector('.mca-main')||document;
  var els=Array.from(root.querySelectorAll('section,.card,.mca-card,.step,.panel,div')).filter(function(el){
   var h=el.querySelector&&el.querySelector('h1,h2,h3,h4,.title,.section-title');
   return h && /(?:☎\\s*)?Opening\\b/i.test((h.textContent||'').trim());
  });
  els.forEach(function(el){el.classList.toggle('mca-opening-hidden',progressed&&!st.showOpening);});
  var bar=document.getElementById('mca-opening-completed');
  if(progressed&&!bar){
   bar=document.createElement('div'); bar.id='mca-opening-completed'; bar.className='mca-opening-completed';
   bar.innerHTML='<strong>✓ Opening Completed</strong><button type="button">View Opening</button>';
   var btn=bar.querySelector('button'); btn.onclick=function(){st.showOpening=!st.showOpening;btn.textContent=st.showOpening?'Hide Opening':'View Opening';mcaV21ApplyOpeningVisibility();};
   var host=root.firstElementChild||root; if(host.parentNode) host.parentNode.insertBefore(bar,host.nextSibling); else root.prepend(bar);
  } else if(!progressed&&bar){bar.remove();}
 }catch(e){}
}
(function(){
 if(typeof renderMain==='function'){var oldRender=renderMain;renderMain=function(){var r=oldRender.apply(this,arguments);setTimeout(mcaV21ApplyOpeningVisibility,0);return r;};}
 document.addEventListener('click',function(){setTimeout(mcaV21ApplyOpeningVisibility,0);});setTimeout(mcaV21ApplyOpeningVisibility,0);
})();
</script>
