<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbook — Insurance Scripts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#16233A;
    --ink-soft:#2B3A54;
    --paper:#FAF8F3;
    --paper-dim:#F0ECE2;
    --line: rgba(22,35,58,0.12);
    --gold:#C89B3C;
    --teal:#3E6C6C;
    --red:#A33D3D;
    --shadow: 0 8px 24px rgba(22,35,58,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  .app{
    max-width:1100px;
    margin:0 auto;
    background:var(--paper);
    min-height:100vh;
  }

  /* HEADER */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:28px 24px 22px;
    position:relative;
    border-bottom:4px solid var(--gold);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{
    color:rgba(250,248,243,0.65);
    font-size:14px;
    max-width:520px;
    line-height:1.5;
  }

  /* SEARCH */
  .searchbar{
    margin-top:18px;
    display:flex;
    gap:8px;
  }
  .searchbar input{
    flex:1;
    background:rgba(250,248,243,0.08);
    border:1px solid rgba(250,248,243,0.22);
    color:var(--paper);
    padding:11px 14px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .searchbar input::placeholder{color:rgba(250,248,243,0.45);}
  .searchbar input:focus{outline:2px solid var(--gold); outline-offset:1px;}

  /* TABS */
  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:16px 24px;
    background:var(--paper-dim);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  .tab-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.03em;
    padding:8px 13px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{border-color:var(--gold);}
  .tab-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .tab-btn .count{
    opacity:.55;
    margin-left:5px;
  }

  /* MAIN */
  main{padding:26px 24px 60px;}

  .category-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:4px;
  }
  .category-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  .category-tagline{
    font-size:13px;
    color:var(--ink-soft);
    opacity:.7;
  }
  .category-desc{
    font-size:14px;
    color:var(--ink-soft);
    max-width:640px;
    line-height:1.6;
    margin:10px 0 22px;
  }

  /* OPENING SCRIPT CARD */
  .opening{
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:28px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .opening::before{
    content:"OPENING SCRIPT";
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.15em;
    color:var(--gold);
    display:block;
    margin-bottom:10px;
  }
  .opening p{
    margin:0;
    font-size:15.5px;
    line-height:1.65;
    font-family:'Fraunces',serif;
    font-weight:400;
  }
  .opening p + p{margin-top:12px;}

  /* ===== REQUIRED COMPLIANCE DISCLOSURE ===== */
  .compliance{
    background:#fff;
    border:2px solid var(--red);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:22px;
    position:relative;
  }
  .compliance-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:10px;
  }
  .compliance-label::before{
    content:"⚠";
    font-size:13px;
  }
  .compliance p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    font-weight:500;
  }
  .compliance-note{
    margin-top:10px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* ===== MINI DISCLOSURE (repeated per-call recording reminder) ===== */
  .mini-disclosure{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--red);
    border-radius:5px;
    padding:6px 10px;
    margin-bottom:10px;
  }
  .mini-disclosure .icon{font-size:11px; flex-shrink:0;}
  .mini-disclosure p{
    margin:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.01em;
    color:var(--red);
    font-weight:500;
  }

  /* ===== STAGE NOTE (don't read aloud) ===== */
  .stage-note{
    display:flex;
    align-items:flex-start;
    gap:8px;
    background:#FFF4CC;
    border:1px solid #E8C34A;
    border-radius:6px;
    padding:9px 12px;
    margin:12px 0;
  }
  .stage-note-icon{
    font-size:13px;
    line-height:1.4;
    flex-shrink:0;
  }
  .stage-note-body{flex:1;}
  .stage-note-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8A6D1A;
    display:block;
    margin-bottom:2px;
  }
  .stage-note p{
    margin:0;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    line-height:1.5;
    color:#5C4A10;
    font-style:italic;
  }

  /* OBJECTION LIST */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--red);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
    transition:box-shadow .15s ease;
  }
  .card.answered{border-left-color:var(--teal);}
  .card:hover{box-shadow:var(--shadow);}

  .card-q{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .card-q .qtext{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
  }
  .card-q .qtext::before{
    content:"“";
    color:var(--red);
    font-family:'Fraunces',serif;
    font-size:18px;
    margin-right:2px;
  }
  .chevron{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    transition:transform .18s ease;
    flex-shrink:0;
  }
  .card.open .chevron{transform:rotate(90deg);}

  .card-a{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
  }
  .card.open .card-a{max-height:1000px;}
  .card-a-inner{
    padding:0 18px 18px 18px;
    border-top:1px solid var(--line);
    margin-top:0;
  }
  .card-a-inner .say-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--teal);
    margin:14px 0 6px;
  }
  .card-a-inner p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ===== FRAMEWORK (Term / Whole / Final Expense) ===== */
  .fw-intro{
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 18px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .fw-intro b{color:var(--ink);}

  .fw-step{
    display:grid;
    grid-template-columns:52px 1fr;
    gap:16px;
    margin-bottom:22px;
  }
  .fw-step-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    color:var(--gold);
    line-height:1;
    text-align:center;
    padding-top:2px;
  }
  .fw-step-rail{
    position:relative;
  }
  .fw-step-rail::before{
    content:"";
    position:absolute;
    left:-38px;
    top:38px;
    bottom:-22px;
    width:1px;
    background:var(--line);
  }
  .fw-step:last-of-type .fw-step-rail::before{display:none;}

  .fw-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
  }
  .fw-step-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:8px;
  }
  .fw-ask{
    font-family:'Fraunces',serif;
    font-size:16px;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 14px;
  }
  .fw-ask::before{content:"“"; color:var(--gold); font-size:20px;}
  .fw-ask::after{content:"”"; color:var(--gold); font-size:20px;}

  .fw-answers{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  @media(min-width:560px){
    .fw-answers{grid-template-columns:1fr 1fr;}
  }
  .fw-answer{
    border-radius:6px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.5;
  }
  .fw-answer.bad{
    background:rgba(163,61,61,0.07);
    border:1px solid rgba(163,61,61,0.25);
  }
  .fw-answer.good{
    background:rgba(62,108,108,0.08);
    border:1px solid rgba(62,108,108,0.3);
  }
  .fw-answer .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  .fw-answer.bad .tag{color:var(--red);}
  .fw-answer.good .tag{color:var(--teal);}
  .fw-answer p{margin:0; color:var(--ink);}

  .fw-followup{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .fw-followup .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:4px;
  }

  .fw-close{
    margin-top:32px;
    padding-top:24px;
    border-top:2px solid var(--ink);
  }
  .fw-close-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .fw-close-head h3{
    font-family:'Fraunces',serif;
    font-size:20px;
    margin:0;
    color:var(--ink);
  }
  .fw-close-sub{
    font-size:13px;
    color:var(--ink-soft);
    opacity:.75;
  }
  .fw-close-intro{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:8px 0 18px;
  }

  .fw-option{
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .fw-option-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .fw-option-stack{
    font-size:14px;
    line-height:1.6;
    color:rgba(250,248,243,0.9);
    margin:0 0 10px;
  }
  .fw-option-price{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--paper);
    border-top:1px solid rgba(250,248,243,0.18);
    padding-top:10px;
  }
  .fw-option-price b{color:var(--gold);}

  /* ===== REFERENCE (Medicare parts & plan types) ===== */
  .ref-block{margin-bottom:28px;}
  .ref-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media(min-width:640px){
    .ref-grid{grid-template-columns:1fr 1fr;}
  }
  .ref-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--teal);
    border-radius:8px;
    padding:14px 16px;
  }
  .ref-card .ref-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--teal);
    margin-bottom:4px;
  }
  .ref-card .ref-title{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 6px;
  }
  .ref-card p{
    font-size:13px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0;
  }
  .ref-card.plan-type{border-left-color:var(--gold);}
  .ref-card.plan-type .ref-name{color:var(--gold);}

  /* ===== OBJECTION GROUPS (accordion sections) ===== */
  .obj-group{margin-bottom:14px;}
  .obj-group-head{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:7px;
    padding:12px 16px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-align:left;
  }
  .obj-group-head .count{
    opacity:.6;
    font-size:11px;
  }
  .obj-group-head .chevron{
    font-size:14px;
    color:var(--gold);
    transition:transform .18s ease;
    flex-shrink:0;
  }
  .obj-group.open .obj-group-head .chevron{transform:rotate(90deg);}
  .obj-group-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .obj-group.open .obj-group-body{max-height:12000px;}
  .obj-group-body-inner{padding-top:10px;}

  /* ===== SCRIPT PARTS (numbered sections, e.g. Medicare) ===== */
  .part-block{margin-bottom:30px;}
  .part-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .part-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    color:var(--gold);
    background:var(--ink);
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .part-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .jump-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    background:none;
    border:1px dashed var(--gold);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .jump-link:hover{background:rgba(200,155,60,0.1);}
  .quick-jump .jump-link{
    color:var(--paper);
    border-color:var(--gold);
    background:rgba(250,248,243,0.06);
    display:flex;
    width:100%;
    justify-content:center;
  }
  .quick-jump .jump-link:hover{background:rgba(200,155,60,0.2);}

  /* ===== STRATEGY NOTE ===== */
  .strategy-block{
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .strategy-block h4{
    font-family:'Fraunces',serif;
    font-size:15px;
    margin:0 0 12px;
    color:var(--ink);
  }
  .strategy-step{
    display:flex;
    gap:10px;
    margin-bottom:9px;
    font-size:13px;
    line-height:1.5;
  }
  .strategy-step:last-of-type{margin-bottom:0;}
  .strategy-step .s-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    color:var(--teal);
    flex-shrink:0;
    white-space:nowrap;
    padding-top:1px;
  }
  .strategy-step p{margin:0; color:var(--ink-soft);}
  .strategy-source{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.7;
  }

  /* ===== FLOWING SCRIPT CHUNKS (e.g. Plan Types script) ===== */
  .script-flow{margin-bottom:6px;}
  .script-chunk{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .script-chunk:last-of-type{border-bottom:none;}
  .script-chunk-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal);
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:5px;
    padding:4px 9px;
    height:fit-content;
    white-space:nowrap;
  }
  .script-chunk-text{
    font-family:'Fraunces',serif;
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink);
    margin:0;
  }
  .script-chunk-text + .mini-disclosure{margin-top:10px;}
  .mini-disclosure + .script-chunk-text{margin-top:0;}
  .script-chunk-note{
    margin:10px 0 0;
  }
  @media(max-width:520px){
    .script-chunk{grid-template-columns:1fr; gap:6px;}
    .script-chunk-tag{width:fit-content;}
  }

  /* ===== QUICK JUMP INDEX ===== */
  .quick-jump{
    background:var(--ink);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:20px;
  }
  .quick-jump-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .quick-jump-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .quick-jump-chip{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--paper);
    background:rgba(250,248,243,0.08);
    border:1px solid rgba(250,248,243,0.2);
    border-radius:16px;
    padding:6px 12px;
    cursor:pointer;
    text-align:left;
    line-height:1.3;
  }
  .quick-jump-chip:hover{
    background:rgba(200,155,60,0.25);
    border-color:var(--gold);
  }
  @keyframes flashHighlight{
    0%{background:rgba(200,155,60,0.35);}
    100%{background:transparent;}
  }
  .card.flash{animation:flashHighlight 1.4s ease-out;}

  footer{
    text-align:center;
    padding:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(250,248,243,0.4);
  }

  @media (max-width:640px){
    header{padding:22px 16px 18px;}
    nav.tabs{padding:12px 16px;}
    main{padding:20px 16px 50px;}
    .card-q .qtext{font-size:13.5px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>

let activeCategory = DATA[0].id;
let searchTerm = "";

function countBadge(cat){
  if(cat.type === 'framework') return '3-Q';
  if(cat.type === 'followup') return '4-day';
  if(cat.objectionGroups) return cat.objectionGroups.reduce((sum,g)=>sum+g.items.length,0);
  return cat.objections.length;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DATA.map(cat => `
    <button class="tab-btn ${cat.id===activeCategory?'active':''}" data-id="${cat.id}">
      ${cat.label} <span class="count">${countBadge(cat)}</span>
    </button>
  `).join('');
  tabs.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.id;
      renderTabs();
      renderMain();
    });
  });
}

function matchesSearch(obj){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return obj.q.toLowerCase().includes(t) || obj.a.toLowerCase().includes(t);
}

function renderQuickJump(cat, skip){
  const allItems = cat.objectionGroups.flatMap(g => g.items);
  if(allItems.length === 0) return '';
  return `
    <div class="quick-jump">
      <div class="quick-jump-label">Jump straight to an objection (${allItems.length})</div>
      <div class="quick-jump-list">
        ${allItems.map(o => `<button class="quick-jump-chip" data-target="obj-${slugify(o.q)}">${o.q}</button>`).join('')}
      </div>
      ${skip ? `<button class="jump-link" id="${skip.id}">${skip.label}</button>` : ''}
    </div>
  `;
}

function renderMain(){
  const main = document.getElementById('main');
  const cat = DATA.find(c=>c.id===activeCategory);

  let html = `
    <div class="category-head">
      <h2>${cat.label}</h2>
      <span class="category-tagline">${cat.tagline}</span>
    </div>
    <p class="category-desc">${cat.desc}</p>
  `;

  if(cat.objectionGroups){
    const groupsFor = (n) => cat.objectionGroups.filter(g => g.part === n);

    // Part 1 — Start of script, quick-jump index, then its own objections
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">1</div><div class="part-title">Start of Script</div></div>
        ${cat.openingIntro ? `<div class="opening"><p>${cat.openingIntro}</p></div>` : ''}
        ${cat.complianceDisclosure ? `
        <div class="compliance">
          <div class="compliance-label">Required disclosure — read word-for-word next</div>
          <p>${cat.complianceDisclosure}</p>
          <div class="compliance-note">Flows directly out of the intro line above, before continuing the pitch — per CMS marketing guidelines.</div>
        </div>
        ` : ''}
        ${cat.nameAsk ? `
        <div class="script-flow">
          <div class="script-chunk">
            <div class="script-chunk-tag">${cat.nameAsk.tag}</div>
            <div><p class="script-chunk-text">${cat.nameAsk.text}</p></div>
          </div>
        </div>
        ` : ''}
        ${cat.openingContinued ? `<div class="opening"><p>${cat.openingContinued}</p></div>` : ''}
        ${cat.opening ? `<div class="opening"><p>${cat.opening}</p></div>` : ''}
        ${cat.intakeScript ? `
        <p class="section-label">Get the rest of their info</p>
        <div class="script-flow">
          ${cat.intakeScript.map(c=>`
            <div class="script-chunk">
              <div class="script-chunk-tag">${c.tag}</div>
              <div><p class="script-chunk-text">${c.text}</p></div>
            </div>
          `).join('')}
        </div>
        ` : ''}
        ${renderQuickJump(cat, {id:"no-objection-jump", label:"No objection? Skip to Part 2 — Explain A &amp; B ↓"})}
        ${renderObjectionGroups(groupsFor(1))}
      </div>
    `;

    // Part 2 — Explain Original Medicare (A & B), plus Part C/D reference, with its own objections
    html += `
      <div class="part-block" id="part-2-block">
        <div class="part-head"><div class="part-num">2</div><div class="part-title">Explain Original Medicare (Part A &amp; B)</div></div>
        ${cat.partsAB ? `
        <div class="opening">
          <p>${cat.partsAB.ask}</p>
          <div class="stage-note">
            <span class="stage-note-icon">👁</span>
            <div class="stage-note-body">
              <span class="stage-note-label">Don't read aloud</span>
              <p>${cat.partsAB.note}</p>
            </div>
          </div>
          <p>${cat.partsAB.explain}</p>
        </div>
        ` : ''}
        ${cat.reference ? `
        <div class="ref-block">
          <p class="section-label">If they ask about Part C &amp; D too</p>
          <div class="ref-grid">
            ${cat.reference.parts.map(p=>`
              <div class="ref-card">
                <div class="ref-name">${p.name}</div>
                <div class="ref-title">${p.title}</div>
                <p>${p.desc}</p>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}
        ${renderObjectionGroups(groupsFor(2))}
      </div>
    `;

    // Part 3 — Get Medicare Details (MBI, Effective Date, Extra Help/LIS) — before looking at plans
    if(cat.medicareDetailsScript){
      html += `
        <div class="part-block">
          <div class="part-head"><div class="part-num">3</div><div class="part-title">Get Medicare Details</div></div>
          <div class="script-flow">
            ${cat.medicareDetailsScript.map(c=>`
              <div class="script-chunk">
                <div class="script-chunk-tag">${c.tag}</div>
                <div><p class="script-chunk-text">${c.text}</p></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Part 4 — Plan Types, as a flowing script broken into chunks
    if(cat.planTypeScript){
      html += `
        <div class="part-block">
          <div class="part-head"><div class="part-num">4</div><div class="part-title">Plan Types</div></div>
          <div class="script-flow">
            ${cat.planTypeScript.map(c=>`
              <div class="script-chunk">
                <div class="script-chunk-tag">${c.tag}</div>
                <div>
                  <p class="script-chunk-text">${c.text}</p>
                  ${c.note ? `
                  <div class="stage-note script-chunk-note">
                    <span class="stage-note-icon">👁</span>
                    <div class="stage-note-body">
                      <span class="stage-note-label">Don't read aloud</span>
                      <p>${c.note}</p>
                    </div>
                  </div>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Part 5 — Personal Health Info (doctors, medications) — collected after they pick a plan type
    if(cat.healthInfoScript){
      html += `
        <div class="part-block">
          <div class="part-head"><div class="part-num">5</div><div class="part-title">Get Their Health Info</div></div>
          <div class="script-flow">
            ${cat.healthInfoScript.map(c=>`
              <div class="script-chunk">
                <div class="script-chunk-tag">${c.tag}</div>
                <div><p class="script-chunk-text">${c.text}</p></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Part 6 — Network Types (HMO, EPO, POS, PPO, PFFS, SNP)
    if(cat.reference && cat.reference.networks){
      html += `
        <div class="part-block">
          <div class="part-head"><div class="part-num">6</div><div class="part-title">Network Types</div></div>
          ${cat.reference.networkQuestion ? `<div class="opening"><p>${cat.reference.networkQuestion}</p></div>` : ''}
          <div class="ref-block">
            <p class="section-label">HMO, EPO, POS, PPO, PFFS &amp; SNP</p>
            <div class="ref-grid">
              ${cat.reference.networks.map(p=>`
                <div class="ref-card">
                  <div class="ref-name">${p.name}</div>
                  <div class="ref-title">${p.title}</div>
                  <p>${p.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }
  }
  if(!cat.objectionGroups){
    html += renderGenericParts(cat);
  }

  main.innerHTML = html;

  main.querySelectorAll('.card-q').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.card').classList.toggle('open');
    });
  });

  main.querySelectorAll('.obj-group-head').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.obj-group').classList.toggle('open');
    });
  });

  main.querySelectorAll('.quick-jump-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const target = document.getElementById(chip.dataset.target);
      if(!target) return;
      target.classList.add('open');
      const group = target.closest('.obj-group');
      if(group) group.classList.add('open');
      target.scrollIntoView({behavior:'smooth', block:'center'});
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
    });
  });

  const noObjBtn = document.getElementById('no-objection-jump');
  if(noObjBtn){
    noObjBtn.addEventListener('click', ()=>{
      const part2 = document.getElementById('part-2-block');
      if(part2) part2.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
}

function renderCompliance(cat){
  if(!cat.complianceDisclosure) return '';
  return `
    <div class="compliance">
      <div class="compliance-label">Required disclosure — read word-for-word first</div>
      <p>${cat.complianceDisclosure}</p>
      <div class="compliance-note">Must be stated before anything else on the call.</div>
    </div>
  `;
}

function renderOpeningFlow(cat){
  return `
    ${cat.openingIntro ? `<div class="opening"><p>${cat.openingIntro}</p></div>` : ''}
    ${renderCompliance(cat)}
    ${cat.openingContinued ? `<div class="opening"><p>${cat.openingContinued}</p></div>` : ''}
    ${(!cat.openingIntro && cat.opening) ? `<div class="opening"><p>${cat.opening}</p></div>` : ''}
  `;
}

function renderGenericParts(cat){
  let html = '';

  if(cat.type === 'followup'){
    // Part 1 — The Cadence (Day 3 / 30 / 60 / 90)
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">1</div><div class="part-title">The Cadence</div></div>
        <div class="script-flow">
          ${cat.cadence.map(c=>`
            <div class="script-chunk">
              <div class="script-chunk-tag">${c.tag}</div>
              <div>
                <p class="script-chunk-text">${c.intro}</p>
                ${cat.recordingDisclosure ? `
                <div class="mini-disclosure">
                  <span class="icon">⚠</span>
                  <p>${cat.recordingDisclosure}</p>
                </div>
                ` : ''}
                <p class="script-chunk-text">${c.continued}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    // Part 2 — The Compliance Boundary + trigger phrases
    const groups = [{ section: "Trigger Phrases — Client-Initiated Only", items: cat.triggerPhrases }];
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">2</div><div class="part-title">The Compliance Boundary</div></div>
        <div class="compliance">
          <div class="compliance-label">Required rule — do not initiate</div>
          <p>${cat.complianceNote}</p>
          <div class="compliance-note">Only respond to these if the client says something like the phrases below, first.</div>
        </div>
        ${renderQuickJump({objectionGroups: groups})}
        ${renderObjectionGroups(groups)}
      </div>
    `;
    return html;
  }

  if(cat.type === 'framework'){
    // Part 1 — Start of Script
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">1</div><div class="part-title">Start of Script</div></div>
        ${renderOpeningFlow(cat)}
        ${cat.fwIntro ? `
        <div class="stage-note">
          <span class="stage-note-icon">👁</span>
          <div class="stage-note-body">
            <span class="stage-note-label">Coaching note — don't read aloud</span>
            <p>${cat.fwIntro}</p>
          </div>
        </div>
        ` : ''}
      </div>
    `;

    // Part 2 — Discovery Questions (goal / who / objection)
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">2</div><div class="part-title">Discovery Questions</div></div>
        ${cat.questions.map((q,i)=>`
          <div class="fw-step">
            <div class="fw-step-num">${i+1}</div>
            <div class="fw-step-rail">
              <div class="fw-card">
                <div class="fw-step-title">${q.title}</div>
                <p class="fw-ask">${q.ask}</p>
                <div class="fw-answers">
                  <div class="fw-answer bad"><span class="tag">Bad answer</span><p>${q.bad}</p></div>
                  <div class="fw-answer good"><span class="tag">Good answer</span><p>${q.good}</p></div>
                </div>
                <div class="fw-followup"><span class="tag">If they stall</span>${q.followUp}</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    // Part 3 — The Close
    html += `
      <div class="part-block">
        <div class="part-head"><div class="part-num">3</div><div class="part-title">The Close</div></div>
        <p class="fw-close-intro">${cat.close.intro}</p>
        ${cat.close.options.map(o=>`
          <div class="fw-option">
            <div class="fw-option-name">${o.name}</div>
            <p class="fw-option-stack">${o.stack}</p>
            <div class="fw-option-price">${o.price}</div>
          </div>
        `).join('')}
      </div>
    `;
    return html;
  }

  // Flat-objection categories (Health, Property, Auto) — wrap into a single group
  const groups = [{ section: "Common Objections", items: cat.objections }];
  html += `
    <div class="part-block">
      <div class="part-head"><div class="part-num">1</div><div class="part-title">Start of Script</div></div>
      ${renderOpeningFlow(cat)}
      ${renderQuickJump({objectionGroups: groups})}
      ${renderObjectionGroups(groups)}
    </div>
  `;
  return html;
}

function buildLegacyOpeningAndObjections(cat){
  if(cat.objectionGroups) return '';
  let html = `<div class="opening"><p>${cat.opening}</p></div>`;
  const filtered = cat.objections.filter(matchesSearch);
  html += `<p class="section-label">Common objections</p>`;
  if(filtered.length === 0){
    html += `<div class="empty">No objections match “${searchTerm}” in this category.</div>`;
  } else {
    html += filtered.map((o,i)=>`
      <div class="card answered ${searchTerm ? 'open' : ''}" data-idx="${i}">
        <button class="card-q">
          <span class="qtext">${o.q}</span>
          <span class="chevron">›</span>
        </button>
        <div class="card-a">
          <div class="card-a-inner">
            <div class="say-label">You say</div>
            <p>${o.a}</p>
          </div>
        </div>
      </div>
    `).join('');
  }
  return html;
}

function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function renderObjectionGroups(groups){
  return groups.map((g, gi)=>{
    const filtered = g.items.filter(matchesSearch);
    if(searchTerm && filtered.length === 0) return '';
    const openClass = searchTerm ? 'open' : '';
    return `
      <div class="obj-group ${openClass}" data-gidx="${gi}">
        <button class="obj-group-head">
          <span>${g.section} <span class="count">${filtered.length}</span></span>
          <span class="chevron">›</span>
        </button>
        <div class="obj-group-body">
          <div class="obj-group-body-inner">
            ${filtered.map((o,i)=>`
              <div class="card answered ${openClass}" id="obj-${slugify(o.q)}" data-idx="${gi}-${i}">
                <button class="card-q">
                  <span class="qtext">${o.q}</span>
                  <span class="chevron">›</span>
                </button>
                <div class="card-a">
                  <div class="card-a-inner">
                    <div class="say-label">You say</div>
                    <p>${o.a}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

          <div class="fw-step-title">${q.title}</div>

          </div>

      ${cat.close.options.map(o=>`
        <div class="fw-option">
          <div class="fw-option-name">${o.name}</div>
          <p class="fw-option-stack">${o.stack}</p>
          <div class="fw-option-price">${o.price}</div>
        </div>
      `).join('')}
    </div>
  `;

  main.innerHTML = html;
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  renderMain();
});

renderTabs();
renderMain();
</script>
</body>
</html>
